g": "安定化", "s": 0, "r": "cold stabilisation（冷却安定化）／fining（清澄）", "n": "瓶内での濁りや結晶、再発酵などを防ぐための処理。酒石や微生物の安定化など、出荷前の品質保持に行う。"}, {"no": 347, "f": "醸造", "h": "sterile bottling", "i": "/ˈsterəl ˈbɒtlɪŋ/", "p": "名詞句", "g": "無菌瓶詰め", "s": 0, "r": "sterile filtration（無菌濾過）／microbial stability（微生物安定性）／bottling（瓶詰め）", "n": "微生物汚染を抑えた状態で瓶詰めし、瓶内での再発酵や劣化を防ぐ工程。"}, {"no": 348, "f": "醸造", "h": "sterile filtration", "i": "/ˈsteraɪl fɪlˈtreɪʃən/", "p": "名詞句", "g": "無菌濾過", "s": 0, "r": "membrane filtration（膜濾過）／sterile bottling（無菌瓶詰め）／microbial stability（微生物安定性）", "n": "瓶詰め前に微生物を除去し、再発酵や微生物汚染のリスクを低減する濾過。"}, {"no": 349, "f": "醸造", "h": "stuck fermentation", "i": "/stʌk ˌfɜːrmenˈteɪʃən/", "p": "名詞句", "g": "発酵停止", "s": 0, "r": "nutrient（栄養分・栄養剤）／inoculation（酵母の植菌）／temperature control（温度管理）", "n": "発酵中に酵母の活動が止まり、糖が残ったまま発酵が進まなくなる状態。"}, {"no": 350, "f": "醸造", "h": "sulfur compounds", "i": "/ˈsʌlfər ˈkɒmpaʊndz/", "p": "名詞句", "g": "硫黄化合物", "s": 0, "r": "volatile sulfur compounds（揮発性硫黄化合物）／sulfur dioxide（二酸化硫黄）／reduction（還元）", "n": "ワイン中の硫黄を含む化合物の総称。種類と濃度によって好ましい香りにも欠陥香にもなる。"}, {"no": 351, "f": "醸造", "h": "sulfur dioxide", "i": "/ˈsʌlfər daɪˈɒksaɪd/", "p": "名詞句", "g": "二酸化硫黄（SO₂）", "s": 0, "r": "oxidation（酸化）／protective winemaking（保護的醸造）", "n": "酸化や微生物の働きを抑える添加物。ワインの鮮度と品質を保つために使用される。ワイン業界では「亜硫酸」とも呼ばれる。"}, {"no": 352, "f": "醸造", "h": "sun-drying", "i": "/ˈsʌn ˌdraɪɪŋ/", "p": "名詞", "g": "天日乾燥（ブドウを干して糖を凝縮する方法）", "s": 0, "r": "raisining（干しブドウ化）／passerillage（パスリヤージュ）／recioto（レチョート）", "n": "収穫したブドウを日光にさらして乾燥させ、糖分や風味を凝縮する方法。甘口ワインの製造などに用いられる。"}, {"no": 353, "f": "醸造", "h": "sur lie", "i": "/syʁ ˈli/", "p": "名詞句・形容詞", "g": "シュル・リー（澱の上で熟成させる手法・表示）", "s": 0, "r": "lees（澱）／lees stirring（バトナージュ）", "n": "発酵後も澱と接触させたまま熟成する手法。旨味や厚み、複雑さを与える。"}, {"no": 354, "f": "醸造", "h": "tartaric stabilization", "i": "/tɑːrˈtærɪk ˌsteɪbəlɪˈzeɪʃən/", "p": "名詞句", "g": "酒石安定化", "s": 0, "r": "cold stabilisation（低温安定化）／tartrate crystals（酒石結晶）／contact process（コンタクト法）", "n": "瓶詰め後に酒石が析出しないよう、酒石酸塩の結晶化を制御する処理。"}, {"no": 355, "f": "醸造", "h": "tartrate crystals", "i": "/ˈtɑːrtreɪt ˈkrɪstəlz/", "p": "名詞句", "g": "酒石結晶", "s": 0, "r": "tartaric acid（酒石酸）／tartaric stabilization（酒石安定化）／cold stabilisation（低温安定化）", "n": "低温などで酒石酸塩が結晶化して生じる結晶。品質上は無害だが外観上問題となることがある。"}, {"no": 356, "f": "醸造", "h": "technical cork", "i": "/ˈteknɪkl̩ kɔːk/", "p": "名詞句", "g": "テクニカルコルク（加工コルク）", "s": 0, "r": "closure（栓）／cork taint（コルク臭）", "n": "コルク粒やコルク素材を加工して成形した栓。天然コルクに比べ、コルク臭のリスクを抑えやすい。"}, {"no": 357, "f": "醸造", "h": "temperature control", "i": "/ˈtɛmprətʃər kənˈtroʊl/", "p": "名詞句", "g": "温度管理", "s": 0, "r": "fermentation（発酵）／maceration（醸し）", "n": "発酵や醸しの温度を調整する操作。発酵速度や抽出、香り・風味に影響を与える。"}, {"no": 358, "f": "醸造", "h": "thermovinification", "i": "/ˌθɜːməʊvɪnɪfɪˈkeɪʃən/", "p": "名詞", "g": "サーモヴィニフィケーション（加熱による色素抽出法）", "s": 0, "r": "flash détente（フラッシュ・デタント）", "n": "果醪を加熱して果皮から色素を抽出する醸造法。短時間で色を抽出でき、タンニンは比較的少なくなる。"}, {"no": 359, "f": "醸造", "h": "topping up", "i": "/ˌtɒpɪŋ ˈʌp/", "p": "名詞", "g": "トッピングアップ（樽への補酒・補充）", "s": 0, "r": "ullage（ウラージュ）", "n": "蒸発などで減った樽にワインを補充する作業。ワインと空気の接触を抑え、酸化を防ぐ目的で行う。"}, {"no": 360, "f": "醸造", "h": "ullage", "i": "/ˈʌlɪdʒ/", "p": "名詞", "g": "ウラージュ（樽内の目減り／液面上の空間）", "s": 0, "r": "topping up（トッピングアップ）／oxidation（酸化）", "n": "蒸発などでワインが減ることで生じる、容器内の液面上の空間。樽では酸素との接触を増やし、酸化に影響する。"}, {"no": 361, "f": "醸造", "h": "unoaked", "i": "/ʌnˈoʊkt/", "p": "形容詞", "g": "オーク樽を使わない／オークの影響を受けていない", "s": 0, "r": "oak influence（樽の影響）／neutral oak（ニュートラルオーク・古樽）", "n": "オーク樽を使用せず、バニラなど樽由来の香味をつけていないワインの形容。品種や産地の個性が素直に表れやすい。"}, {"no": 362, "f": "醸造", "h": "vinification", "i": "/ˌvɪnɪfɪˈkeɪʃən/", "p": "名詞", "g": "醸造（ワイン醸造）", "s": 0, "r": "viticulture（ブドウ栽培）／fermentation（発酵）", "n": "ブドウをワインに変える醸造工程の総称。winemakingとほぼ同義で、破砕・圧搾から発酵、熟成などの工程を含む。"}, {"no": 363, "f": "醸造", "h": "volatile acidity", "i": "/ˈvɒlətaɪl əˈsɪdəti/", "p": "名詞句", "g": "揮発酸", "s": 0, "r": "acetic acid（酢酸）／ethyl acetate（酢酸エチル）", "n": "酸などの揮発性酸による、酢や除光液を思わせる香り。少量は複雑さに寄与するが、過剰だと欠陥となる。"}, {"no": 364, "f": "醸造", "h": "whole bunch", "i": "/ˌhəʊl ˈbʌntʃ/", "p": "名詞句", "g": "全房（除梗せず房ごと）", "s": 0, "r": "destemming（除梗）／whole bunch fermentation（全房発酵）", "n": "除梗せず、梗を含む房ごとのブドウ。発酵に用いることで、香りやタンニン、骨格に影響を与える。"}, {"no": 365, "f": "醸造", "h": "whole bunch fermentation", "i": "/ˌhəʊl ˈbʌntʃ ˌfɜːmenˈteɪʃən/", "p": "名詞句", "g": "全房発酵（梗ごと発酵させる手法）", "s": 0, "r": "whole bunch（全房）／carbonic maceration（炭酸ガス浸漬法）", "n": "除梗せず房ごと発酵させる手法。香りや鮮度、タンニンの質に影響を与える。未熟な梗は青っぽい風味につながる。"}, {"no": 366, "f": "醸造", "h": "whole bunch pressing", "i": "/ˌhəʊl ˈbʌntʃ ˌpresɪŋ/", "p": "名詞句", "g": "全房圧搾（除梗せず房ごと圧搾する手法）", "s": 0, "r": "whole bunch（全房）／pressing（圧搾）", "n": "梗を残して房ごと圧搾する方法。固形物やフェノールの抽出を抑え、果汁を穏やかに得られる。白・ロゼワインなどで用いられる。"}, {"no": 367, "f": "醸造", "h": "whole-cluster fermentation", "i": "/hoʊl ˈklʌstər ˌfɜːrmenˈteɪʃən/", "p": "名詞句", "g": "全房発酵", "s": 0, "r": "whole bunch（全房）／stem inclusion（梗の使用）／carbonic maceration（炭酸ガス浸透法）", "n": "除梗せず果房全体を使って発酵させる方法。梗由来のタンニンや香味、発酵挙動に影響する。"}, {"no": 368, "f": "醸造", "h": "yeast", "i": "/jiːst/", "p": "名詞", "g": "酵母", "s": 0, "r": "ambient yeast（自然酵母）／cultured yeast（培養酵母）", "n": "糖をアルコールへ変える微生物。培養酵母と自然酵母があり、選択が香りや発酵の安定性を左右する。"}, {"no": 369, "f": "醸造", "h": "American oak", "i": "/əˌmɛrɪkən ˈəʊk/", "p": "名詞句", "g": "アメリカンオーク（米国産の樫材）", "s": 0, "r": "French oak（フレンチオーク）／oak（オーク）", "n": "ココナツや甘いスパイスの香りを与えやすく、フレンチオークより香味が強く出やすい。比較的安価。"}, {"no": 370, "f": "醸造", "h": "amphora", "i": "/ˈæmfərə/", "p": "名詞", "g": "アンフォラ（素焼き壺の醸造容器）", "s": 0, "r": "concrete egg（コンクリートエッグ）／orange wine（オレンジワイン）", "n": "発酵・熟成に用いる素焼きの壺。古代から使われてきた伝統的な容器で、近年はオレンジワインなどで再評価されている。"}, {"no": 371, "f": "醸造", "h": "barrel", "i": "/ˈbærəl/", "p": "名詞", "g": "樽", "s": 0, "r": "barrique（バリック）／foudre（フードル）", "n": "ワインの発酵・熟成に用いる樽。主にオーク製で、木由来の風味や微量の酸素供給がワインに影響を与える。"}, {"no": 372, "f": "醸造", "h": "barrel fermentation", "i": "/ˈbærəl ˌfɜːmenˈteɪʃən/", "p": "名詞句", "g": "樽内発酵", "s": 0, "r": "barrel（樽）／oak（オーク）", "n": "樽の中で発酵を行う手法。オーク由来の風味や微量の酸素供給により、複雑さや質感を与える。"}, {"no": 373, "f": "醸造", "h": "barrel head", "i": "/ˈbærəl hed/", "p": "名詞句", "g": "樽の鏡板", "s": 0, "r": "stave（樽板）／bung（樽栓）／cooperage（樽製造）", "n": "樽の両端を閉じる円形の板。"}, {"no": 374, "f": "醸造", "h": "barrel toast", "i": "/ˈbærəl toʊst/", "p": "名詞句", "g": "樽のトースト", "s": 0, "r": "toast（トースト香）／cooperage（樽製造）／oak influence（オークの影響）", "n": "樽材の内側を加熱して焼き付ける工程。焼きの強さが香味成分や樽由来の風味に影響する。"}, {"no": 375, "f": "醸造", "h": "barrique", "i": "/baˈʁik/", "p": "名詞", "g": "バリック（約225Lのボルドー型小樽）", "s": 0, "r": "pièce（ピエス）／barrel（樽）", "n": "一般に容量225Lの小型オーク樽。オーク由来の香りやタンニンを与え、ワインの熟成に用いられる。"}, {"no": 376, "f": "醸造", "h": "botti", "i": "/ˈbɔtti/", "p": "名詞", "g": "ボッティ（イタリアの大樽）", "s": 0, "r": "botte（ボッテ、単数形）／foudre（フードル）", "n": "バローロなどで伝統的に使われる大型のオーク樽。新樽香を抑えた熟成に用いられる。"}, {"no": 377, "f": "醸造", "h": "chestnut", "i": "/ˈtʃɛsnʌt/", "p": "名詞", "g": "栗材（樽の材料としての栗）", "s": 0, "r": "oak（オーク）／barrel（樽）", "n": "樽材として使われる栗の木。オークよりタンニンや酸素透過の影響が強く、伝統的な醸造で用いられることがある。"}, {"no": 378, "f": "醸造", "h": "concrete egg", "i": "/ˈkɒŋkriːt eɡ/", "p": "名詞句", "g": "コンクリートエッグ（卵形のコンクリート発酵・熟成槽）", "s": 0, "r": "concrete tank（コンクリートタンク）／amphora（アンフォラ）", "n": "卵形のコンクリート槽。内部で対流が生じやすく、澱との接触を促す。木の風味を加えず、発酵・熟成に用いられる。"}, {"no": 379, "f": "醸造", "h": "concrete tank", "i": "/ˈkɒŋkriːt ˌtæŋk/", "p": "名詞句", "g": "コンクリートタンク（コンクリート槽）", "s": 0, "r": "concrete egg（コンクリートエッグ）", "n": "木の風味を加えず、温度を安定させやすい発酵・熟成容器。微量の酸素がワインの質感に影響する。"}, {"no": 380, "f": "醸造", "h": "cooper", "i": "/ˈkuːpər/", "p": "名詞", "g": "樽職人", "s": 0, "r": "cooperage（樽製造・樽業）／stave（樽板）／barrel（樽）", "n": "木樽を製造・修理する職人。"}, {"no": 381, "f": "醸造", "h": "cooperage", "i": "/ˈkuːpərɪdʒ/", "p": "名詞", "g": "樽製造・樽業", "s": 0, "r": "cooper（樽職人）／barrel toast（樽のトースト）／stave（樽板）", "n": "木樽の製造業、または樽製造そのものを指す語。"}, {"no": 382, "f": "醸造", "h": "demi-muid", "i": "/dəmi ˈmɥi/", "p": "名詞", "g": "ドゥミ・ミュイ（約600Lの大樽）", "s": 0, "r": "foudre（フードル）／barrique（バリック）", "n": "ローヌなどで使われる約600Lの樽。容量が大きいほど樽香の影響は穏やかになる。"}, {"no": 383, "f": "醸造", "h": "demijohn", "i": "/ˈdɛmidʒɒn/", "p": "名詞", "g": "デミジョン（大型ガラス容器）", "s": 0, "r": "oxidative ageing（酸化熟成）", "n": "ワインの発酵・熟成などに用いる大型のガラス容器。ボンボンヌ（bonbonne）とも呼ばれる。"}, {"no": 384, "f": "醸造", "h": "foudre", "i": "/ˈfudʁ/", "p": "名詞", "g": "フードル（大型木製発酵・熟成槽）", "s": 0, "r": "barrel（樽）／barrique（バリック）／oak（オーク）", "n": "大型の木製発酵・熟成容器。新樽のような木の風味を強く与えず、緩やかな酸素接触をもたらす。"}, {"no": 385, "f": "醸造", "h": "French oak", "i": "/ˌfrɛntʃ ˈəʊk/", "p": "名詞句", "g": "フレンチオーク（フランス産の樫材）", "s": 0, "r": "American oak（アメリカンオーク）／oak（オーク）", "n": "スパイスやトーストなどの繊細な風味とタンニンを与えやすく、アメリカンオークより比較的高価。"}, {"no": 386, "f": "醸造", "h": "hogshead", "i": "/ˈhɒɡzhɛd/", "p": "名詞", "g": "ホグスヘッド（約300Lの樽）", "s": 0, "r": "barrique（バリック、225L）／puncheon（パンチョン）", "n": "オーストラリアやニュージーランドで広く使われる約300Lの樽。"}, {"no": 387, "f": "醸造", "h": "neutral oak", "i": "/ˌnjuːtrəl ˈoʊk/", "p": "名詞句", "g": "ニュートラルオーク（香味を与えにくい樽）", "s": 0, "r": "new oak（新樽）／oak influence（オークの影響）／foudre（フードル・大樽）", "n": "使用を重ね、バニラなど新樽由来の香味をほとんど与えなくなったオーク樽。"}, {"no": 388, "f": "醸造", "h": "oak", "i": "/oʊk/", "p": "名詞", "g": "オーク（樽材）", "s": 0, "r": "French oak（フレンチオーク）／American oak（アメリカンオーク）", "n": "熟成や発酵に使われる木材。香りやタンニンを与え、微量の酸素を通してワインの複雑さに影響する。"}, {"no": 389, "f": "醸造", "h": "oak alternatives", "i": "/ˈoʊk ɔːlˈtɜːnətɪvz/", "p": "名詞句", "g": "オーク代替材（チップ・板材等）", "s": 0, "r": "oak chips（オークチップ）／oak stave（オーク・ステーブ）", "n": "樽を使わずにオーク由来の香りや風味を与えるチップや板材などの総称。"}, {"no": 390, "f": "醸造", "h": "oak chips", "i": "/ˈəʊk ˌtʃɪps/", "p": "名詞句", "g": "オークチップ（木片添加によるオーク風味付け）", "s": 0, "r": "oak alternatives（オーク代替材）／oak stave（オーク・ステーブ）", "n": "タンクなどに加えて、オーク由来の香りや風味を与える小さな木片。樽熟成より低コストで使用できる。"}, {"no": 391, "f": "醸造", "h": "oak influence", "i": "/oʊk ˈɪnfluəns/", "p": "名詞句", "g": "オークの影響", "s": 0, "r": "barrel toast（樽のトースト）／oak chips（オークチップ）／neutral oak（ニュートラルオーク）", "n": "樽材やトースト由来の香味、タンニン、酸素との接触などがワインに与える影響。"}, {"no": 392, "f": "醸造", "h": "oak stave", "i": "/ˈoʊk ˌsteɪv/", "p": "名詞句", "g": "オーク・ステーブ（板材）", "s": 0, "r": "oak alternatives（オーク代替材）／oak chips（オークチップ）", "n": "タンクなどに入れて、オーク由来の香りや風味を与える板材。チップより穏やかに風味を抽出できる。"}, {"no": 393, "f": "醸造", "h": "pièce", "i": "/pjɛs/", "p": "名詞", "g": "ピエス（約228Lのブルゴーニュ型樽）", "s": 0, "r": "barrique（バリック）／barrel（樽）", "n": "ブルゴーニュで伝統的に使われる、容量約228Lの樽。ワインの発酵・熟成に用いられる。"}, {"no": 394, "f": "醸造", "h": "puncheon", "i": "/ˈpʌntʃən/", "p": "名詞", "g": "パンチョン（大型木樽）", "s": 0, "r": "tonneau（トノー）／barrique（バリック）／demi-muid（ドゥミ・ミュイ）", "n": "通常のバリックより大きい木樽。容量は産地や製造者によって異なる。"}, {"no": 395, "f": "醸造", "h": "qvevri", "i": "/ˈkvɛvri/", "p": "名詞", "g": "クヴェヴリ（ジョージアの土中埋設甕）", "s": 0, "r": "amphora（アンフォラ）／orange wine（オレンジワイン）", "n": "地中に埋めた素焼きの大甕。発酵・熟成に用いるジョージアの伝統的な醸造容器で、その製法はユネスコ無形文化遺産に登録されている。"}, {"no": 396, "f": "醸造", "h": "stave", "i": "/steɪv/", "p": "名詞", "g": "樽板", "s": 0, "r": "barrel head（樽の鏡板）／cooper（樽職人）／bung（樽栓）", "n": "樽の胴体を構成する細長い木板。"}, {"no": 397, "f": "醸造", "h": "toast", "i": "/toʊst/", "p": "名詞", "g": "トースト（樽の焼き）", "s": 0, "r": "barrel（樽）／Maillard reaction（メイラード反応）", "n": "樽の内側を火で焼き付ける度合い。強いほど香ばしさや燻香が増し、ワインの香りに影響を与える。"}, {"no": 398, "f": "醸造", "h": "tonneau", "i": "/təˈnoʊ/", "p": "名詞", "g": "トノー（大型樽）", "s": 0, "r": "puncheon（パンチョン）／barrique（バリック）／foudre（フードル・大樽）", "n": "バリックより大きな木樽を指す一般的な呼称。容量は一定ではない。"}, {"no": 399, "f": "醸造", "h": "vessel", "i": "/ˈvesəl/", "p": "名詞", "g": "醸造・熟成容器", "s": 0, "r": "amphora（アンフォラ）／concrete egg（コンクリートエッグ）／barrel（樽）", "n": "発酵・熟成に使う容器の総称。木樽、コンクリート、ステンレスなどを含む。"}, {"no": 400, "f": "スパークリングワイン", "h": "ancestral method", "i": "/ænˈsɛstrəl ˌmɛθəd/", "p": "名詞句", "g": "アンセストラル方式（先祖伝来方式）", "s": 0, "r": "pét-nat（ペットナット）／méthode ancestrale（メトード・アンセストラル、仏名）", "n": "発酵途中のワインを瓶詰めし、瓶内で発酵を続けて泡を得る、単一発酵の方式。ペットナットが代表例。"}, {"no": 401, "f": "スパークリングワイン", "h": "Asti method", "i": "/ˈæsti ˌmeθəd/", "p": "名詞句", "g": "アスティ方式", "s": 0, "r": "tank method（タンク方式）／spumante（スプマンテ）", "n": "タンク方式の変種。ティラージュ液を加えず、加圧タンク内で一度だけ発酵させ、途中で密閉してCO₂を保持。所定の圧力・残糖量に達したら冷却して発酵を止める。"}, {"no": 402, "f": "スパークリングワイン", "h": "atmosphere", "i": "/ˈætməsfɪər/", "p": "名詞", "g": "気圧（圧力の単位）", "s": 0, "r": "bar（バール）", "n": "瓶内CO₂圧などを表す圧力の単位。1バール≒1気圧。フルスパークリングは5〜6バール、セミスパークリングは1〜2.5バール。"}, {"no": 403, "f": "スパークリングワイン", "h": "bar", "i": "/bɑːr/", "p": "名詞", "g": "バール（圧力の単位）", "s": 0, "r": "atmosphere（気圧）", "n": "発泡ワインの瓶内圧を示す単位。1バール≒1気圧。フルスパークリングは5〜6バール、セミスパークリングは1〜2.5バール。"}, {"no": 404, "f": "スパークリングワイン", "h": "base wine", "i": "/ˈbeɪs waɪn/", "p": "名詞句", "g": "ベースワイン（二次発酵前の原酒）", "s": 0, "r": "reserve wine（リザーヴワイン）／second fermentation（二次発酵）", "n": "二次発酵前のスパークリングワインの原酒。高酸・低アルコールで、ブレンドの素材となる。"}, {"no": 405, "f": "スパークリングワイン", "h": "blanc de blancs", "i": "/ˌblɒ̃ də ˈblɒ̃/", "p": "名詞句", "g": "ブラン・ド・ブラン（白ブドウのみの白）", "s": 0, "r": "blanc de noirs（ブラン・ド・ノワール、対のスタイル）", "n": "白ブドウのみから造る白のスパークリング。シャンパーニュではシャルドネが典型となる。"}, {"no": 406, "f": "スパークリングワイン", "h": "blanc de noirs", "i": "/ˌblɒ̃ də ˈnwɑːr/", "p": "名詞句", "g": "ブラン・ド・ノワール（黒ブドウのみの白）", "s": 0, "r": "blanc de blancs（ブラン・ド・ブラン、対のスタイル）", "n": "黒ブドウのみから造る白のスパークリング。シャンパーニュではピノ・ノワールやムニエが用いられる。"}, {"no": 407, "f": "スパークリングワイン", "h": "bottle fermentation", "i": "/ˈbɒtl ˌfɜːmenˈteɪʃən/", "p": "名詞句", "g": "瓶内発酵（瓶中で行う二次発酵）", "s": 0, "r": "second fermentation（二次発酵）／tank method（タンク方式、対概念）", "n": "瓶内で二次発酵を行う製法。traditional method（伝統的方式）やtransfer method（移瓶方式）などがある。"}, {"no": 408, "f": "スパークリングワイン", "h": "bottle pressure", "i": "/ˈbɒtl ˈpreʃər/", "p": "名詞句", "g": "瓶内圧力", "s": 0, "r": "atmosphere（気圧）／mousse（ムース・泡立ち）／prise de mousse（プリーズ・ド・ムース・発泡形成）", "n": "スパークリングワインの瓶内にかかる二酸化炭素による圧力。"}, {"no": 409, "f": "スパークリングワイン", "h": "bubble", "i": "/ˈbʌbl̩/", "p": "名詞", "g": "気泡", "s": 0, "r": "foam（泡）／mousse（ムース）", "n": "溶存CO₂が形成する気泡。グラスの形状や温度などにより、気泡の大きさや立ち上り方が変わる。"}, {"no": 410, "f": "スパークリングワイン", "h": "carbonation", "i": "/ˌkɑːbəˈneɪʃən/", "p": "名詞", "g": "炭酸化（カーボネーション）", "s": 0, "r": "injection method（注入方式）", "n": "ワインにCO₂を直接注入して炭酸ガスを含ませる方法。果実味を保ちやすいが、泡は比較的消えやすい。"}, {"no": 411, "f": "スパークリングワイン", "h": "cava", "i": "/ˈkava/", "p": "名詞", "g": "カバ（スペインの伝統的方式スパークリング）", "s": 0, "r": "Crémant（クレマン）／Sekt（ゼクト）／prosecco（プロセッコ）", "n": "スペインの伝統的方式によるスパークリングワインのDOP。マカベオなどを用い、澱熟成期間により複数の区分に分かれる。"}, {"no": 412, "f": "スパークリングワイン", "h": "Charmat method", "i": "/ʃɑːˈmɑː ˌmɛθəd/", "p": "名詞句", "g": "シャルマ方式（タンク方式の別称）", "s": 0, "r": "tank method（タンク方式）／prosecco（プロセッコ）", "n": "タンク方式の別称。加圧タンク内で二次発酵を行い、Proseccoなど果実味を重視するスパークリングに用いられる。"}, {"no": 413, "f": "スパークリングワイン", "h": "CM (coopérative de manipulation)", "i": "/kɔpeʁaˈtiv də manipylaˈsjɔ̃/", "p": "名詞", "g": "コーペラティヴ・ド・マニピュラシオン（協同組合方式のシャンパーニュ生産者）", "s": 0, "r": "NM (négociant manipulant)（NM）／RM (récoltant-manipulant)（RM）／co-operative（協同組合）", "n": "組合員が持ち寄ったブドウをまとめて醸造・販売する協同組合。ラベルにCMと表示される。"}, {"no": 414, "f": "スパークリングワイン", "h": "crown cap", "i": "/ˈkraʊn kæp/", "p": "名詞句", "g": "王冠栓（二次発酵時の金属栓）", "s": 0, "r": "muselet（ミュズレ）／closure（栓）", "n": "二次発酵中の瓶を密封する金属製の栓。澱を受ける小さな樹脂製カップを保持する。"}, {"no": 415, "f": "スパークリングワイン", "h": "Crémant", "i": "/kʁeˈmɑ̃/", "p": "名詞", "g": "クレマン（瓶内二次発酵の仏産スパークリング）", "s": 0, "r": "cava（カバ）／Sekt（ゼクト）", "n": "シャンパーニュ地方以外で伝統的方式により造るスパークリングワインの呼称。ロワールやボルドーなど各地にAOPがある。"}, {"no": 416, "f": "スパークリングワイン", "h": "disgorgement", "i": "/dɪsˈɡɔːdʒmənt/", "p": "名詞", "g": "澱抜き", "s": 0, "r": "dégorgement（澱抜きの仏名）／dosage（ドサージュ）", "n": "瓶口に集めた酵母の澱を排出する工程。瓶口を凍らせて澱を氷塊にし、瓶内圧で除去する方法が一般的。"}, {"no": 417, "f": "スパークリングワイン", "h": "dosage", "i": "/doʊˈzɑːʒ/", "p": "名詞", "g": "ドサージュ（門出のリキュール添加）", "s": 0, "r": "liqueur d'expédition（門出のリキュール）／disgorgement（澱抜き）", "n": "澱抜き後に門出のリキュールを加える工程。糖分を加えて最終的な甘辛度を調整する。"}, {"no": 418, "f": "スパークリングワイン", "h": "foam", "i": "/fəʊm/", "p": "名詞", "g": "泡（液面に形成される泡の層）", "s": 0, "r": "mousse（ムース）／bubble（気泡）", "n": "液面に形成される泡の層。スパークリングワインの外観や泡立ちを評価する要素。"}, {"no": 419, "f": "スパークリングワイン", "h": "gyropalette", "i": "/ˌdʒaɪroʊpaˈlɛt/", "p": "名詞", "g": "ジャイロパレット（自動動瓶機）", "s": 0, "r": "riddling（動瓶）／pupitre（ピュピトル、手動の対概念）", "n": "多数の瓶を一括して回転・傾斜させ、澱を瓶口に集める自動動瓶機。通常、数日で動瓶を完了する。"}, {"no": 420, "f": "スパークリングワイン", "h": "injection method", "i": "/ɪnˈdʒekʃən ˌmeθəd/", "p": "名詞句", "g": "注入方式（カーボネーション）", "s": 0, "r": "carbonation（カーボネーション）", "n": "完成したワインにCO2を注入して発泡させる手法。カーボネーションと同義。"}, {"no": 421, "f": "スパークリングワイン", "h": "late release", "i": "/leɪt rɪˈliːs/", "p": "名詞句", "g": "レイト・リリース（長期澱熟成後の出荷）", "s": 0, "r": "lees ageing（澱熟成）／recently disgorged（最近デゴルジュマンした）", "n": "長期間澱と熟成させ、デゴルジュマン直後に市場へ出荷するスタイル。"}, {"no": 422, "f": "スパークリングワイン", "h": "lees ageing", "i": "/ˈliːz ˌeɪdʒɪŋ/", "p": "名詞句", "g": "澱熟成（澱と共に瓶熟）", "s": 0, "r": "autolysis（自己分解）／sur lie（シュール・リー）", "n": "ワインを澱と共に熟成させる工程。スパークリングでは酵母の自己分解により、複雑さやクリーミーな風味が生まれる。"}, {"no": 423, "f": "スパークリングワイン", "h": "liqueur d'expédition", "i": "/liˌkɜːr dɛkspediˈsjɒ̃/", "p": "名詞句", "g": "門出のリキュール（澱抜き後の補填液）", "s": 0, "r": "dosage（ドサージュ）／liqueur de tirage（ティラージュ液、対概念）", "n": "澱抜き後に補填する、ワインと糖またはRCGMの混合液。糖またはRCGMがdosageを構成し、最終ワインの甘辛度を決める。"}, {"no": 424, "f": "スパークリングワイン", "h": "liqueur de tirage", "i": "/liˌkɜːr də tiˈrɑːʒ/", "p": "名詞句", "g": "ティラージュ液（二次発酵用の添加液）", "s": 0, "r": "tirage（ティラージュ）／liqueur d'expédition（門出のリキュール、対概念）", "n": "二次発酵前に加える、糖・酵母・酵母栄養剤・清澄剤などの混合液。瓶内二次発酵を起こし、CO₂を生じさせる。"}, {"no": 425, "f": "スパークリングワイン", "h": "mousseux", "i": "/muˈsø/", "p": "名詞・形容詞", "g": "ムスー（発泡性の）", "s": 0, "r": "spumante（スプマンテ、伊語）／Sekt（ゼクト、独語）", "n": "「泡立つ」を意味するフランス語。発泡性ワインを指し、ヴーヴレやソミュールなどのラベルに用いられる。"}, {"no": 426, "f": "スパークリングワイン", "h": "muselet", "i": "/ˌmuːzəˈleɪ/", "p": "名詞", "g": "ミュズレ（コルク固定用の針金製留め具）", "s": 0, "r": "crown cap（王冠）", "n": "コルクを瓶口に固定する針金製の留め具。瓶内圧によるコルクの飛び出しを防ぐ。"}, {"no": 427, "f": "スパークリングワイン", "h": "NM (négociant manipulant)", "i": "/neɡɔsjɑ̃ manipyˈlɑ̃/", "p": "名詞", "g": "ネゴシアン・マニピュラン（ブドウを買い付けて醸造するシャンパーニュ生産者）", "s": 0, "r": "RM (récoltant-manipulant)（レコルタン・マニピュラン）／CM (coopérative de manipulation)（CM）／négociant（ネゴシアン）", "n": "栽培農家からブドウを購入し、自社で醸造・瓶詰めする生産者。大手メゾンの多くが該当し、ラベルにNMと表示される。"}, {"no": 428, "f": "スパークリングワイン", "h": "non-vintage", "i": "/ˌnɒn ˈvɪntɪdʒ/", "p": "名詞・形容詞", "g": "ノンヴィンテージ（複数年ブレンド、NV）", "s": 0, "r": "vintage（ヴィンテージ、対概念）／reserve wine（リザーヴワイン）", "n": "複数年の原酒をブレンドしたスタイル。略称NV。安定したスタイルを保つため、リザーヴワインを活用する。"}, {"no": 429, "f": "スパークリングワイン", "h": "pressurised tank", "i": "/ˈprɛʃəraɪzd ˌtæŋk/", "p": "名詞句", "g": "加圧タンク（耐圧タンク）", "s": 0, "r": "tank method（タンク方式）", "n": "CO₂を保持できる耐圧タンク。タンク方式で二次発酵に用いられる。"}, {"no": 430, "f": "スパークリングワイン", "h": "prestige cuvée", "i": "/prɛˌstiːʒ kuˈveɪ/", "p": "名詞句", "g": "プレステージ・キュヴェ（最上級キュヴェ）", "s": 0, "r": "cuvée（キュヴェ）", "n": "生産者を代表する最上級のキュヴェ。高品質な原料と醸造・熟成により、最高品質を追求したワイン。"}, {"no": 431, "f": "スパークリングワイン", "h": "prise de mousse", "i": "/ˌpriːz də ˈmuːs/", "p": "名詞句", "g": "プリーズ・ド・ムース（①泡の生成・二次発酵 ②培養酵母）", "s": 0, "r": "second fermentation（二次発酵）／tirage（ティラージュ）", "n": "「泡を生じさせる」の意で、二次発酵を指すほか、瓶内二次発酵用の培養酵母（EC1118）の名称にも用いられる。"}, {"no": 432, "f": "スパークリングワイン", "h": "prosecco", "i": "/prəˈsekoʊ/", "p": "名詞", "g": "プロセッコ（グレーラ主体のイタリア産発泡ワイン）", "s": 0, "r": "Charmat method（シャルマ方式）／cava（カバ）", "n": "グレーラを主体にタンク方式で造るイタリアの発泡ワイン。スプマンテとフリッザンテのスタイルがある。"}, {"no": 433, "f": "スパークリングワイン", "h": "pupitre", "i": "/pʊˈpiːtr/", "p": "名詞", "g": "ピュピトル（手動動瓶用のV字型台）", "s": 0, "r": "gyropalette（ジャイロパレット、自動の対概念）／riddling（動瓶）", "n": "瓶を差し込み、角度を変えながら澱を瓶口へ集める手動動瓶用のV字型台。"}, {"no": 434, "f": "スパークリングワイン", "h": "pét-nat", "i": "/ˈpet ˌnæt/", "p": "名詞", "g": "ペットナット（pétillant naturelの略）", "s": 0, "r": "ancestral method（アンセストラル方式）", "n": "pétillant naturelの略称。発酵途中で瓶詰めし、瓶内で発酵を完了させるアンセストラル方式のスパークリングワイン。"}, {"no": 435, "f": "スパークリングワイン", "h": "reserve wine", "i": "/rɪˈzɜːv waɪn/", "p": "名詞句", "g": "リザーヴワイン（取り置きの貯蔵原酒）", "s": 0, "r": "base wine（ベースワイン）／non-vintage（ノンヴィンテージ）", "n": "過去の収穫年から取り置いて熟成・保管したワイン。NVの品質とスタイルの一貫性を保つため、ブレンドに用いられる。"}, {"no": 436, "f": "スパークリングワイン", "h": "riddling", "i": "/ˈrɪdlɪŋ/", "p": "名詞", "g": "動瓶（澱を瓶口へ集める作業）", "s": 0, "r": "remuage（仏名）", "n": "瓶を回転・傾斜させ、澱を瓶口に集める作業。伝統的方式でデゴルジュマン前に行う。"}, {"no": 437, "f": "スパークリングワイン", "h": "RM (récoltant-manipulant)", "i": "/ʁekɔltɑ̃ manipyˈlɑ̃/", "p": "名詞", "g": "自家栽培・自家醸造のシャンパーニュ生産者", "s": 0, "r": "NM (négociant manipulant)（ネゴシアン・マニピュラン）／CM (coopérative de manipulation)（コーペラティヴ・ド・マニピュラシオン）／négociant（ネゴシアン）", "n": "自ら栽培したブドウを用いて、自社で醸造・瓶詰めする生産者。RM（Récoltant-Manipulant）と表示される。"}, {"no": 438, "f": "スパークリングワイン", "h": "second fermentation", "i": "/ˈsɛkənd ˌfɜːmenˈteɪʃən/", "p": "名詞句", "g": "二次発酵（泡を生む発酵）", "s": 0, "r": "bottle fermentation（瓶内発酵）／prise de mousse（プリーズ・ド・ムース）", "n": "ベースワインに糖と酵母を加えるなどして行う二次発酵。CO₂が発生して泡と圧力を生み、瓶内またはタンク内で行われる。"}, {"no": 439, "f": "スパークリングワイン", "h": "Sekt", "i": "/zɛkt/", "p": "名詞", "g": "ゼクト（ドイツ・オーストリアのスパークリング）", "s": 0, "r": "Crémant（クレマン）／cava（カバ）", "n": "ドイツやオーストリアで用いられるスパークリングワインの呼称。品質や製法は幅広く、リースリングなどの高酸品種が原料として用いられる。"}, {"no": 440, "f": "スパークリングワイン", "h": "semi-sparkling", "i": "/ˌsɛmi ˈspɑːklɪŋ/", "p": "形容詞", "g": "弱発泡（半発泡）", "s": 0, "r": "spumante（完全発泡、対概念）／perlwein（ペールヴァイン、独語）", "n": "完全発泡（sparkling）よりもガス圧が低い弱発泡ワイン。フランスのpétillant、イタリアのfrizzante、ドイツのPerlweinなどが該当する。"}, {"no": 441, "f": "スパークリングワイン", "h": "spumante", "i": "/spuˈmante/", "p": "名詞・形容詞", "g": "スプマンテ（スパークリングワイン）", "s": 0, "r": "semi-sparkling（弱発泡、対概念）／frizzante（フリッツァンテ、弱発泡）／mousseux（ムスー、仏語）", "n": "イタリア語でスパークリングワイン。一般にfrizzanteよりガス圧が高く、3バール以上のものを指す。"}, {"no": 442, "f": "スパークリングワイン", "h": "taille", "i": "/tɑːj/", "p": "名詞", "g": "タイユ（後期の果汁画分）", "s": 0, "r": "cuvée（キュヴェ、初期画分の対概念）／press fraction（果汁画分）", "n": "シャンパーニュでcuvéeの後に得られる果汁画分。cuvéeよりフェノールが多い。"}, {"no": 443, "f": "スパークリングワイン", "h": "tank method", "i": "/ˈtæŋk ˌmɛθəd/", "p": "名詞句", "g": "タンク方式（加圧タンク内で二次発酵）", "s": 0, "r": "Charmat method（シャルマ方式、別称）／bottle fermentation（瓶内発酵、対概念）", "n": "加圧タンク内で二次発酵を行う方式。果実味を生かし、プロセッコなどに用いられる。"}, {"no": 444, "f": "スパークリングワイン", "h": "tirage", "i": "/tiˈrɑːʒ/", "p": "名詞", "g": "ティラージュ（二次発酵用液の添加・瓶詰め工程）", "s": 0, "r": "liqueur de tirage（ティラージュ液）／second fermentation（二次発酵）", "n": "二次発酵用の液を加えて瓶詰めする工程。糖と酵母を加え、瓶内で二次発酵を開始させる。"}, {"no": 445, "f": "スパークリングワイン", "h": "Traditional method", "i": "/trəˈdɪʃənəl ˈmeθəd/", "p": "名詞句", "g": "伝統方式（瓶内二次発酵）", "s": 0, "r": "tank method（タンク方式）／transfer method（トランスファー方式）／ancestral method（アンセストラル方式）", "n": "瓶内で二次発酵を行い、澱とともに熟成させる製法。シャンパーニュなどで用いられる。"}, {"no": 446, "f": "スパークリングワイン", "h": "transfer method", "i": "/ˈtrænsfɜː ˌmɛθəd/", "p": "名詞句", "g": "移瓶方式（トランスファー方式）", "s": 0, "r": "bottle fermentation（瓶内発酵）／tank method（タンク方式）", "n": "瓶内二次発酵後、加圧タンクに移して調整し、再び瓶詰めする方式。動瓶の工程を省略できる。"}, {"no": 447, "f": "スパークリングワイン", "h": "brut nature", "i": "/bʁyt naˈtyʁ/", "p": "名詞句", "g": "ブリュット・ナチュール（残糖0〜3g/L・最辛口）", "s": 0, "r": "Bruto Natural（西・葡語）／Naturherb（独語）／zéro dosage（ゼロ・ドサージュ）", "n": "ドサージュを行わず、残糖3g/L以下に仕上げた最辛口のスパークリングワイン。"}, {"no": 448, "f": "スパークリングワイン", "h": "extra brut", "i": "/ˌɛkstrə ˈbruːt/", "p": "名詞句", "g": "エクストラ・ブリュット（残糖0〜6g/L）", "s": 0, "r": "Extra Bruto（西・葡語）／Extra Herb（独語）／brut nature（ブリュット・ナチュール）", "n": "残糖6g/L以下の辛口区分。brut natureよりわずかに甘い。"}, {"no": 449, "f": "スパークリングワイン", "h": "brut", "i": "/ˈbruːt/", "p": "名詞・形容詞", "g": "ブリュット（残糖0〜12g/L・辛口）", "s": 0, "r": "Bruto（ブルート、西・葡語）／Herb（ヘルプ、独語）／extra brut（エクストラ・ブリュット）", "n": "残糖12g/L以下の辛口区分。"}, {"no": 450, "f": "スパークリングワイン", "h": "extra-sec", "i": "/ˌɛkstʁa ˈsɛk/", "p": "名詞句", "g": "エクストラ・セック（残糖12〜17g/L）", "s": 0, "r": "Extra-Dry（エクストラ・ドライ、英語）／Extra Trocken（独語）", "n": "残糖12〜17g/Lの中辛口区分。brutより甘い。"}, {"no": 451, "f": "スパークリングワイン", "h": "sec", "i": "/sɛk/", "p": "形容詞", "g": "セック（残糖17〜32g/L）", "s": 0, "r": "Secco（セッコ、伊語）／Seco（セコ、西・葡語）／Dry（英語）／Trocken（トロッケン、独語）", "n": "残糖17〜32g/Lの区分。extra-secより甘い。"}, {"no": 452, "f": "スパークリングワイン", "h": "demi-sec", "i": "/dəmi ˈsɛk/", "p": "形容詞", "g": "ドミ・セック（残糖32〜50g/L・中甘口）", "s": 0, "r": "Semi-Seco（西語）／Medium-Dry（英語）／Abboccato（アボッカート、伊語）／Halbtrocken（ハルプトロッケン、独語）", "n": "残糖32〜50g/Lの中甘口区分。secより甘い。"}, {"no": 453, "f": "スパークリングワイン", "h": "doux", "i": "/du/", "p": "名詞・形容詞", "g": "ドゥー（残糖50g/L超・甘口）", "s": 0, "r": "Dulce（ドゥルセ、西語）／Sweet（英語）／Mild（独語）／dolce（ドルチェ、伊語）", "n": "残糖50g/L超の甘口区分。"}, {"no": 454, "f": "酒精強化ワイン", "h": "fortified wine", "i": "/ˈfɔːrtɪfaɪd waɪn/", "p": "名詞句", "g": "酒精強化ワイン", "s": 0, "r": "fortification（酒精強化）／Port（ポート）／Madeira（マデイラ）", "n": "発酵中または発酵後にブドウ由来のスピリッツを加え、アルコール度を高めたワインの総称。"}, {"no": 455, "f": "酒精強化ワイン", "h": "fortifying spirit", "i": "/ˈfɔːtɪfaɪɪŋ ˌspɪrɪt/", "p": "名詞句", "g": "酒精強化用スピリッツ（強化アルコール）", "s": 0, "r": "grape spirit（グレープスピリット）／fortification（酒精強化）", "n": "発酵の途中または後に加えてアルコール度数を高める蒸留酒。原料や度数は強化酒によって異なる。"}, {"no": 456, "f": "酒精強化ワイン", "h": "grape spirit", "i": "/ˈɡreɪp ˌspɪrɪt/", "p": "名詞句", "g": "グレープスピリット（酒精強化用のブドウ蒸留酒）", "s": 0, "r": "aguardente（アグアルデンテ）／fortifying spirit（酒精強化用スピリッツ）", "n": "酒精強化ワインに用いられるブドウ由来の蒸留酒。強化酒の種類により度数や個性が異なる。"}, {"no": 457, "f": "酒精強化ワイン", "h": "indication of age", "i": "/ˌɪndɪˈkeɪʃən əv ˈeɪdʒ/", "p": "名詞句", "g": "熟成年数表示", "s": 0, "r": "Tawny（トウニー）／solera system（ソレラ・システム）", "n": "ワインの熟成年数や熟成カテゴリーを示す表示。"}, {"no": 458, "f": "酒精強化ワイン", "h": "oxidative ageing", "i": "/ˈɒksɪdeɪtɪv ˈeɪdʒɪŋ/", "p": "名詞句", "g": "酸化熟成", "s": 0, "r": "biological ageing（生物学的熟成、対概念）／Madeira（マデイラ）", "n": "酸素に触れさせて熟成する方法。ナッツやドライフルーツなどの香味が生じ、色は褐色へ変化する。オロロソが代表例。"}, {"no": 459, "f": "酒精強化ワイン", "h": "Rutherglen Muscat", "i": "/ˈrʌðəɡlɛn ˈmʌskət/", "p": "名詞句", "g": "ラザグレン・マスカット（豪州の甘口酒精強化ワイン）", "s": 0, "r": "Classic Rutherglen Muscat（クラシック・ラザグレン・マスカット）／Grand Rutherglen Muscat（グラン・ラザグレン・マスカット）／Rare Rutherglen Muscat（レア・ラザグレン・マスカット）", "n": "豪ヴィクトリア州ラザグレンで造る甘口酒精強化ワイン。ブラウン・マスカットを使い、酸化熟成による濃厚な風味とマスカット香を持つ。"}, {"no": 460, "f": "酒精強化ワイン", "h": "sweetening component", "i": "/ˈswiːtnɪŋ kəmˈpəʊnənt/", "p": "名詞句", "g": "甘味添加成分（PXやRCGM等）", "s": 0, "r": "Rectified Concentrated Grape Must (RCGM)（濃縮還元ブドウ果汁）／residual sugar（残糖）", "n": "甘味を加えるために添加する成分。PXワインやRCGMなどがあり、最終的な甘味に影響する。"}, {"no": 461, "f": "酒精強化ワイン", "h": "vin doux naturel", "i": "/vɛ̃ du natyˈʁɛl/", "p": "名詞句", "g": "ヴァン・ドゥー・ナチュレル（天然甘口ワイン）", "s": 0, "r": "fortified wine（酒精強化ワイン）／fortification（酒精強化）", "n": "発酵途中に酒精強化して発酵を止め、甘味を残すフランスの酒精強化ワイン。ミュスカやグルナッシュを用いるものが有名。"}, {"no": 462, "f": "酒精強化ワイン", "h": "Amontillado", "i": "/aˌmontiˈʝaðo/", "p": "名詞", "g": "アモンティリャード", "s": 0, "r": "Fino（フィノ）／Oloroso（オロロソ）／Palo Cortado（パロコルタド）", "n": "フィノまたはマンザニージャとして生物学的熟成後、再強化してフロールを失わせ、酸化熟成。ナッツやドライフルーツなど、両熟成由来の香りを持つ辛口。"}, {"no": 463, "f": "酒精強化ワイン", "h": "biological ageing", "i": "/ˌbaɪəˈlɒdʒɪkəl ˈeɪdʒɪŋ/", "p": "名詞句", "g": "生物学的熟成（フロール下での熟成）", "s": 0, "r": "flor（フロール）／oxidative ageing（酸化熟成、対概念）", "n": "フロールの下で酸化を抑えながら熟成させる方法。フィノやマンサニージャに用いられ、酵母由来の香味を生む。"}, {"no": 464, "f": "酒精強化ワイン", "h": "Cream", "i": "/kriːm/", "p": "名詞", "g": "クリーム（濃厚甘口シェリー）", "s": 0, "r": "Pale Cream（ペール・クリーム）／Medium（ミディアム）／Pedro Ximénez（ペドロ・ヒメネス）", "n": "辛口シェリーに甘味を加えた濃厚甘口。オロロソをベースにPXなどをブレンドすることが多く、濃厚な甘味とナッツの風味を持つ。"}, {"no": 465, "f": "酒精強化ワイン", "h": "criadera", "i": "/kɾjaˈðeɾa/", "p": "名詞", "g": "クリアデラ（ソレラ・システムの各熟成段）", "s": 0, "r": "solera（ソレラ）", "n": "ソレラ・システムで、同程度の熟成段階のワインを収める樽の段。最古の段がsoleraで、1st、2nd…と若くなる。"}, {"no": 466, "f": "酒精強化ワイン", "h": "Fino", "i": "/ˈfino/", "p": "名詞", "g": "フィノ（フロール下で生物学的熟成する辛口シェリー）", "s": 0, "r": "Manzanilla（マンサニーリャ）／Oloroso（オロロソ）／flor（フロール）", "n": "フロール下で生物学的熟成させる辛口シェリー。淡い色調で、アーモンドやパン生地などの香りを持ち、通常15〜15.5%程度。"}, {"no": 467, "f": "酒精強化ワイン", "h": "flor", "i": "/flɔːr/", "p": "名詞", "g": "フロール（ワイン表面を覆う産膜酵母）", "s": 0, "r": "biological ageing（生物学的熟成）", "n": "ワイン表面に膜を形成する産膜酵母。シェリーなどでフロール下の熟成に用いられ、酸化を抑えナッツ香を与える。"}, {"no": 468, "f": "酒精強化ワイン", "h": "Manzanilla", "i": "/ˌmanθaˈniʎa/", "p": "名詞", "g": "マンサニーリャ（サンルーカル産の生物学的熟成辛口シェリー）", "s": 0, "r": "Fino（フィノ）／biological ageing（生物学的熟成）", "n": "サンルーカル・デ・バラメダで熟成する辛口シェリー。海洋性気候の影響で厚く活発なフロールが形成され、軽快で塩味を感じる風味を持つ。"}, {"no": 469, "f": "酒精強化ワイン", "h": "Medium", "i": "/ˈmiːdiəm/", "p": "名詞", "g": "ミディアム（中甘口シェリー）", "s": 0, "r": "Cream（クリーム）／Pale Cream（ペール・クリーム）", "n": "辛口シェリーに甘味を加えた中甘口のシェリー。残糖量は5〜115g/Lで、PXなどを用いて甘味を調整する。"}, {"no": 470, "f": "酒精強化ワイン", "h": "Oloroso", "i": "/oloˈɾoso/", "p": "名詞", "g": "オロロソ（酸化熟成の辛口シェリー）", "s": 0, "r": "Fino（フィノ）／Amontillado（アモンティリャード）／oxidative ageing（酸化熟成）", "n": "発酵後に酒精強化してフロールの形成を防ぎ、酸化熟成させる辛口シェリー。濃い色調で、クルミやドライフルーツなどの香りを持ち、アルコール度数は18〜22%程度。"}, {"no": 471, "f": "酒精強化ワイン", "h": "Pale Cream", "i": "/ˌpeɪl ˈkriːm/", "p": "名詞句", "g": "ペール・クリーム（生物学的熟成を経た甘口シェリー）", "s": 0, "r": "Cream（クリーム）／Fino（フィノ）／Medium（ミディアム）", "n": "Finoなどの生物学的熟成を経たシェリーに精留濃縮果汁で甘味を加えた甘口。色や風味を大きく変えず、フロール由来の香りを残す。残糖45〜115g/L。"}, {"no": 472, "f": "酒精強化ワイン", "h": "Palo Cortado", "i": "/ˈpalo koɾˈtaðo/", "p": "名詞句", "g": "パロコルタド（アモンティリャード様の香りとオロロソ様の味を持つシェリー）", "s": 0, "r": "Amontillado（アモンティリャード）／Oloroso（オロロソ）／Fino（フィノ）", "n": "生物学的熟成の原酒を酸化熟成に移行させて造る辛口シェリー。アモンティリャードのような香りとオロロソのような豊かな味わいを併せ持つ。"}, {"no": 473, "f": "酒精強化ワイン", "h": "Pedro Ximénez", "i": "/ˌpeðɾo xiˈmeneθ/", "p": "名詞句", "g": "ペドロ・ヒメネス（PX：ブドウ品種／極甘口シェリー）", "s": 0, "r": "Cream（クリーム）／sun-drying（天日干し）／sweetening component（甘味資材）", "n": "天日乾燥したブドウから極甘口シェリーを造るほか、他のシェリーの甘味付けにも用いられる。残糖は450〜500g/Lに達することがある。"}, {"no": 474, "f": "酒精強化ワイン", "h": "solera", "i": "/soˈleɾa/", "p": "名詞", "g": "ソレラ（最古の酒を含む樽段／ソレラ・システム）", "s": 0, "r": "criadera（クリアデラ）", "n": "分別ブレンドによって品質を安定させる熟成方式。最も古いワインを含む樽段をsoleraと呼ぶ。"}, {"no": 475, "f": "酒精強化ワイン", "h": "solera system", "i": "/səˈlerə ˌsɪstəm/", "p": "名詞句", "g": "ソレラ・システム", "s": 0, "r": "solera（ソレラ）／criadera（クリアデラ）／fractional blending（分割ブレンド）", "n": "異なる熟成年のワインを段階的に移し替え、一部を取り出して補充しながら平均的な熟成を続ける仕組み。"}, {"no": 476, "f": "酒精強化ワイン", "h": "aguardente", "i": "/ˌaɡwaɾˈðẽtɨ/", "p": "名詞", "g": "アグアルデンテ（ポート強化用の77%ブドウ蒸留酒）", "s": 0, "r": "grape spirit（グレープスピリット）／Port（ポート）", "n": "ポートの強化に使われる77%のブドウ蒸留酒。95〜96%の中性スピリッツより個性があり、ポートにスピリッツ香を与える。"}, {"no": 477, "f": "酒精強化ワイン", "h": "lagar", "i": "/ləˈɡɑː/", "p": "名詞", "g": "ラガール（足踏み圧搾用の浅い槽）", "s": 0, "r": "Port（ポート）／maceration（マセラシオン）", "n": "果皮から色やタンニンを短期間で抽出するための浅い槽。伝統的には足踏みでブドウを破砕する。"}, {"no": 478, "f": "酒精強化ワイン", "h": "Late Bottled Vintage", "i": "/ˌleɪt ˌbɒtl̩d ˈvɪntɪdʒ/", "p": "名詞句", "g": "レイト・ボトルド・ヴィンテージ（LBV）", "s": 0, "r": "Vintage Port（ヴィンテージ・ポート）／Ruby（ルビー）", "n": "単一収穫年のポートを収穫後4〜6年ほど樽熟成して瓶詰めしたもの。多くは濾過され、澱引き不要で、瓶詰め後すぐに楽しめる。"}, {"no": 479, "f": "酒精強化ワイン", "h": "lodge", "i": "/lɒdʒ/", "p": "名詞", "g": "ロッジ（ガイアにあるポート貯蔵・熟成庫）", "s": 0, "r": "Port（ポート）", "n": "ヴィラ・ノヴァ・デ・ガイアにあるポートの貯蔵・熟成庫。涼しく安定した環境で熟成させる。"}, {"no": 480, "f": "酒精強化ワイン", "h": "pipe", "i": "/paɪp/", "p": "名詞", "g": "パイプ（ポートの細長い熟成樽）", "s": 0, "r": "Port（ポート）／lodge（ロッジ）", "n": "ポートの熟成に使う約550〜600Lの細長い樽。トウニーの酸化熟成に欠かせない容器。"}, {"no": 481, "f": "酒精強化ワイン", "h": "Port", "i": "/pɔːt/", "p": "名詞", "g": "ポート（ドウロ産の甘口酒精強化ワイン）", "s": 0, "r": "Madeira（マデイラ）／aguardente（アグアルデンテ）", "n": "ドウロ産の甘口酒精強化ワイン。77%のアグアルデンテで発酵を止め、ルビーやトウニーなど多彩なスタイルに造り分ける。"}, {"no": 482, "f": "酒精強化ワイン", "h": "Ruby", "i": "/ˈruːbi/", "p": "名詞", "g": "ルビー（若く果実味豊かな赤ポート）", "s": 0, "r": "Tawny（トウニー）／Vintage Port（ヴィンテージ・ポート）／Late Bottled Vintage（レイト・ボトルド・ヴィンテージ）", "n": "酸化を抑えて熟成し、果実味を保った若い赤ポート。深いルビー色で、赤・黒系果実の風味を持つ、基本的なスタイル。"}, {"no": 483, "f": "酒精強化ワイン", "h": "Tawny", "i": "/ˈtɔːni/", "p": "名詞・形容詞", "g": "トウニー（酸化熟成した琥珀色の赤ポート）", "s": 0, "r": "Ruby（ルビー）／oxidative ageing（酸化熟成）／indication of age（熟成年数表示）", "n": "樽で酸化熟成させ、色が淡く琥珀色になった赤ポート。クルミやカラメルなどの熟成香を持つ。"}, {"no": 484, "f": "酒精強化ワイン", "h": "Vintage Port", "i": "/ˌvɪntɪdʒ ˈpɔːt/", "p": "名詞句", "g": "ヴィンテージ・ポート（宣言年の単一収穫最高級品）", "s": 0, "r": "Late Bottled Vintage（レイト・ボトルド・ヴィンテージ）／single quinta（単一キンタ）／Ruby（ルビー）", "n": "宣言年の単一収穫のポート。通常2〜3年樽熟成後に無濾過で瓶詰めし、瓶内で長期熟成させる最高級スタイル。"}, {"no": 485, "f": "酒精強化ワイン", "h": "White Port", "i": "/ˌwaɪt ˈpɔːt/", "p": "名詞句", "g": "ホワイト・ポート（白ブドウで造るポート）", "s": 0, "r": "Ruby（ルビー）／Tawny（トウニー）／Port（ポート）", "n": "白ブドウで造るポート。フルーティな辛口から、樽熟成による酸化的な甘口までスタイルが幅広い。"}, {"no": 486, "f": "酒精強化ワイン", "h": "canteiro", "i": "/kænˈteɪrəʊ/", "p": "名詞", "g": "カンテイロ（自然な加熱熟成法）", "s": 0, "r": "estufagem（エストゥファジェン、対概念）／Madeira（マデイラ）", "n": "かい場所に樽を置き、自然な熱で長期間熟成させる方法。estufagemより緩やかで、高品質マデイラに用いられる。"}, {"no": 487, "f": "酒精強化ワイン", "h": "estufa", "i": "/ɛsˈtuːfə/", "p": "名詞", "g": "エストゥファ（加熱用のステンレス槽）", "s": 0, "r": "estufagem（エストゥファジェン）／canteiro（カンテイロ、対概念）", "n": "マデイラのestufagemで使われる、ワインを加熱するためのステンレス槽。"}, {"no": 488, "f": "酒精強化ワイン", "h": "estufagem", "i": "/ˌɛstuˈfaʒɐ̃/", "p": "名詞", "g": "エストゥファジェン（加熱熟成法）", "s": 0, "r": "canteiro（カンテイロ、対概念）／estufa（エストゥファ）", "n": "温度管理されたestufaでワインを加熱し、最低3か月熟成させる方法。主にプレミアム度の低いワインに用いられる。"}, {"no": 489, "f": "酒精強化ワイン", "h": "Madeira", "i": "/məˈdɪərə/", "p": "名詞", "g": "マデイラ（酒精強化ワイン）", "s": 0, "r": "Port（ポート）／estufagem（エストゥファジェン）", "n": "大西洋の同名島産の酒精強化ワイン。加熱酸化熟成で、カラメルやドライフルーツの風味を生む。辛口から甘口まで幅広い。"}, {"no": 490, "f": "テイスティング", "h": "aeration", "i": "/ɛəˈreɪʃən/", "p": "名詞", "g": "空気接触（エアレーション）", "s": 0, "r": "breathing（開かせること）／decanting（デカンタージュ）／oxidation（酸化）", "n": "ワインを意図的に空気に触れさせること。香りを開かせたり、還元臭を和らげたりする目的で、デカンタージュやスワリングなどによって行う。"}, {"no": 491, "f": "テイスティング", "h": "breathing", "i": "/ˈbriːðɪŋ/", "p": "名詞", "g": "（ワインを）開かせること", "s": 0, "r": "aeration（空気接触）／decanter（デカンタ）", "n": "抜栓後やデカンタージュ後にワインを空気に触れさせ、香りを開かせること。"}, {"no": 492, "f": "テイスティング", "h": "clean", "i": "/kliːn/", "p": "形容詞", "g": "クリーン（欠陥のない）", "s": 0, "r": "faulty（欠陥のある）／condition（健全性）", "n": "コルク臭や酸化などの明らかな欠陥がなく、健全な状態。"}, {"no": 493, "f": "テイスティング", "h": "condition", "i": "/kənˈdɪʃən/", "p": "名詞", "g": "コンディション（健全性）", "s": 0, "r": "clean（欠陥のない）／faulty（欠陥のある）", "n": "ワインの健全な状態を表す項目。clean（欠陥がない）かfaulty（欠陥がある）で評価する。"}, {"no": 494, "f": "テイスティング", "h": "decanter", "i": "/dɪˈkæntər/", "p": "名詞", "g": "デカンタ", "s": 0, "r": "decanting（デカンタージュ）／aeration（空気接触）", "n": "ワインを移し替えるためのガラス容器。澱の分離や空気接触を目的に用い、若い赤ワインの香りを開かせる際にも使われる。"}, {"no": 495, "f": "テイスティング", "h": "intensity", "i": "/ɪnˈtɛnsəti/", "p": "名詞", "g": "強さ（香り・風味の強さ）", "s": 0, "r": "pronounced（際立った）／aroma intensity（香りの強さ）", "n": "香りや風味がどの程度強く感じられるか、その度合い。淡いものから強いものまで評価する。"}, {"no": 496, "f": "テイスティング", "h": "pronounced", "i": "/prəˈnaʊnst/", "p": "形容詞", "g": "際立った（明確に感じられる）", "s": 0, "r": "intensity（強さ）／aroma intensity（香りの強さ）", "n": "香りや風味が明確で、はっきりと感じられる状態。強さを表す際に用いられ、pronounced aroma は「際立った香り」の意。"}, {"no": 497, "f": "テイスティング", "h": "amber", "i": "/ˈæmbər/", "p": "名詞", "g": "アンバー（琥珀色）", "s": 0, "r": "gold（黄金色）／brown（褐色）", "n": "白ワインや酒精強化ワインなどに見られる琥珀色の色調。酸化熟成や長期熟成などで生じる。"}, {"no": 498, "f": "テイスティング", "h": "appearance", "i": "/əˈpɪərəns/", "p": "名詞", "g": "外観", "s": 0, "r": "clarity（清澄度）／colour intensity（色の濃さ）／rim（リム）", "n": "ワインの見た目や状態。清澄度・色の濃さ・色調などを観察する。"}, {"no": 499, "f": "テイスティング", "h": "brown", "i": "/braʊn/", "p": "名詞", "g": "褐色、茶色", "s": 0, "r": "amber（琥珀色）／garnet（ガーネット）", "n": "ワインに見られる褐色の色調。熟成や酸化により現れることが多い。"}, {"no": 500, "f": "テイスティング", "h": "clarity", "i": "/ˈklærəti/", "p": "名詞", "g": "清澄度（澄み具合）", "s": 0, "r": "hazy（濁った）／appearance（外観）", "n": "ワインの外観の澄み具合。clear（澄んだ）やhazy（濁った）などで表す。"}, {"no": 501, "f": "テイスティング", "h": "colour intensity", "i": "/ˈkʌlər ɪnˈtɛnsəti/", "p": "名詞", "g": "色の濃さ（外観）", "s": 0, "r": "pale（淡い）／deep（濃い）", "n": "ワインの外観における色の濃さ。pale（淡い）やdeep（濃い）などで表す。"}, {"no": 502, "f": "テイスティング", "h": "core", "i": "/kɔːr/", "p": "名詞", "g": "コア（グラス中央の濃い部分）", "s": 0, "r": "rim（リム）／colour intensity（色の濃さ）", "n": "グラスを傾けた際に見える、ワインの中央部の濃い色の部分。rimとの対比で色の濃さを判断する。"}, {"no": 503, "f": "テイスティング", "h": "deep", "i": "/diːp/", "p": "形容詞", "g": "濃い（色が）", "s": 0, "r": "pale（淡い）／colour intensity（色の濃さ）", "n": "ワインの色が濃く、中心部から縁まで深い色調を示す状態。"}, {"no": 504, "f": "テイスティング", "h": "deposit", "i": "/dɪˈpɒzɪt/", "p": "名詞", "g": "澱・沈殿物", "s": 0, "r": "lees（澱）／hazy（濁った）", "n": "ボトルやグラス内に沈む固形物。酒石、色素、タンニンなどの沈殿物を含む。"}, {"no": 505, "f": "テイスティング", "h": "garnet", "i": "/ˈɡɑːrnɪt/", "p": "名詞", "g": "ガーネット（赤褐色）", "s": 0, "r": "purple（紫）／ruby（ルビー）／brown（褐色）", "n": "赤に褐色や橙色が混じった色調。熟成した赤ワインに典型的に見られる。"}, {"no": 506, "f": "テイスティング", "h": "gold", "i": "/ɡoʊld/", "p": "名詞", "g": "ゴールド（黄金色）", "s": 0, "r": "lemon-green（レモングリーン）／amber（琥珀色）", "n": "黄色に橙や金色のニュアンスを帯びた色調。熟成や樽熟成、温暖な産地、甘口ワインなどに見られる。"}, {"no": 507, "f": "テイスティング", "h": "hazy", "i": "/ˈheɪzi/", "p": "形容詞", "g": "濁った", "s": 0, "r": "clarity（清澄度）／deposit（澱・沈殿物）", "n": "浮遊物などにより澄んでいない状態。無清澄・無ろ過のワインや、未澱抜きのペットナットなどに見られる。"}, {"no": 508, "f": "テイスティング", "h": "legs", "i": "/lɛɡz/", "p": "名詞", "g": "筋（レッグス／ティアーズ）", "s": 0, "r": "tears（涙）", "n": "スワリング後にグラス内壁を流れ落ちる筋。tearsともいう。アルコールや糖分などの影響で形成される。"}, {"no": 509, "f": "テイスティング", "h": "lemon-green", "i": "/ˌlɛmən ˈɡriːn/", "p": "名詞", "g": "レモングリーン（緑がかった淡黄色）", "s": 0, "r": "gold（黄金色）／amber（琥珀色）", "n": "緑がかった淡い黄色の白ワインの色調。若い白ワインや酸の高いワインに多く見られる。"}, {"no": 510, "f": "テイスティング", "h": "pale", "i": "/peɪl/", "p": "形容詞", "g": "淡い（色が）", "s": 0, "r": "deep（濃い）／colour intensity（色の濃さ）", "n": "ワインの色の濃さが弱いこと。白・ロゼ・赤のいずれにも使い、pale lemon、pale ruby のように色調と組み合わせて表現する。"}, {"no": 511, "f": "テイスティング", "h": "pink-orange", "i": "/ˌpɪŋk ˈɒrɪndʒ/", "p": "名詞", "g": "ピンクオレンジ", "s": 0, "r": "pink（ピンク）／orange（橙色）／salmon（サーモン色）", "n": "ピンクに橙色が混じった色調。ロゼワインなどの色を表す際に使われる。"}, {"no": 512, "f": "テイスティング", "h": "purple", "i": "/ˈpɜːrpəl/", "p": "名詞", "g": "紫", "s": 0, "r": "garnet（ガーネット）／deep（濃い）／ruby（ルビー色）", "n": "赤ワインに見られる紫色を帯びた色調。若い赤ワインに多く、熟成が進むにつれてruby、garnetなどの色調へ変化する。"}, {"no": 513, "f": "テイスティング", "h": "rim", "i": "/rɪm/", "p": "名詞", "g": "リム（液面の縁）", "s": 0, "r": "core（コア）／appearance（外観）", "n": "グラスを傾けた際にできる、ワインの色が最も薄く見える縁の部分。色調や変化から、色の濃さや熟成度を読み取る。"}, {"no": 514, "f": "テイスティング", "h": "tears", "i": "/tɪərz/", "p": "名詞", "g": "涙（脚と同義）", "s": 0, "r": "legs（脚）", "n": "legsの別称。グラスの内壁を伝って流れる液の筋。アルコールや糖分などの影響を受けるが、品質の指標ではない。"}, {"no": 515, "f": "テイスティング", "h": "aroma", "i": "/əˈroʊmə/", "p": "名詞", "g": "アロマ、香り", "s": 0, "r": "bouquet（熟成香）／flavour characteristics（風味特性）", "n": "ワインから感じられる香り全般を指す語。果実、花、スパイス、樽など、さまざまな香りを表す。"}, {"no": 516, "f": "テイスティング", "h": "aroma intensity", "i": "/əˈroʊmə ɪnˈtɛnsəti/", "p": "名詞句", "g": "香りの強さ", "s": 0, "r": "flavour intensity（風味の強さ）／pronounced（際立った）", "n": "ワインから感じられる香りの強さ。品種や醸造、熟成などによって異なる。"}, {"no": 517, "f": "テイスティング", "h": "aromatic", "i": "/ˌærəˈmætɪk/", "p": "形容詞", "g": "アロマティックな、香り高い", "s": 0, "r": "perfumed（香水のように芳香豊かな）／aroma intensity（香りの強さ）", "n": "品種特有の香りが明確で、芳香性の高い品種やワインの形容。マスカットやゲヴュルツトラミネールが代表例。"}, {"no": 518, "f": "テイスティング", "h": "autolytic", "i": "/ˌɔːtəˈlɪtɪk/", "p": "形容詞", "g": "自己分解由来の（酵母分解による）", "s": 0, "r": "autolysis（自己分解）／brioche（ブリオッシュ）／lees ageing（澱熟成）", "n": "酵母の自己分解に由来する香味を表す。ブリオッシュやビスケットなどの香りが典型的。"}, {"no": 519, "f": "テイスティング", "h": "barnyard", "i": "/ˈbɑːrnjɑːrd/", "p": "名詞", "g": "家畜小屋様の香り", "s": 0, "r": "brettanomyces（ブレタノマイセス）／volatile phenols（揮発性フェノール）", "n": "農場や家畜小屋を思わせる、土や動物を連想させる香りの表現。ブレタノマイセスに関連することが多い。"}, {"no": 520, "f": "テイスティング", "h": "black fruit", "i": "/ˈblæk fruːt/", "p": "名詞句", "g": "黒系果実", "s": 0, "r": "red fruit（赤系果実）／jammy（ジャムのような）", "n": "ブラックベリーやカシスなど、黒系果実を思わせる香りや風味の表現。カベルネ・ソーヴィニヨンやシラーなどの濃い赤ワインに使われる。"}, {"no": 521, "f": "テイスティング", "h": "bouquet", "i": "/buːˈkeɪ/", "p": "名詞", "g": "ブーケ（香り）", "s": 0, "r": "tertiary aroma（三次アロマ）／aroma（アロマ）", "n": "ワインから感じられる複雑な香り。特に発酵や熟成によって発達した香りを指すことがある。"}, {"no": 522, "f": "テイスティング", "h": "brioche", "i": "/briˈɒʃ/", "p": "名詞", "g": "ブリオッシュ（パン様の香り）", "s": 0, "r": "autolytic（自己分解由来の）／lees ageing（澱熟成）", "n": "澱との接触や自己分解によって生じる代表的な香りの表現。焼きたてのパンやブリオッシュを思わせる香り。"}, {"no": 523, "f": "テイスティング", "h": "buttery", "i": "/ˈbʌtəri/", "p": "形容詞", "g": "バターのような", "s": 0, "r": "diacetyl（ダイアセチル）／malolactic conversion（マロラクティック変換）／creamy（クリーミーな）", "n": "ジアセチルに由来するバター様の香りや風味。マロラクティック発酵を経た白ワインなどに現れる。"}, {"no": 524, "f": "テイスティング", "h": "citrus", "i": "/ˈsɪtrəs/", "p": "名詞", "g": "柑橘系（の香り）", "s": 0, "r": "stone fruit（核果）／tropical fruit（トロピカルフルーツ）", "n": "レモンやライム、グレープフルーツなど柑橘を思わせる香りや風味の分類。白ワインの基本的な香りの表現。"}, {"no": 525, "f": "テイスティング", "h": "cluster", "i": "/ˈklʌstər/", "p": "名詞", "g": "クラスター（香りの分類群）", "s": 0, "r": "aroma（香り）／descriptor（記述語）", "n": "香りや風味をまとめたカテゴリー。「Citrus fruit」「Black fruit」などがあり、その中に個々のdescriptorが含まれる。"}, {"no": 526, "f": "テイスティング", "h": "cooked", "i": "/kʊkt/", "p": "形容詞", "g": "煮たような、加熱されたような風味", "s": 0, "r": "oxidized（酸化した）／maderized（マデイラ化した）", "n": "高温による劣化などで、煮た果実やジャムのような風味を示す表現。"}, {"no": 527, "f": "テイスティング", "h": "corked", "i": "/kɔːrkt/", "p": "形容詞", "g": "ブショネの・コルク臭のある", "s": 0, "r": "cork taint（コルク汚染）／TCA（トリクロロアニソール）／fault（欠陥）", "n": "TCAなどによるコルク汚染で、湿った段ボールやカビのような香りが生じ、果実香が抑えられた状態。"}, {"no": 528, "f": "テイスティング", "h": "dried fruit", "i": "/ˈdraɪd fruːt/", "p": "名詞句", "g": "ドライフルーツ", "s": 0, "r": "red fruit（赤系果実）／raisiny（レーズンのような）", "n": "干しイチジクやレーズンなどを思わせる香りや風味の表現。陰干しブドウや熟成・酒精強化ワインに使われる。"}, {"no": 529, "f": "テイスティング", "h": "earthy", "i": "/ˈɜːrθi/", "p": "形容詞", "g": "土っぽい、土壌を思わせる", "s": 0, "r": "minerality（ミネラリティ）／barnyard（家畜小屋様の香り）", "n": "湿った土や森の下草などを思わせる香りや風味の形容。熟成した赤ワインなどに現れやすい。"}, {"no": 530, "f": "テイスティング", "h": "floral", "i": "/ˈflɔːrəl/", "p": "形容詞", "g": "花のような", "s": 0, "r": "perfumed（芳香豊かな）／terpene（テルペン）", "n": "白い花やバラなどを思わせる香りの形容。アロマティック品種などに特徴的。"}, {"no": 531, "f": "テイスティング", "h": "fruity", "i": "/ˈfruːti/", "p": "形容詞", "g": "果実味豊かな、果実の香りが強い", "s": 0, "r": "fruit-forward（果実味主体の）／jammy（ジャムのような）", "n": "果実を思わせる香りや風味が前面に出ている様子。甘さとは異なる概念である点に注意。"}, {"no": 532, "f": "テイスティング", "h": "grassy", "i": "/ˈɡræsi/", "p": "形容詞", "g": "草のような、青草の香りの", "s": 0, "r": "green（未熟な風味の）／vegetal（植物的な）／methoxypyrazine（メトキシピラジン）", "n": "刈りたての草や青草を思わせる香りの表現。ソーヴィニヨン・ブランなどのワインに特徴的。"}, {"no": 533, "f": "テイスティング", "h": "green", "i": "/ɡriːn/", "p": "形容詞", "g": "青っぽい、未熟な風味の", "s": 0, "r": "grassy（草のような）／vegetal（植物的な）／ripeness（成熟・対概念）", "n": "未熟な果実や青草、青ピーマンなどを思わせる青っぽい風味の表現。冷涼年や早摘みのブドウで現れやすく、否定的に用いられることが多い。"}, {"no": 534, "f": "テイスティング", "h": "herbaceous", "i": "/hɜːrˈbeɪʃəs/", "p": "形容詞", "g": "青草・ハーブ様の", "s": 0, "r": "grassy（草の香りの）／vegetal（植物的な）／methoxypyrazine（メトキシピラジン）", "n": "草やハーブ、青ピーマンなどを思わせる香りの形容。ソーヴィニヨン・ブランや未熟なカベルネなどに現れやすい。"}, {"no": 535, "f": "テイスティング", "h": "honeyed", "i": "/ˈhʌnid/", "p": "形容詞", "g": "蜂蜜のような", "s": 0, "r": "noble rot（貴腐）／botrytis（ボトリティス）／luscious（甘美な）", "n": "蜂蜜を思わせる甘く豊かな香りや風味の形容。貴腐ワインや熟成した白ワインなどに用いられる。"}, {"no": 536, "f": "テイスティング", "h": "jammy", "i": "/ˈdʒæmi/", "p": "形容詞", "g": "ジャムのような（煮詰めた果実香）", "s": 0, "r": "ripeness（熟度）／concentration（凝縮感）", "n": "ジャムや煮詰めた果実を思わせる濃厚な果実香・風味。過熟や高温に由来し、新鮮さを欠く場合は否定的に用いられる。"}, {"no": 537, "f": "テイスティング", "h": "lightstrike", "i": "/ˈlaɪtstraɪk/", "p": "名詞", "g": "光劣化（ライトストライク）", "s": 0, "r": "volatile sulfur compounds（揮発性硫黄化合物）／fault（欠陥）", "n": "光にさらされることで生じるワインの劣化。硫黄化合物による、茹でたキャベツなどを思わせる不快な香りが生じることがある。"}, {"no": 538, "f": "テイスティング", "h": "meaty", "i": "/ˈmiːti/", "p": "形容詞", "g": "肉のような、肉厚な", "s": 0, "r": "savoury（旨味・塩味系の）／umami（うま味）", "n": "調理した肉や血肉を思わせる香りや風味の形容。シラーなど、果実味とボディの豊かな赤ワインに用いられる。"}, {"no": 539, "f": "テイスティング", "h": "minerality", "i": "/ˌmɪnəˈrælɪti/", "p": "名詞", "g": "ミネラリティ（鉱物的な風味）", "s": 0, "r": "saline（塩味のある）／earthy（土っぽい）／terroir（テロワール）", "n": "火打石や湿った石などを思わせる香りや風味の総称。"}, {"no": 540, "f": "テイスティング", "h": "nose", "i": "/noʊz/", "p": "名詞", "g": "香り", "s": 0, "r": "aroma（アロマ）／bouquet（ブーケ・熟成香）／palate（味わい）", "n": "ワインから感じられる香りの総称。"}, {"no": 541, "f": "テイスティング", "h": "oaky", "i": "/ˈoʊki/", "p": "形容詞", "g": "樽香の強い", "s": 0, "r": "oak influence（樽の影響）／toast（トースト香）／vanillin（バニリン）", "n": "バニラやトーストなど樽由来の香りが目立つ様子。過度な場合はやや否定的な含みでも使われる。"}, {"no": 542, "f": "テイスティング", "h": "peppery", "i": "/ˈpɛpəri/", "p": "形容詞", "g": "胡椒のような", "s": 0, "r": "rotundone（ロタンドン・黒胡椒香成分）／spicy（スパイシーな）", "n": "黒胡椒や白胡椒を思わせるスパイス香の形容。シラーに特徴的で、黒胡椒香はロタンドンとの関連が知られている。"}, {"no": 543, "f": "テイスティング", "h": "perfumed", "i": "/pərˈfjuːmd/", "p": "形容詞", "g": "香水のように芳香豊かな", "s": 0, "r": "aromatic（香り高い）／floral（花のような）", "n": "花や香水を思わせる、強く華やかな香りの形容。アロマティックで香りの豊かなワインに用いられる。"}, {"no": 544, "f": "テイスティング", "h": "primary aroma", "i": "/ˈpraɪmɛri əˈroʊmə/", "p": "名詞句", "g": "一次アロマ（ブドウ由来の香り）", "s": 0, "r": "secondary aroma（二次アロマ）／tertiary aroma（三次アロマ）", "n": "ブドウそのものに由来する香り。果実・花・ハーブなどの香りを含み、ブドウ品種の特徴を反映する。"}, {"no": 545, "f": "テイスティング", "h": "raisiny", "i": "/ˈreɪzəni/", "p": "形容詞", "g": "干しブドウのような風味の", "s": 0, "r": "raisining（干しブドウ化）／sun-drying（陰干し・天日干し）／passerillage（パスリヤージュ）", "n": "過熟や乾燥したブドウを思わせる干しブドウ様の香りや風味。酒精強化ワインや陰干しワインなどに特徴的。"}, {"no": 546, "f": "テイスティング", "h": "red fruit", "i": "/ˈrɛd fruːt/", "p": "名詞句", "g": "赤系果実", "s": 0, "r": "black fruit（黒系果実）／dried fruit（ドライフルーツ）", "n": "イチゴ、ラズベリー、赤チェリーなどを思わせる香りや風味の表現。ピノ・ノワールなどの赤ワインに使われる。"}, {"no": 547, "f": "テイスティング", "h": "secondary aroma", "i": "/ˈsɛkənderi əˈroʊmə/", "p": "名詞句", "g": "二次アロマ（発酵由来の香り）", "s": 0, "r": "primary aroma（一次アロマ）／tertiary aroma（三次アロマ）", "n": "発酵などの醸造工程に由来する香り。酵母による発酵由来の香りや、MLFによる乳製品様の香りなどを指す。"}, {"no": 548, "f": "テイスティング", "h": "stone fruit", "i": "/ˈstoʊn fruːt/", "p": "名詞句", "g": "核果（桃・アプリコットなど）", "s": 0, "r": "citrus（柑橘系）／tropical fruit（トロピカルフルーツ）", "n": "桃やアプリコット、ネクタリンなど、硬い核を持つ果実を思わせる香りや風味の表現。白ワインなどに使われる。"}, {"no": 549, "f": "テイスティング", "h": "tertiary aroma", "i": "/ˈtɜːrʃiəri əˈroʊmə/", "p": "名詞句", "g": "三次アロマ（熟成由来の香り）", "s": 0, "r": "primary aroma（一次アロマ）／secondary aroma（二次アロマ）／bouquet（熟成香）", "n": "瓶や樽の熟成で発達する香り。ナッツやキノコ、蜂蜜など、時間が育む複雑な風味の層を指す。"}, {"no": 550, "f": "テイスティング", "h": "tropical fruit", "i": "/ˈtrɒpɪkəl fruːt/", "p": "名詞句", "g": "トロピカルフルーツ", "s": 0, "r": "citrus（柑橘系）／stone fruit（核果）", "n": "パイナップルやマンゴー、パッションフルーツなどを思わせる香りや風味の表現。温暖産地の白ワインなどに使われる。"}, {"no": 551, "f": "テイスティング", "h": "vegetal", "i": "/ˈvɛdʒətəl/", "p": "形容詞", "g": "植物的な、野菜のような", "s": 0, "r": "grassy（草のような）／green（未熟な）／methoxypyrazine（メトキシピラジン）", "n": "野菜や植物を思わせる香りや風味の表現。青ピーマンや青草などのニュアンスを含み、品種や成熟度によって現れる。"}, {"no": 552, "f": "テイスティング", "h": "attack", "i": "/əˈtæk/", "p": "名詞", "g": "アタック、口に含んだ直後の印象", "s": 0, "r": "mid-palate（中盤の味わい）／finish（フィニッシュ・後味）", "n": "ワインを口に含んだ直後に感じる味わいの立ち上がり。強さや明確さなどを評価する。"}, {"no": 553, "f": "テイスティング", "h": "balance", "i": "/ˈbæləns/", "p": "名詞", "g": "バランス（均衡）", "s": 0, "r": "length（余韻の長さ）／intensity（強さ）／complexity（複雑さ）", "n": "酸・糖・タンニン・アルコール・風味が調和した状態。ワインの品質を評価する重要な要素。"}, {"no": 554, "f": "テイスティング", "h": "body", "i": "/ˈbɒdi/", "p": "名詞", "g": "ボディ（コク）", "s": 0, "r": "structure（骨格）／mouthfeel（口当たり）", "n": "口中で感じる重量感や厚みの度合い。アルコールやエキスなどの総合的な印象で、light・medium・full-bodiedなどと表現する。"}, {"no": 555, "f": "テイスティング", "h": "concentrated", "i": "/ˈkɒnsəntreɪtɪd/", "p": "形容詞", "g": "凝縮した", "s": 0, "r": "concentration（凝縮度）／dense（密度の高い）／intensity（強度）", "n": "果実味や香味が高い密度で感じられる状態。必ずしもアルコールやタンニンが強いことを意味しない。"}, {"no": 556, "f": "テイスティング", "h": "crisp", "i": "/krɪsp/", "p": "形容詞", "g": "クリスプ（爽やかな）", "s": 0, "r": "acidity（酸味）／tart（鋭い酸）", "n": "爽やかで引き締まった酸を感じる味わい。"}, {"no": 557, "f": "テイスティング", "h": "dense", "i": "/dens/", "p": "形容詞", "g": "密度の高い", "s": 0, "r": "concentrated（凝縮した）／rich（濃厚な）／firm（硬質な）", "n": "果実味や構造が詰まったように感じられる、密度の高い味わい。"}, {"no": 558, "f": "テイスティング", "h": "dry", "i": "/draɪ/", "p": "形容詞", "g": "辛口（甘味のない）", "s": 0, "r": "sweet（甘口）／off-dry（中辛口）／residual sugar（残糖）", "n": "残糖が少なく、甘味をほとんど感じない味わい。"}, {"no": 559, "f": "テイスティング", "h": "flabby", "i": "/ˈflæbi/", "p": "形容詞", "g": "酸が乏しく締まりのない", "s": 0, "r": "racy（酸が鮮烈な）／crisp（きりっとした）／acidity（酸味）", "n": "酸が不足し、果実味やアルコールに対して味わいの骨格が弱く感じられる状態。"}, {"no": 560, "f": "テイスティング", "h": "flavour characteristics", "i": "/ˈfleɪvər ˌkærəktəˈrɪstɪks/", "p": "名詞句", "g": "風味特性", "s": 0, "r": "flavour intensity（風味の強さ）／primary aroma（一次アロマ）", "n": "口中で感じられる具体的な風味の特徴。果実、花、ハーブ、スパイスなどが含まれる。"}, {"no": 561, "f": "テイスティング", "h": "flavour intensity", "i": "/ˈfleɪvər ɪnˈtɛnsəti/", "p": "名詞句", "g": "風味の強さ", "s": 0, "r": "aroma intensity（香りの強さ）／concentration（凝縮感）", "n": "口中で感じる風味の強さ。light（弱い）からpronounced（顕著な）などで表す。"}, {"no": 562, "f": "テイスティング", "h": "fruit-forward", "i": "/ˌfruːt ˈfɔːrwərd/", "p": "形容詞", "g": "果実味が前面に出た", "s": 0, "r": "jammy（ジャムのような）／primary aroma（第一アロマ）", "n": "果実の香りや風味が前面に出たスタイルの形容。新世界の温暖産地のワインなどに多く見られる。"}, {"no": 563, "f": "テイスティング", "h": "full-bodied", "i": "/ˌfʊl ˈbɑːdid/", "p": "形容詞", "g": "フルボディの", "s": 0, "r": "light-bodied（ライトボディの・対義）／body（ボディ）", "n": "口中に厚みと重量感があり、豊かで充実した味わいのワインを表す基本用語。"}, {"no": 564, "f": "テイスティング", "h": "juicy", "i": "/ˈdʒuːsi/", "p": "形容詞", "g": "ジューシーな、みずみずしい", "s": 0, "r": "fruit-forward（果実味が前面に出た）／lively（生き生きとした）", "n": "搾りたての果汁のような、みずみずしく豊かな果実味を持つ様子。果実味と酸が生き生きと感じられるワインに用いる。"}, {"no": 565, "f": "テイスティング", "h": "lean", "i": "/liːn/", "p": "形容詞", "g": "細身の・軽快な", "s": 0, "r": "rich（豊かな・濃厚な）／linear（直線的な）／racy（酸が鮮烈な）", "n": "果実味やボディが控えめで、酸が前面に出たすっきりしたスタイルを表す。"}, {"no": 566, "f": "テイスティング", "h": "light-bodied", "i": "/ˌlaɪt ˈbɑːdid/", "p": "形容詞", "g": "ライトボディの", "s": 0, "r": "full-bodied（フルボディの・対義）／body（ボディ）", "n": "口中で軽やかに感じられ、重量感や厚みが比較的少ないワインを表す。アルコール度数が低い場合が多い。"}, {"no": 567, "f": "テイスティング", "h": "linear", "i": "/ˈlɪniər/", "p": "形容詞", "g": "直線的な", "s": 0, "r": "lean（細身の）／tight（引き締まった）／racy（酸が鮮烈な）", "n": "味わいが横に広がるより、酸や果実味が明確な軸に沿って感じられる表現。"}, {"no": 568, "f": "テイスティング", "h": "lively", "i": "/ˈlaɪvli/", "p": "形容詞", "g": "生き生きとした、活気のある", "s": 0, "r": "crisp（爽やかな）／racy（快活な酸をもつ）", "n": "酸や果実味などが生き生きと感じられ、活力のある印象を表す。若々しい白やスパークリングなどに用いられる。"}, {"no": 569, "f": "テイスティング", "h": "luscious", "i": "/ˈlʌʃəs/", "p": "形容詞", "g": "ラシャス（濃密な甘口）", "s": 0, "r": "sweet（甘口）／medium-sweet（ミディアムスイート）／rich（豊かな）", "n": "果実味や甘みが豊かで、濃厚かつなめらかな味わいを表す。甘口ワインなどに用いられる。"}, {"no": 570, "f": "テイスティング", "h": "medium-dry", "i": "/ˌmiːdiəm ˈdraɪ/", "p": "形容詞", "g": "ミディアムドライ（やや辛口）", "s": 0, "r": "off-dry（オフドライ）／medium-sweet（ミディアムスイート）", "n": "控えめな甘みを残した、やや辛口の味わい。"}, {"no": 571, "f": "テイスティング", "h": "medium-sweet", "i": "/ˌmiːdiəm ˈswiːt/", "p": "形容詞", "g": "ミディアムスイート（中甘口）", "s": 0, "r": "medium-dry（ミディアムドライ）／sweet（甘口）", "n": "はっきりした甘みを感じる中甘口の味わい。"}, {"no": 572, "f": "テイスティング", "h": "mid-palate", "i": "/ˌmɪd ˈpælət/", "p": "名詞句", "g": "中盤の味わい", "s": 0, "r": "palate（味わい）／attack（アタック・第一印象）／finish（フィニッシュ・余韻）", "n": "口に含んだ後半から余韻に入るまでの中盤の味わい。果実味や構造の厚みを評価する。"}, {"no": 573, "f": "テイスティング", "h": "mousse", "i": "/ˈmuːs/", "p": "名詞", "g": "ムース（グラス中の泡立ち）", "s": 0, "r": "bubble（気泡）／pétillance（微発泡）", "n": "グラス中で形成される泡立ちや泡の集合。泡の細かさや持続性など、スパークリングワインの泡の状態を表す。"}, {"no": 574, "f": "テイスティング", "h": "mouth-watering", "i": "/ˈmaʊθ ˌwɔːtərɪŋ/", "p": "形容詞", "g": "唾液を誘う、食欲をそそる", "s": 0, "r": "acidity（酸味）／crisp（快活な酸の）／juicy（ジューシーな）", "n": "唾液が分泌されるような、みずみずしく食欲をそそる味わいの形容。高い酸によって生じることが多い。"}, {"no": 575, "f": "テイスティング", "h": "off-dry", "i": "/ˌɒf ˈdraɪ/", "p": "形容詞", "g": "オフドライ（ほのかな甘み）", "s": 0, "r": "dry（辛口）／medium-dry（ミディアムドライ）", "n": "わずかな甘みを感じる味わい。残糖を含むが、甘口とまでは感じないワインに用いる。"}, {"no": 576, "f": "テイスティング", "h": "palate", "i": "/ˈpælət/", "p": "名詞", "g": "パレット（口中で感じる味わい）", "s": 0, "r": "mouthfeel（口当たり）／texture（質感）／nose（香り）／finish（余韻）", "n": "口中で感じる味・質感・風味の総体。解剖学では「口蓋」を意味し、ワインでは on the palate（口に含むと／口中では）のように使う。"}, {"no": 577, "f": "テイスティング", "h": "pétillance", "i": "/peˈtijɑ̃s/", "p": "名詞", "g": "ペティヤンス（微発泡）", "s": 0, "r": "spritz（微発泡）／mousse（泡立ち）", "n": "スティルワインに溶存する炭酸ガスがもたらす舌先の微かな泡立ち。ワインに爽やかさや軽やかな刺激を与える。"}, {"no": 578, "f": "テイスティング", "h": "racy", "i": "/ˈreɪsi/", "p": "形容詞", "g": "酸が鮮烈な・生き生きした", "s": 0, "r": "zesty（快活な酸のある）／crisp（きりっとした）／flabby（酸が乏しく締まりのない）", "n": "鮮明で張りのある酸を持ち、軽快で生き生きとした印象のワインを表す。"}, {"no": 579, "f": "テイスティング", "h": "rich", "i": "/rɪtʃ/", "p": "形容詞", "g": "豊かな・濃厚な", "s": 0, "r": "lean（細身の）／luscious（甘美な）／concentrated（凝縮した）", "n": "果実味、アルコール、甘みなどが豊かで、口中に厚みを感じる表現。"}, {"no": 580, "f": "テイスティング", "h": "saline", "i": "/ˈseɪlaɪn/", "p": "形容詞", "g": "塩味のある（塩っぽい風味）", "s": 0, "r": "minerality（ミネラル感）／umami（旨味）", "n": "海水や塩を思わせる風味を表す表現。ワインの味わいに塩味を思わせる印象がある場合に用いる。"}, {"no": 581, "f": "テイスティング", "h": "savoury", "i": "/ˈseɪvəri/", "p": "形容詞", "g": "セイヴォリーな、旨味・塩味系の", "s": 0, "r": "savory（米式綴り）／umami（うま味）／meaty（肉のような）", "n": "果実の甘やかさとは対照的な、ハーブ、土、肉、うま味などを思わせる風味の形容。赤・白を問わず用いられる。"}, {"no": 582, "f": "テイスティング", "h": "spirity", "i": "/ˈspɪrɪti/", "p": "形容詞", "g": "スピリッツ香のある（アルコール感の強い）", "s": 0, "r": "warming（温かみのある）／alcohol（アルコール）", "n": "スピリッツを思わせる強いアルコールの香りや風味を表す。酒精強化ワインなど、アルコール度数の高いワインで感じられることがある。"}, {"no": 583, "f": "テイスティング", "h": "spritz", "i": "/ˈsprɪts/", "p": "名詞", "g": "微発泡（軽い発泡感）", "s": 0, "r": "pétillance（微発泡）／semi-sparkling（弱発泡性）", "n": "ワインに感じられる軽い発泡感。わずかなCO₂による細かな泡が舌や口内で感じられる状態を指す。"}, {"no": 584, "f": "テイスティング", "h": "sweet", "i": "/swiːt/", "p": "形容詞", "g": "甘口", "s": 0, "r": "dry（辛口）／medium-sweet（ミディアムスイート）／luscious（濃密な甘口）", "n": "残糖による明確な甘味を感じる味わい。高い酸とのバランスが品質を左右する。"}, {"no": 585, "f": "テイスティング", "h": "tart", "i": "/tɑːrt/", "p": "形容詞", "g": "酸味の強い", "s": 0, "r": "crisp（爽やかな酸）／acidity（酸味）", "n": "酸味が鋭く、酸っぱい印象を与える味わい。酸の強さや質を表現する際に用いる。"}, {"no": 586, "f": "テイスティング", "h": "umami", "i": "/uˈmɑːmi/", "p": "名詞", "g": "うま味", "s": 0, "r": "savoury（セイヴォリーな）／meaty（肉のような）", "n": "グルタミン酸などによる、だしや肉類に感じられる味わい。熟成や澱との接触による風味としてワインにも感じられる。"}, {"no": 587, "f": "テイスティング", "h": "warming", "i": "/ˈwɔːrmɪŋ/", "p": "形容詞", "g": "温かみのある（アルコールによる温感）", "s": 0, "r": "spirity（スピリッツ香の強い）／alcohol（アルコール）", "n": "アルコールによって口中や喉に感じる温かさを表す。アルコールの強さを表現する際に用いる。"}, {"no": 588, "f": "テイスティング", "h": "astringency", "i": "/əˈstrɪndʒənsi/", "p": "名詞", "g": "収斂味", "s": 0, "r": "tannin（タンニン）／grippy（掴むような渋み）", "n": "口内が乾いたり引き締まったりする収斂感。タンニンなどによって生じ、ワインの質感に影響する。"}, {"no": 589, "f": "テイスティング", "h": "chewy", "i": "/ˈtʃuːi/", "p": "形容詞", "g": "チューイー（噛み応えのある）", "s": 0, "r": "grippy（掴むような渋み）／coarse（粗い）", "n": "口中で噛みしめるような、しっかりとした質感。特にタンニンの豊かで力強いワインに用いられる。"}, {"no": 590, "f": "テイスティング", "h": "coarse", "i": "/kɔːrs/", "p": "形容詞", "g": "粗い（タンニンが）", "s": 0, "r": "fine-grained（きめ細かい）／grippy（掴むような渋み）", "n": "きめが粗くざらつく渋みの質感。未熟なタンニンに多く、fine-grainedな成熟タンニンと対照的に評される。"}, {"no": 591, "f": "テイスティング", "h": "creamy", "i": "/ˈkriːmi/", "p": "形容詞", "g": "クリーミーな、なめらかな", "s": 0, "r": "buttery（バターのような）／silky（シルキーな）／lees stirring（澱の撹拌）", "n": "クリームのようになめらかで、柔らかな質感の形容。澱との接触やマロラクティック発酵を経た白やスパークリングなどに用いられる。"}, {"no": 592, "f": "テイスティング", "h": "fine-grained", "i": "/ˌfaɪn ˈɡreɪnd/", "p": "形容詞", "g": "きめ細かい（タンニン）", "s": 0, "r": "coarse（粗い）／ripe tannin（熟したタンニン）", "n": "きめが細かく、滑らかに感じられるタンニンの質感。"}, {"no": 593, "f": "テイスティング", "h": "firm", "i": "/fɜːrm/", "p": "形容詞", "g": "しっかりした・硬質な", "s": 0, "r": "soft（柔らかな）／tight（引き締まった）／structure（骨格）", "n": "タンニンや酸が明確で、しっかりした構造を持つワインを表す。"}, {"no": 594, "f": "テイスティング", "h": "grip", "i": "/ɡrɪp/", "p": "名詞", "g": "グリップ。タンニン由来の掴むような硬さ", "s": 0, "r": "grippy（グリップのある）／astringency（収斂性）／tannin（タンニン）", "n": "タンニンなどによる、口中を引き締めるような収斂感。ワインに輪郭や骨格を与える要素として、特に赤ワインで用いられる。形容詞形はgrippy。"}, {"no": 595, "f": "テイスティング", "h": "mouthfeel", "i": "/ˈmaʊθfiːl/", "p": "名詞", "g": "口当たり（食感）", "s": 0, "r": "texture（質感）／body（ボディ）", "n": "ワインが口中に与える質感の総体。タンニン・酸・アルコールなどによる滑らかさ、厚み、ざらつきなどを含む。"}, {"no": 596, "f": "テイスティング", "h": "polished", "i": "/ˈpɒlɪʃt/", "p": "形容詞", "g": "洗練された・滑らかな", "s": 0, "r": "supple（しなやかな）／velvety（ビロードのような）／coarse（粗い）", "n": "酸やタンニンなどがよく統合され、粗さのない滑らかな仕上がりを表す。"}, {"no": 597, "f": "テイスティング", "h": "ripe", "i": "/raɪp ˈtænɪn/", "p": "名詞句", "g": "熟した", "s": 0, "r": "tannin（タンニン）／fine-grained（きめ細かい）", "n": "十分に成熟し、丸みと滑らかな質感を与えるタンニン。きめ細かく滑らかで、粗く収斂性の強い未熟なタンニンと対を成す。"}, {"no": 598, "f": "テイスティング", "h": "silky", "i": "/ˈsɪlki/", "p": "形容詞", "g": "シルキーな、絹のようになめらかな", "s": 0, "r": "velvety（ベルベットのような）／supple（しなやかな）／texture（テクスチャー）", "n": "絹のようになめらかで繊細な口当たりの形容。特にタンニンの質感を表す際に用いられる。"}, {"no": 599, "f": "テイスティング", "h": "soft", "i": "/sɒft/", "p": "形容詞", "g": "柔らかな・酸やタンニンの穏やかな", "s": 0, "r": "firm（しっかりした・硬質な）／supple（しなやかな）／velvety（ビロードのような）", "n": "酸やタンニンが穏やかで、口当たりが柔らかい状態。必ずしも欠点ではない。"}, {"no": 600, "f": "テイスティング", "h": "supple", "i": "/ˈsʌpəl/", "p": "形容詞", "g": "しなやかな", "s": 0, "r": "soft（柔らかな）／velvety（ビロードのような）／polished（洗練された）", "n": "タンニンが柔らかく、しなやかで滑らかな口当たりを表す。"}, {"no": 601, "f": "テイスティング", "h": "tannic", "i": "/ˈtænɪk/", "p": "形容詞", "g": "タンニンの強い、タンニンを感じる", "s": 0, "r": "tannin（タンニン）／astringency（渋味）／grippy（グリップのある）", "n": "タンニンの存在感が強く、収斂感が目立つ状態を表す形容詞。特に赤ワインのテイスティングで用いられる。"}, {"no": 602, "f": "テイスティング", "h": "texture", "i": "/ˈtɛkstʃər/", "p": "名詞", "g": "質感（テクスチャー）", "s": 0, "r": "mouthfeel（口当たり）／velvety（ベルベットのような）", "n": "ワインを口に含んだときに感じる物理的な質感。粘性やタンニンなどによる、滑らかさ・粗さ・厚みなどを表す。"}, {"no": 603, "f": "テイスティング", "h": "velvety", "i": "/ˈvɛlvəti/", "p": "形容詞", "g": "ベルベットのような", "s": 0, "r": "texture（質感）／fine-grained（きめ細かい）", "n": "ベルベットのように滑らかで柔らかな口当たりを表す。きめ細かく、収斂性の穏やかなタンニンを指すことが多い。"}, {"no": 604, "f": "テイスティング", "h": "viscous", "i": "/ˈvɪskəs/", "p": "形容詞", "g": "粘性のある、とろりとした", "s": 0, "r": "glycerol（グリセロール）／legs（脚・ワインの涙）", "n": "とろりとして粘性の高い口当たりの形容。グリセロールや糖分、アルコールなどの影響で生じ、甘口やフルボディのワインに用いられる。"}, {"no": 605, "f": "テイスティング", "h": "backward", "i": "/ˈbækwərd/", "p": "形容詞", "g": "（若く）未発達の、閉じた状態の", "s": 0, "r": "closed（閉じた）／youthful（若々しい）／fully developed（十分に熟成した）", "n": "熟成が進んでおらず、まだ本来の香りや味わいを十分に示していない状態を指す。"}, {"no": 606, "f": "テイスティング", "h": "closed", "i": "/kloʊzd/", "p": "形容詞", "g": "閉じた・開いていない", "s": 0, "r": "tight（引き締まった・閉じた）／youthful（若々しい）／developing（発展途上の）", "n": "香りや果実味が十分に表れず、構造が前面に出ている状態。熟成や空気との接触で開くことがある。"}, {"no": 607, "f": "テイスティング", "h": "developing", "i": "/dɪˈvɛləpɪŋ/", "p": "形容詞", "g": "発展中の、熟成が進んでいる", "s": 0, "r": "youthful（若々しい）／fully developed（完全に熟成した）", "n": "一次香に加えて二次・三次の要素が現れ、香りや味わいが発達しつつある段階。"}, {"no": 608, "f": "テイスティング", "h": "development", "i": "/dɪˈvɛləpmənt/", "p": "名詞", "g": "熟成段階（発達度）", "s": 0, "r": "developing（発展途上の）／maturation（熟成）", "n": "ワインの香りや味わいの発達度。youthful（若々しい）からtired（熟成が進みすぎた）までの段階で評価する。"}, {"no": 609, "f": "テイスティング", "h": "fully developed", "i": "/ˌfʊli dɪˈvɛləpt/", "p": "形容詞", "g": "十分に発達した", "s": 0, "r": "youthful（若々しい）／developing（発展途上の）", "n": "香りや味わいが十分に発達し、三次的な要素も感じられる状態。"}, {"no": 610, "f": "テイスティング", "h": "tight", "i": "/taɪt/", "p": "形容詞", "g": "引き締まった・閉じた", "s": 0, "r": "closed（閉じた）／firm（しっかりした）／youthful（若々しい）", "n": "酸やタンニンなどの構造が強く、果実味がまだ十分に開いていない状態。"}, {"no": 611, "f": "テイスティング", "h": "youthful", "i": "/ˈjuːθfəl/", "p": "形容詞", "g": "若々しい（熟成の進んでいない）", "s": 0, "r": "fully developed（完全に熟成した）／developing（発展途上の）", "n": "一次アロマが主体の若々しい状態。発達度を表し、瓶熟成の余地を判断する手がかりとなる。"}, {"no": 612, "f": "テイスティング", "h": "acceptable", "i": "/əkˈsɛptəbəl/", "p": "形容詞", "g": "許容できる（欠点はあるが許容範囲の品質）", "s": 0, "r": "good（良い）／faulty（欠陥のある）", "n": "品質や状態が許容できる水準にあること。評価基準に照らして、問題なく受け入れられるワインを指す。"}, {"no": 613, "f": "テイスティング", "h": "aftertaste", "i": "/ˈæftərteɪst/", "p": "名詞", "g": "後味（アフターテイスト）", "s": 0, "r": "finish（余韻）／length（余韻の長さ）", "n": "飲み込んだ後に口中に残る味や香り。finishとほぼ同義に使われるが、aftertasteは特に残る味や香りに焦点を置く。"}, {"no": 614, "f": "テイスティング", "h": "age-worthy", "i": "/ˈeɪdʒ ˌwɜːrði/", "p": "形容詞", "g": "熟成に耐える・熟成向きの", "s": 0, "r": "suitability for bottle ageing（瓶熟成適性）／drinking window（飲み頃）", "n": "長期の瓶熟成によって複雑さや調和が増す資質を持つこと。酸やタンニン、糖などが熟成を支える要素となる。"}, {"no": 615, "f": "テイスティング", "h": "assessment of quality", "i": "/əˈsɛsmənt əv ˈkwɒləti/", "p": "名詞句", "g": "品質評価", "s": 0, "r": "quality level（品質水準）／balance（バランス）", "n": "ワインの品質を総合的に評価すること。香りや味わい、バランス、熟成度などさまざまな要素を考慮する。"}, {"no": 616, "f": "テイスティング", "h": "backbone", "i": "/ˈbækboʊn/", "p": "名詞", "g": "骨格", "s": 0, "r": "structure（構造）／tannin（タンニン）／acidity（酸味）", "n": "酸やタンニンなど、ワインの構造を支える主要な要素を指す比喩。味わいに芯やバランスを与える骨格を表す。"}, {"no": 617, "f": "テイスティング", "h": "complex", "i": "/ˈkɒmpleks/", "p": "形容詞", "g": "複雑な", "s": 0, "r": "complexity（複雑性）／nuanced（微妙なニュアンスに富む）／simple（単調な）", "n": "複数の香味や層が重なり、単純ではない味わいを持つワインを表す。"}, {"no": 618, "f": "テイスティング", "h": "complexity", "i": "/kəmˈplɛksəti/", "p": "名詞", "g": "複雑さ", "s": 0, "r": "concentration（凝縮感）／balance（バランス）", "n": "香りや味わいに多様な要素が重なり、単調でない状態。"}, {"no": 619, "f": "テイスティング", "h": "concentration", "i": "/ˌkɒnsənˈtreɪʃən/", "p": "名詞", "g": "凝縮感", "s": 0, "r": "intensity（強さ）／complexity（複雑さ）", "n": "果実やその他の風味が密に感じられる印象。味わいの豊かさや厚みにつながる。"}, {"no": 620, "f": "テイスティング", "h": "elegant", "i": "/ˈɛlɪɡənt/", "p": "形容詞", "g": "エレガントな、優雅な", "s": 0, "r": "finesse（フィネス）／rustic（素朴な・対義）", "n": "力強さよりも繊細さや調和、バランスのよさを備えたワインへの賛辞。香りや味わいが上品で調和している様子を表す。"}, {"no": 621, "f": "テイスティング", "h": "expressive", "i": "/ɪkˈsprɛsɪv/", "p": "形容詞", "g": "表現力豊かな", "s": 0, "r": "pronounced（香りが顕著な）／closed（閉じた・対義）", "n": "品種や産地、ヴィンテージなどの個性が香りや味わいにはっきり表れている状態への賛辞。"}, {"no": 622, "f": "テイスティング", "h": "faulty", "i": "/ˈfɔːlti/", "p": "形容詞", "g": "欠陥のある", "s": 0, "r": "clean（欠陥のない）／fault（欠陥）", "n": "コルク臭や酸化など、ワインに明らかな欠陥がある状態。"}, {"no": 623, "f": "テイスティング", "h": "finesse", "i": "/fɪˈnes/", "p": "名詞", "g": "繊細さ・優美さ", "s": 0, "r": "elegance（優雅さ）／nuanced（微妙なニュアンスに富む）／polished（洗練された）", "n": "力強さではなく、酸・タンニン・果実味などの調和と繊細さを評価する表現。"}, {"no": 624, "f": "テイスティング", "h": "finish", "i": "/ˈfɪnɪʃ/", "p": "名詞", "g": "余韻（フィニッシュ）", "s": 0, "r": "length（余韻の長さ）／aftertaste（後味）", "n": "飲み込んだ後に残る風味の長さや質。"}, {"no": 625, "f": "テイスティング", "h": "food-friendly", "i": "/ˈfuːd ˌfrɛndli/", "p": "形容詞", "g": "料理に合わせやすい", "s": 0, "r": "food pairing（フードペアリング・料理との相性）／acidity（酸味）", "n": "酸やタンニン、果実味などのバランスがよく、さまざまな料理と合わせやすいワインを表す。"}, {"no": 626, "f": "テイスティング", "h": "good", "i": "/ɡʊd/", "p": "形容詞", "g": "良い（品質評価）", "s": 0, "r": "acceptable（許容できる）／very good（非常に良い）／outstanding（傑出した）", "n": "欠陥がなく、バランスが取れ、ある程度の複雑さや集中度を備える。上位評価ほどの複雑さ・余韻・凝縮感はない。"}, {"no": 627, "f": "テイスティング", "h": "integration", "i": "/ˌɪntɪˈɡreɪʃən/", "p": "名詞", "g": "一体感（統合）", "s": 0, "r": "balance（バランス）／complexity（複雑さ）", "n": "酸・タンニン・アルコール・樽などの要素が調和し、一体となって感じられる状態。特に熟成したワインで用いられる。"}, {"no": 628, "f": "テイスティング", "h": "length", "i": "/lɛŋθ/", "p": "名詞", "g": "余韻の長さ", "s": 0, "r": "finish（余韻）／aftertaste（後味）", "n": "飲み込んだ後も心地よい風味が持続する長さ。品質評価における重要な要素の一つ。"}, {"no": 629, "f": "テイスティング", "h": "nuanced", "i": "/ˈnjuːɑːnst/", "p": "形容詞", "g": "微妙なニュアンスに富む", "s": 0, "r": "complex（複雑な）／complexity（複雑性）／finesse（繊細さ）", "n": "細かな香味の違いや層が感じられ、単純ではない味わいを表す。"}, {"no": 630, "f": "テイスティング", "h": "outstanding", "i": "/aʊtˈstændɪŋ/", "p": "形容詞", "g": "傑出した（最高品質）", "s": 0, "r": "acceptable（許容できる）／ good（良い）／very good（非常に良い）", "n": "重要な短所がなく、複数の明確な長所を備えた非常に高品質なワイン。際立った完成度を示す。"}, {"no": 631, "f": "テイスティング", "h": "persistence", "i": "/pərˈsɪstəns/", "p": "名詞", "g": "持続性", "s": 0, "r": "length（余韻の長さ）／finish（フィニッシュ）／aftertaste（後味）", "n": "飲み込んだ後も香味がどれだけ長く残るかを表す性質。"}, {"no": 632, "f": "テイスティング", "h": "readiness for drinking", "i": "/ˈrɛdinəs fər ˈdrɪŋkɪŋ/", "p": "名詞句", "g": "飲み頃（適飲性）", "s": 0, "r": "suitability for bottle ageing（瓶熟成の適性）／development（熟成段階）", "n": "ワインが飲み頃に達しているかを判断すること。発達度と構造から、若すぎる・飲み頃・ピークを過ぎた状態を見極める。"}, {"no": 633, "f": "テイスティング", "h": "robust", "i": "/roʊˈbʌst/", "p": "形容詞", "g": "力強い、骨格のしっかりした", "s": 0, "r": "full-bodied（フルボディの）／rustic（素朴な）", "n": "風味が豊かで力強く、しっかりした構造を持つワインの形容。特に濃厚な赤ワインに用いられる。"}, {"no": 634, "f": "テイスティング", "h": "rustic", "i": "/ˈrʌstɪk/", "p": "形容詞", "g": "素朴な、田舎風の、粗野な", "s": 0, "r": "elegant（エレガントな・対義）／polished（洗練された・対義）", "n": "素朴で飾らず、やや粗野な印象のワインを表す。個性として好意的にも、洗練不足として否定的にも用いられる。"}, {"no": 635, "f": "テイスティング", "h": "structure", "i": "/ˈstrʌktʃər/", "p": "名詞", "g": "骨格（構成）", "s": 0, "r": "body（ボディ）／tannin（タンニン）／acidity（酸味）", "n": "酸・タンニン・アルコールなどが形づくるワインの骨格。口中での厚みやバランス、熟成能力などを支える要素として評価される。"}, {"no": 636, "f": "テイスティング", "h": "suitability for bottle ageing", "i": "/ˌsuːtəˈbɪləti fər ˈbɒtl ˈeɪdʒɪŋ/", "p": "名詞句", "g": "瓶熟成の適性", "s": 0, "r": "readiness for drinking（飲み頃）／development（熟成段階）", "n": "さらなる瓶熟成によって品質が向上する可能性。酸・タンニン・アルコール・果実味などの構造とバランスをもとに判断する。"}, {"no": 637, "f": "テイスティング", "h": "typicity", "i": "/tɪˈpɪsɪti/", "p": "名詞", "g": "典型性（品種・産地らしさ）", "s": 0, "r": "varietal definition（品種の明確さ）／identification（同定）", "n": "品種や産地に期待される特徴をどの程度よく表しているか。ワインの典型性を評価する観点の一つ。"}, {"no": 638, "f": "テイスティング", "h": "varietal definition", "i": "/vəˈraɪətəl ˌdɛfɪˈnɪʃən/", "p": "名詞句", "g": "品種の明確さ", "s": 0, "r": "typicity（典型性）／varietal wine（単一品種ワイン）", "n": "品種に特徴的な個性がどれだけ鮮明に表れているか。ワインの品種らしさを評価する観点の一つ。"}, {"no": 639, "f": "テイスティング", "h": "blind tasting", "i": "/ˌblaɪnd ˈteɪstɪŋ/", "p": "名詞句", "g": "ブラインドテイスティング", "s": 0, "r": "identification（同定）／flight（フライト）", "n": "ラベルを伏せ、外観・香り・味わいからワインを評価する手法。品種・産地・製法などを推定する。"}, {"no": 640, "f": "テイスティング", "h": "bowl", "i": "/boʊl/", "p": "名詞", "g": "ボウル（グラスの膨らんだ部分）", "s": 0, "r": "stem（ステム）／swirling（スワリング）", "n": "香りを集めるグラスの膨らみ。口がすぼまった形が香りを内に留める。"}, {"no": 641, "f": "テイスティング", "h": "decanting", "i": "/dɪˈkæntɪŋ/", "p": "名詞", "g": "デキャンタージュ（澱引き・空気接触のための移し替え）", "s": 0, "r": "deposit（澱）／aeration（空気接触・エアレーション）", "n": "澱を分離したり空気に触れさせたりするため、ワインを瓶からデキャンタへ移す操作。若いワインの香りを開かせる目的でも行われる。"}, {"no": 642, "f": "テイスティング", "h": "flight", "i": "/flaɪt/", "p": "名詞", "g": "フライト（ワインの一組）", "s": 0, "r": "blind tasting（ブラインドテイスティング）", "n": "テイスティングで比較するために、まとめて供されるワインの組。"}, {"no": 643, "f": "テイスティング", "h": "flute", "i": "/fluːt/", "p": "名詞", "g": "フルート（細長いスパークリング用グラス）", "s": 0, "r": "tulip（チューリップ型）／coupe（クープ）", "n": "泡の立ち上がりが映える細長いグラス。香りを取るには広がりのあるチューリップ型が好まれることもある。"}, {"no": 644, "f": "テイスティング", "h": "food pairing", "i": "/ˈfuːd ˌpɛərɪŋ/", "p": "名詞句", "g": "フードペアリング（料理との相性）", "s": 0, "r": "food-friendly（料理に合わせやすい）／serving temperature（適温）", "n": "料理とワインの組み合わせや相性を考えること。酸・甘味・タンニンなど、双方の要素のバランスを考慮する。"}, {"no": 645, "f": "テイスティング", "h": "horizontal tasting", "i": "/ˌhɒrɪˈzɒntəl ˈteɪstɪŋ/", "p": "名詞句", "g": "ホリゾンタルテイスティング（水平試飲）", "s": 0, "r": "vertical tasting（垂直試飲）／blind tasting（ブラインドテイスティング）", "n": "同一ヴィンテージの複数生産者や畑のワインを比較する試飲。生産者やテロワールによる違いを検証できる。"}, {"no": 646, "f": "テイスティング", "h": "identification", "i": "/aɪˌdɛntɪfɪˈkeɪʃən/", "p": "名詞", "g": "同定（品種・産地等の特定）", "s": 0, "r": "blind tasting（ブラインドテイスティング）／typicity（典型性）", "n": "ブラインドテイスティングで、外観・香り・味わいなどの特徴から品種・産地・製法・スタイルなどを特定すること。"}, {"no": 647, "f": "テイスティング", "h": "retronasal", "i": "/ˌrɛtrəʊˈneɪzəl/", "p": "形容詞", "g": "レトロネーザルの（口中から鼻へ抜ける）", "s": 0, "r": "orthonasal（オルソネーザルの・鼻孔から直接嗅ぐ）／nose（ノーズ・香り）", "n": "口中から鼻腔へ抜ける香気の経路を指す語。ワインの風味を感じるうえで重要な知覚経路。"}, {"no": 648, "f": "テイスティング", "h": "spitting", "i": "/ˈspɪtɪŋ/", "p": "名詞", "g": "吐き出し（試飲時）", "s": 0, "r": "spittoon（スピトゥーン・吐器）／blind tasting（ブラインドテイスティング）", "n": "試飲したワインを飲み込まずに吐き出すこと。多数のワインを試飲する際に一般的な方法。"}, {"no": 649, "f": "テイスティング", "h": "stem", "i": "/stɛm/", "p": "名詞", "g": "ステム（グラスの脚。醸造では果梗）", "s": 0, "r": "bowl（ボウル）／destemming（除梗）", "n": "テイスティングではグラスの脚。手の熱や指紋を避けるために持つ部分。醸造の文脈では果房の梗を指す。"}, {"no": 650, "f": "テイスティング", "h": "swirling", "i": "/ˈswɜːrlɪŋ/", "p": "名詞", "g": "スワリング（グラスを回すこと）", "s": 0, "r": "aroma（アロマ）／nose（香り）／legs（レッグ・脚）", "n": "グラスを回してワインを動かし、揮発性の香りを立たせる動作。香りを確認する際の基本動作。"}, {"no": 651, "f": "テイスティング", "h": "tasting note", "i": "/ˈteɪstɪŋ noʊt/", "p": "名詞句", "g": "テイスティングノート（試飲記録）", "s": 0, "r": "blind tasting（ブラインドテイスティング）／aroma（アロマ）／palate（味わい）", "n": "ワインの外観・香り・味わいなどを記述した記録。テイスティングの特徴を整理し、評価するために用いる。"}, {"no": 652, "f": "テイスティング", "h": "vertical tasting", "i": "/ˈvɜːtɪkəl ˈteɪstɪŋ/", "p": "名詞句", "g": "ヴァーティカルテイスティング（垂直試飲）", "s": 0, "r": "horizontal tasting（水平試飲）／vintage variation（年による差）", "n": "同一ワインの複数ヴィンテージを比較する試飲。ヴィンテージによる違いや熟成の進み方を把握できる。"}, {"no": 653, "f": "産地・分類", "h": "appellation hierarchy", "i": "/ˌæpəˈleɪʃən ˈhaɪərɑːki/", "p": "名詞句", "g": "アペラシオンの階層", "s": 0, "r": "appellation（アペラシオン）／regional appellation（地方名アペラシオン）／communal appellation（村名アペラシオン）", "n": "アペラシオンを地理的範囲や規制の違いによって段階的に区分した構造。ブルゴーニュでは地方名→村名→プルミエ・クリュ→グラン・クリュと、範囲が狭くなるにつれて規定が細かくなる。"}, {"no": 654, "f": "産地・分類", "h": "blend", "i": "/blɛnd/", "p": "名詞", "g": "ブレンド（ワイン）・混醸", "s": 0, "r": "blending（ブレンディング）／varietal（単一品種ワイン）／assemblage（アッサンブラージュ）", "n": "複数の品種・区画・ヴィンテージなどのワインを組み合わせたもの。品種だけでなく、産地や熟成方法などの異なるワインを組み合わせる場合もある。"}, {"no": 655, "f": "産地・分類", "h": "communal appellation", "i": "/ˈkɒmjʊnəl ˌæpəˈleɪʃən/", "p": "名詞句", "g": "村名（コミューン）アペラシオン", "s": 0, "r": "village appellation（村名アペラシオン）／regional appellation（地方名アペラシオン）／premier cru（プルミエ・クリュ）", "n": "単一の村（コミューン）を地理的範囲とするアペラシオン。地域名アペラシオンより範囲が限定され、より細かな規定が設けられている。"}, {"no": 656, "f": "産地・分類", "h": "designation", "i": "/ˌdezɪɡˈneɪʃən/", "p": "名詞", "g": "呼称・指定", "s": 0, "r": "appellation（アペラシオン・原産地呼称）／geographical indication（地理的表示）／denominazione（デノミナツィオーネ）", "n": "ワインの産地、品質区分、スタイルなどを公式に示す名称・区分。"}, {"no": 657, "f": "産地・分類", "h": "generic appellation", "i": "/dʒəˈnerɪk ˌæpəˈleɪʃən/", "p": "名詞句", "g": "広域（ジェネリック）アペラシオン", "s": 0, "r": "regional appellation（地方名アペラシオン）／communal appellation（村名アペラシオン）／appellation hierarchy（アペラシオンの階層）", "n": "広い地理的範囲を対象とするアペラシオン。より限定された地域名・村名アペラシオンに比べ、一般に規定の対象範囲が広い。"}, {"no": 658, "f": "産地・分類", "h": "geographical indication", "i": "/dʒiːəˈɡræfɪkəl ˌɪndɪˈkeɪʃən/", "p": "名詞句", "g": "地理的表示", "s": 0, "r": "PDO（保護原産地呼称）／PGI（保護地理的表示）／appellation（アペラシオン）", "n": "特定の地理的地域とワインの品質・特性との結び付きを示す法的な地理的表示。"}, {"no": 659, "f": "産地・分類", "h": "GI (Geographical Indication)", "i": "/ˌdʒiːˈaɪ/", "p": "名詞句", "g": "地理的表示（産地を示す制度・表示）", "s": 0, "r": "geographical indication（地理的表示）／PDO (Protected Designation of Origin)（原産地呼称保護）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "特定の地域と品質・特性の結び付きを示す地理的表示。国・地域によって制度や名称が異なり、EUではPDO・PGIなどがGIに含まれる。"}, {"no": 660, "f": "産地・分類", "h": "PDO (Protected Designation of Origin)", "i": "/ˌpiː diː ˈoʊ/", "p": "名詞句", "g": "PDO（原産地呼称保護）", "s": 0, "r": "protected denomination of origin（保護原産地呼称）／PGI (Protected Geographical Indication)（地理的表示保護）／AOC（原産地統制呼称）", "n": "EUの原産地呼称保護制度。産地との結び付きが強く、原料の生産から製造まで一定の地域内で行われることなどが求められる。"}, {"no": 661, "f": "産地・分類", "h": "PGI (Protected Geographical Indication)", "i": "/ˌpiː dʒiː ˈaɪ/", "p": "名詞句", "g": "PGI（地理的表示保護）", "s": 0, "r": "protected geographical indication（保護地理的表示）／PDO (Protected Designation of Origin)（原産地呼称保護）／IGP（地理的表示保護）", "n": "EUの地理的表示保護制度。PDOより産地との結び付きの要件が緩やかで、原料の生産・加工・調製のいずれか1つが指定地域で行われればよい。"}, {"no": 662, "f": "産地・分類", "h": "regional appellation", "i": "/ˈriːdʒənəl ˌæpəˈleɪʃən/", "p": "名詞句", "g": "地方名アペラシオン", "s": 0, "r": "generic appellation（広域アペラシオン）／village appellation（村名アペラシオン）／appellation hierarchy（アペラシオンの階層）", "n": "広い地域を対象とするアペラシオン。ブルゴーニュでは Bourgogne AOC などが該当し、村名アペラシオンより広い範囲を対象とする。"}, {"no": 663, "f": "産地・分類", "h": "single vineyard", "i": "/ˈsɪŋɡl ˈvɪnjərd/", "p": "名詞句", "g": "単一畑（単一畑ワイン）", "s": 0, "r": "single varietal（単一品種）／estate bottled（エステート詰め）", "n": "一つの畑のブドウだけで造ったワイン。畑の個性やテロワールを表現する。"}, {"no": 664, "f": "産地・分類", "h": "subzone", "i": "/ˈsʌbˌzəʊn/", "p": "名詞", "g": "サブゾーン（親呼称内の小区分）", "s": 0, "r": "appellation（原産地呼称）", "n": "親アペラシオン内の、より厳しい基準を設けた小区分。品種比率や収量などの基準を厳格化し、品質を示す。"}, {"no": 665, "f": "産地・分類", "h": "varietal wine", "i": "/vəˈraɪətəl ˌwaɪn/", "p": "名詞句", "g": "単一品種ワイン（品種名表示ワイン）", "s": 0, "r": "varietal（品種の）／single varietal（単一品種、同義）／variety（品種）／field blend（混植混醸、対概念）", "n": "ラベルに主要品種名を表示したワイン。表示には国・地域ごとの品種比率規定がある。形容詞varietalは「品種の」の意。"}, {"no": 666, "f": "産地・分類", "h": "village appellation", "i": "/ˈvɪlɪdʒ ˌæpəˈleɪʃən/", "p": "名詞句", "g": "村名アペラシオン", "s": 0, "r": "communal appellation（村名アペラシオン）／regional appellation（地方名アペラシオン）／premier cru（プルミエ・クリュ）", "n": "単一の村（コミューン）を対象とする呼称。ブルゴーニュでは地方名とプルミエ・クリュの間に位置し、村名を冠する（例：ムルソーAOC）。"}, {"no": 667, "f": "産地・分類", "h": "AOC", "i": "/ˌeɪ əʊ ˈsiː/", "p": "名詞", "g": "原産地統制呼称（appellation d'origine contrôlée）", "s": 0, "r": "appellation（アペラシオン）／IGP（地理的表示保護）／PDO (Protected Designation of Origin)（原産地呼称保護）", "n": "フランスの原産地呼称制度。産地・品種・収量・栽培・醸造方法などを規定する。EUのPDOに対応するフランスの呼称。"}, {"no": 668, "f": "産地・分類", "h": "château", "i": "/ʃæˈtoʊ/", "p": "名詞", "g": "シャトー、生産者名", "s": 0, "r": "domaine（ドメーヌ）／estate（エステート・自家所有畑）", "n": "ボルドーを中心に用いられるワイン生産者の呼称。一般にブドウ畑と醸造施設を備えた生産者を指すが、必ずしも城館そのものを意味しない。"}, {"no": 669, "f": "産地・分類", "h": "classed growth", "i": "/ˌklɑːst ˈɡrəʊθ/", "p": "名詞句", "g": "格付けシャトー（クリュ・クラッセ）", "s": 0, "r": "cru classé（クリュ・クラッセ、仏語）／first growth（第一級格付け）／grand cru classé（グラン・クリュ・クラッセ）／cru bourgeois（クリュ・ブルジョワ）", "n": "cru classéの英語表現。格付けされたシャトーを指す。"}, {"no": 670, "f": "産地・分類", "h": "climat", "i": "/kliˈmɑː/", "p": "名詞", "g": "クリマ（ブルゴーニュの区画）", "s": 0, "r": "lieu-dit（リュー・ディ・小区画名）／cru（クリュ）／clos（クロ・囲い畑）", "n": "ブルゴーニュで、歴史的に区画された個別の畑とそのテロワールを指す語。"}, {"no": 671, "f": "産地・分類", "h": "cru", "i": "/kryː/", "p": "名詞", "g": "クリュ（格付けされた畑・産地）", "s": 0, "r": "grand cru（グラン・クリュ）／premier cru（プルミエ・クリュ）／climat（クリマ）", "n": "フランス語で「成長・産地」を意味し、文脈により格付けされた畑や産地を指す。"}, {"no": 672, "f": "産地・分類", "h": "cru bourgeois", "i": "/kʁy buʁˈʒwa/", "p": "名詞句", "g": "クリュ・ブルジョワ（メドックの格付け）", "s": 0, "r": "cru classé（クリュ・クラッセ）／classed growth（格付けシャトー）", "n": "ドックの1855年格付けとは別の格付け制度。Cru Bourgeois、Cru Bourgeois Supérieur、Cru Bourgeois Exceptionnelの3階層があり、5年ごとに見直される。"}, {"no": 673, "f": "産地・分類", "h": "first growth", "i": "/ˌfɜːst ˈɡrəʊθ/", "p": "名詞句", "g": "1級シャトー（第一級）", "s": 0, "r": "second growth（2級シャトー）／premier cru classé（プルミエ・クリュ・クラッセ）", "n": "1855年ボルドー格付けにおける最高位。Lafiteなど5シャトーが該当し、現在も名声や価格に大きな影響を持つ。"}, {"no": 674, "f": "産地・分類", "h": "grand cru", "i": "/ɡʁɑ̃ ˈkʁy/", "p": "名詞句", "g": "特級（グラン・クリュ）／特級畑", "s": 0, "r": "premier cru（プルミエ・クリュ）", "n": "フランスの産地格付けで用いられる最上位区分の名称。地域によって制度や意味が異なる。"}, {"no": 675, "f": "産地・分類", "h": "grand cru classé", "i": "/ɡʁɑ̃ kʁy klaˈse/", "p": "名詞句", "g": "グラン・クリュ・クラッセ（特級格付けシャトー）", "s": 0, "r": "cru classé（クリュ・クラッセ）／first growth（第一級格付け）／grand cru（グラン・クリュ）", "n": "公的な格付けに位置付けられたワインまたはシャトーを指す表現。1855年格付けやサンテミリオンの格付けなどで用いられる。"}, {"no": 676, "f": "産地・分類", "h": "IGP", "i": "/ˌaɪ dʒiː ˈpiː/", "p": "名詞", "g": "地理的表示保護（IGP）", "s": 0, "r": "Indication géographique protégée (IGP)（保護地理表示）／AOC（原産地統制呼称）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "フランスの地理的表示保護制度。AOCより広い生産条件が認められ、産地に加えて品種名などを表示できる。"}, {"no": 677, "f": "産地・分類", "h": "Left Bank", "i": "/ˌleft ˈbæŋk/", "p": "名詞句", "g": "左岸（ボルドーのガロンヌ・ジロンド川西側）", "s": 0, "r": "Right Bank（右岸、対概念）", "n": "ガロンヌ川・ジロンド川の左岸地域。メドックやグラーヴを含み、カベルネ・ソーヴィニヨン主体の赤ワインが多い。"}, {"no": 678, "f": "産地・分類", "h": "lieu-dit", "i": "/ljuːˈdiː/", "p": "名詞", "g": "リュー・ディ（小区画名）", "s": 0, "r": "climat（クリマ）／clos（クロ・囲い畑）／single vineyard（単一畑）", "n": "フランスで伝統的に用いられる小区画の地名。必ずしも単一生産者の所有地を意味しない。"}, {"no": 679, "f": "産地・分類", "h": "monopole", "i": "/mɔnɔˈpɔl/", "p": "名詞", "g": "モノポール（単独所有畑）", "s": 0, "r": "single vineyard（単一畑）／climat（クリマ）／grand cru（グラン・クリュ）", "n": "単一の所有者が所有する畑、またはその畑名を冠したワイン。ブルゴーニュのロマネ・コンティなどが代表例。"}, {"no": 680, "f": "産地・分類", "h": "nouveau", "i": "/ˈnuːvəʊ/", "p": "名詞", "g": "ヌーヴォー（新酒）", "s": 0, "r": "carbonic maceration（炭酸ガス浸透法）／vintage（ヴィンテージ・収穫年）", "n": "収穫した年の早い時期に出荷される新酒。ボージョレ・ヌーヴォーは11月第3木曜日に解禁される代表例。"}, {"no": 681, "f": "産地・分類", "h": "premier cru", "i": "/pʁəmje ˈkʁy/", "p": "名詞句", "g": "一級畑（プルミエ・クリュ）", "s": 0, "r": "grand cru（特級畑）／first growth（1級シャトー）", "n": "フランスのワイン格付けで用いられる「一級」の名称。地域によって格付け制度や位置づけが異なる。"}, {"no": 682, "f": "産地・分類", "h": "Right Bank", "i": "/ˌraɪt ˈbæŋk/", "p": "名詞句", "g": "右岸（ボルドーのドルドーニュ・ジロンド川東側）", "s": 0, "r": "Left Bank（左岸、対概念）", "n": "ドルドーニュ川・ジロンド川の右岸地域。サンテミリオンやポムロールを含み、メルロ主体の赤ワインが多い。"}, {"no": 683, "f": "産地・分類", "h": "second growth", "i": "/ˌsekənd ˈɡrəʊθ/", "p": "名詞句", "g": "2級シャトー（第二級）", "s": 0, "r": "first growth（1級シャトー）", "n": "1855年ボルドー格付けの第二級。第一級に次ぐ格付けで、メドック地区などのシャトーが該当する。"}, {"no": 684, "f": "産地・分類", "h": "Sélection de Grains Nobles", "i": "/selɛkˈsjɔ̃ də ɡʁɛ̃ ˈnɔbl/", "p": "名詞句", "g": "セレクション・ド・グラン・ノーブル（アルザスの貴腐甘口）", "s": 0, "r": "Vendange Tardive（ヴァンダンジュ・タルディヴ）／noble rot（貴腐）／botrytis（ボトリティス菌）", "n": "アルザスの特別な甘口ワイン表示。4つの高貴品種のみ使用でき、貴腐化したブドウを用い、甘口に仕上げる。VTより高い最低糖度が求められる。"}, {"no": 685, "f": "産地・分類", "h": "Vendange Tardive", "i": "/vɑ̃dɑ̃ʒ taʁˈdiv/", "p": "名詞句", "g": "ヴァンダンジュ・タルディヴ（アルザスの遅摘み表示）", "s": 0, "r": "Sélection de Grains Nobles（セレクション・ド・グラン・ノーブル）／late harvest（遅摘み）／noble rot（貴腐）", "n": "アルザスの遅摘みワイン表示。4つの高貴品種のみ使用し高い最低糖度を要する。貴腐や甘口である必要はなく辛口仕上げも可能。"}, {"no": 686, "f": "産地・分類", "h": "vieille vigne", "i": "/vjɛj ˈviɲ/", "p": "名詞句", "g": "ヴィエイユ・ヴィーニュ。古樹", "s": 0, "r": "vieilles vignes（複数形）／old vine（古樹）", "n": "古樹を意味する仏語のラベル表記。樹齢に統一された法的基準はなく、一般に低収量や凝縮感のあるワインを連想させる。"}, {"no": 687, "f": "産地・分類", "h": "Classico", "i": "/ˈklassiko/", "p": "名詞", "g": "クラッシコ（呼称内の歴史的中心地区産）", "s": 0, "r": "Superiore（スペリオーレ）／Riserva（リゼルヴァ）／DOCG（保証付原産地統制呼称）", "n": "呼称の歴史的・伝統的な中心地区で造られたことを示す表示。通常の呼称区域とは区別され、産地によってはより厳しい規定が設けられている。"}, {"no": 688, "f": "産地・分類", "h": "Denominazione di Origine Controllata (DOC)", "i": "/ˌdiː oʊ ˈsiː/", "p": "名詞", "g": "統制原産地呼称", "s": 0, "r": "DOCG（保証付原産地統制呼称）／IGT（地域特性表示）", "n": "1963年導入。イタリアの原産地呼称制度で、産地・品種・収量・醸造法などを規定する。EU法ではPDO（原産地呼称保護）に属し、DOCGとともにイタリアの主要なPDOカテゴリーを構成する。"}, {"no": 689, "f": "産地・分類", "h": "Denominazione di Origine Controllata e Garantita (DOCG)", "i": "/ˌdiː əʊ siː ˈdʒiː/", "p": "名詞", "g": "保証付統制原産地呼称", "s": 0, "r": "DOC（統制原産地呼称）／IGT（地域特性表示）", "n": "イタリアの原産地呼称制度で、DOCより厳しい規定を設けたカテゴリー。産地・品種・収量・醸造法などを規定し、政府による官能検査と瓶口の帯封が義務付けられている。"}, {"no": 690, "f": "産地・分類", "h": "Indicazione Geografica Tipica (IGT)", "i": "/ˌaɪ dʒiː ˈtiː/", "p": "名詞", "g": "地域特性表示", "s": 0, "r": "DOC（統制原産地呼称）／DOCG（保証付原産地統制呼称）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "1992年導入のイタリアの地理的表示制度。DOC・DOCGより規定の自由度が高く、産地・品種・収量などについて幅広い選択が可能。"}, {"no": 691, "f": "産地・分類", "h": "passito", "i": "/pasˈsiːto/", "p": "名詞・形容詞", "g": "パッシート（陰干しブドウから造るワイン）", "s": 0, "r": "raisining（レーズン化）／passerillage（パスリヤージュ・樹上乾燥）／sun-drying（天日干し）", "n": "ブドウを収穫後に乾燥・萎凋させ、糖分などを濃縮してから造るワイン。多くは甘口だが、Amaroneのような辛口タイプもある。"}, {"no": 692, "f": "産地・分類", "h": "Riserva", "i": "/riˈzɛrva/", "p": "名詞", "g": "リゼルヴァ（規定の熟成期間を経たワイン）", "s": 0, "r": "Classico（歴史的中心地区）／Superiore（より高い最低アルコール度数を求められる区分）", "n": "通常のワインより長い熟成期間を経たことを示す表示。必要な熟成期間や樽熟成の有無などの規定は、呼称ごとに異なる。"}, {"no": 693, "f": "産地・分類", "h": "Superiore", "i": "/suˌpeˈrjoːre/", "p": "名詞", "g": "スペリオーレ（より高い最低アルコール度数を求められる区分）", "s": 0, "r": "Classico（クラッシコ）／Riserva（リゼルヴァ）", "n": "通常のワインより高い最低アルコール度数を求める表示。典型的には最低アルコール度数が0.5％vol高く、具体的な規定は呼称ごとに異なる。"}, {"no": 694, "f": "産地・分類", "h": "Crianza", "i": "/kriˈanθa/", "p": "名詞", "g": "クリアンサ（一定期間熟成の表示）", "s": 0, "r": "Reserva（レゼルバ）／Gran Reserva（グラン・レゼルバ）", "n": "一定期間の熟成を経たことを示す表示。赤は最低24か月熟成（うち樽6か月）など、色や呼称に応じた熟成規定がある。"}, {"no": 695, "f": "産地・分類", "h": "Denominació d'Origen Qualificada (DOQ)", "i": "/dənumiˌnəsiˈo duˈɾiʒən kwəlifiˈkaðə/", "p": "名詞句", "g": "特選原産地呼称（DOQ）", "s": 0, "r": "Denominación de Origen Calificada (DOCa)（特選原産地呼称）／Denominación de Origen (DO)（原産地呼称）", "n": "スペインのDOCaに相当するカタルーニャ語の呼称。DOより上位のカテゴリーで、プリオラートがDOQを名乗る代表例である。"}, {"no": 696, "f": "産地・分類", "h": "Denominación de Origen (DO)", "i": "/denomiˌnaθjon de oˈɾixen/", "p": "名詞句", "g": "原産地呼称", "s": 0, "r": "Denominación de Origen Calificada (DOCa)（特選原産地呼称）／Vino de la Tierra (VT)（地ワイン）／PDO (Protected Designation of Origin)（原産地呼称保護）", "n": "スペインの原産地呼称で、EUのPDOに相当。品種・収量・醸造・熟成等を各DOの規則で定め、Consejo Reguladorが管理・監督する。"}, {"no": 697, "f": "産地・分類", "h": "Denominación de Origen Calificada (DOCa)", "i": "/denomiˌnaθjon de oˈɾixen kalifiˈkaða/", "p": "名詞句", "g": "特選原産地呼称（DOの上位格）", "s": 0, "r": "Denominación de Origen (DO)（原産地呼称）／Denominació d'Origen Qualificada (DOQ)（DOCaのカタルーニャ語表記）", "n": "DOの上位格で、現在はリオハとプリオラートのみ。DO認定後10年以上、域内瓶詰め等が要件。カタルーニャ語ではDOQ。"}, {"no": 698, "f": "産地・分類", "h": "Gran Reserva", "i": "/ˌɡɾan reˈseɾβa/", "p": "名詞句", "g": "グラン・レゼルバ（長期熟成規格）", "s": 0, "r": "Reserva（レゼルバ）／Crianza（クリアンサ）", "n": "スペインの長期熟成規格。赤は最低60か月熟成（うち樽18か月）など、色別に規定がある。"}, {"no": 699, "f": "産地・分類", "h": "Reserva", "i": "/reˈseɾβa/", "p": "名詞", "g": "レゼルバ（長期熟成規格）", "s": 0, "r": "Crianza（クリアンサ）／Gran Reserva（グラン・レゼルバ）／Riserva（リゼルヴァ）", "n": "スペインの長期熟成規格。赤は最低36か月熟成（うち樽12か月）など、色別に規定がある。"}, {"no": 700, "f": "産地・分類", "h": "Vino de la Tierra (VT)", "i": "/ˌbino de la ˈtjera/", "p": "名詞句", "g": "地ワイン（VT、スペインのPGI）", "s": 0, "r": "Denominación de Origen (DO)（原産地呼称）／Vinho Regional (VR)（地方ワイン）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "EUのPGIに当たるスペインの地理的表示。DOより規制が緩く、品種や醸造方法の自由度が高い。"}, {"no": 701, "f": "産地・分類", "h": "beneficio", "i": "/ˌbɛnɪˈfiːsju/", "p": "名詞", "g": "ベネフィシオ（ポート生産量の割当免許制度）", "s": 0, "r": "Port（ポート）／yield（収量）", "n": "年ごとにポート用ブドウから造れる量を割り当てる制度。畑をA〜Iに格付けし、供給と価格の安定を図る。"}, {"no": 702, "f": "産地・分類", "h": "Denominação de Origem Controlada (DOC)", "i": "/dɨnumiˈnɐsɐ̃w dɨ ɔˈɾiʒɐ̃j kõtɾuˈlaðɐ/", "p": "名詞句", "g": "原産地統制呼称（ポルトガルのPDO）", "s": 0, "r": "Vinho Regional (VR)（地方ワイン）／PDO (Protected Designation of Origin)（原産地呼称保護）", "n": "ポルトガルのPDOに当たる原産地呼称。生産地域・品種・収量等が規定され、公的な分析・官能検査を受ける。"}, {"no": 703, "f": "産地・分類", "h": "single quinta", "i": "/ˌsɪŋɡl ˈkĩtɐ/", "p": "名詞句", "g": "単一キンタ（単一農園由来）", "s": 0, "r": "Vintage Port（ヴィンテージ・ポート）／single vineyard（単一畑）／estate（エステート・自社畑）", "n": "単一のキンタ（農園）で造られたワインを示す表現。特にドウロのポートや高品質ワインで用いられる。"}, {"no": 704, "f": "産地・分類", "h": "Vinho Regional (VR)", "i": "/ˈviɲu ʁɨʒiuˈnal/", "p": "名詞句", "g": "地方ワイン（ポルトガルのPGI）", "s": 0, "r": "Denominação de Origem Controlada (DOC)（原産地統制呼称）／Vino de la Tierra (VT)（地ワイン）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "EUのPGIに当たるポルトガルの区分。DOCより規制が緩く、国際品種を含む幅広い品種が認められる。"}, {"no": 705, "f": "産地・分類", "h": "Auslese", "i": "/ˈaʊsleːzə/", "p": "名詞", "g": "アウスレーゼ（「選り摘み」、熟した房を選別）", "s": 0, "r": "Spätlese（シュペートレーゼ）／Beerenauslese (BA)（ベーレンアウスレーゼ）／Prädikatswein（プレディカーツヴァイン）", "n": "「選り抜き」の意。よく熟した房を選別して造るPrädikatsweinの一段階。辛口から甘口まであり、貴腐の影響を受けることもある。"}, {"no": 706, "f": "産地・分類", "h": "Beerenauslese (BA)", "i": "/ˈbeːʁənˌaʊsleːzə/", "p": "名詞句", "g": "ベーレンアウスレーゼ（BA、粒選りの甘口）", "s": 0, "r": "Auslese（アウスレーゼ）／Trockenbeerenauslese (TBA)（トロッケンベーレンアウスレーゼ）／noble rot（貴腐）", "n": "略称BA。過熟したブドウの粒を一粒ずつ選んで造る甘口ワイン。貴腐ブドウが使われることが多く、生産量は少ない。"}, {"no": 707, "f": "産地・分類", "h": "Deutscher Wein", "i": "/ˈdɔɪtʃɐ ˈvaɪn/", "p": "名詞句", "g": "ドイチャー・ヴァイン（地理的表示なしの基本級）", "s": 0, "r": "Landwein（ラントヴァイン）／Qualitätswein（クヴァリテーツヴァイン）", "n": "地理的表示を持たない最も基本的な区分。旧称Tafelwein。ドイツ産ブドウを使用する。"}, {"no": 708, "f": "産地・分類", "h": "Einzellage", "i": "/ˈaɪntsəlˌlaːɡə/", "p": "名詞", "g": "アインツェルラーゲ（単一畑）", "s": 0, "r": "Grosslage（グロースラーゲ）／single vineyard（単一畑）／Grosse Lage（グローセ・ラーゲ）", "n": "登録された単一畑を指す。規模は1ha未満から200ha超まで様々で、品質も一様ではない。"}, {"no": 709, "f": "産地・分類", "h": "Eiswein", "i": "/ˈaɪsvaɪn/", "p": "名詞", "g": "アイスヴァイン（凍結果から造る甘口）", "s": 0, "r": "Icewine（アイスワイン）／Trockenbeerenauslese (TBA)（トロッケンベーレンアウスレーゼ）／Prädikatswein（プレディカーツヴァイン）", "n": "−7℃以下で自然凍結したブドウを凍ったまま圧搾して造る甘口。人工凍結は不可。希少なPrädikatswein。"}, {"no": 710, "f": "産地・分類", "h": "Erste Lage", "i": "/ˈeːɐstə ˈlaːɡə/", "p": "名詞句", "g": "エアステ・ラーゲ（一級畑）", "s": 0, "r": "Grosse Lage（グローセ・ラーゲ）／premier cru（プルミエ・クリュ）／VDP（ドイツ高品質生産者連盟）", "n": "VDPなどで用いられる一級畑の区分。収量や品種、栽培・醸造等に一定の基準が設けられている。"}, {"no": 711, "f": "産地・分類", "h": "Grosse Lage", "i": "/ˈɡʁoːsə ˈlaːɡə/", "p": "名詞句", "g": "グローセ・ラーゲ（VDPの最上級畑）", "s": 0, "r": "Erste Lage（エアステ・ラーゲ）／Grosses Gewächs (GG)（グローセス・ゲヴェクス）／grand cru（グラン・クリュ）", "n": "VDPの畑格付けにおける最上
