位。優れた単一畑を指す。集合畑を意味するGrosslageとは別物。"}, {"no": 712, "f": "産地・分類", "h": "Grosses Gewächs (GG)", "i": "/ˈɡʁoːsəs ɡəˈvɛks/", "p": "名詞句", "g": "グローセス・ゲヴェクス（GG、特級畑の辛口）", "s": 0, "r": "Grosse Lage（グローセ・ラーゲ）／trocken（トロッケン）／VDP（ドイツ高品質生産者連盟）", "n": "VDPの最上級畑Grosse Lageで造る辛口ワイン。VDPが定める「GG」の商標を表示する。"}, {"no": 713, "f": "産地・分類", "h": "Grosslage", "i": "/ˈɡʁoːsˌlaːɡə/", "p": "名詞", "g": "グロースラーゲ（複数畑をまとめた集合畑）", "s": 0, "r": "Einzellage（アインツェルラーゲ）／Grosse Lage（グローセ・ラーゲ）", "n": "複数のEinzellageをまとめた法定の広域畑区分。VDPのGrosse Lageとは別物。"}, {"no": 714, "f": "産地・分類", "h": "Kabinett", "i": "/kabiˈnɛt/", "p": "名詞", "g": "カビネット（プレディカート最下位）", "s": 0, "r": "Spätlese（シュペートレーゼ）／Auslese（アウスレーゼ）／Prädikatswein（プレディカーツヴァイン）", "n": "Prädikatsweinの6段階で最も低い果汁糖度の区分。軽快で高い酸を持つワインが多く、辛口から甘口まで造られる。"}, {"no": 715, "f": "産地・分類", "h": "Landwein", "i": "/ˈlantvaɪn/", "p": "名詞", "g": "ラントヴァイン（地理的表示付き、EUのPGI相当）", "s": 0, "r": "Deutscher Wein（ドイチャー・ヴァイン）／Qualitätswein（クヴァリテーツヴァイン）／PGI (Protected Geographical Indication)（地理的表示保護）", "n": "EUのPGIに当たる区分。表示地域のブドウを85%以上使用する。多くは辛口または中辛口。"}, {"no": 716, "f": "産地・分類", "h": "Prädikat", "i": "/pʁɛdiˈkaːt/", "p": "名詞", "g": "プレディカート（「称号」、収穫時果汁重量による等級）", "s": 0, "r": "Prädikatswein（プレディカーツヴァイン）／must weight（果汁糖度）／Kabinett（カビネット）", "n": "「称号」の意。収穫時の果汁重量に基づく6等級（Kabinett～TBA）を指す。"}, {"no": 717, "f": "産地・分類", "h": "Prädikatswein", "i": "/pʁɛdiˈkaːtsvaɪn/", "p": "名詞", "g": "プレディカーツヴァイン（収穫時果汁重量による上級カテゴリー）", "s": 0, "r": "Qualitätswein（クヴァリテーツヴァイン）／Prädikat（プレディカート）／Kabinett（カビネット）", "n": "ドイツの高品質ワイン区分。収穫時の果汁重量によりKabinettからTBAまで6段階に分かれ、補糖は禁止される。"}, {"no": 718, "f": "産地・分類", "h": "Qualitätswein", "i": "/kvaliˈtɛːtsvaɪn/", "p": "名詞", "g": "クヴァリテーツヴァイン（指定産地のPDOワイン）", "s": 0, "r": "Prädikatswein（プレディカーツヴァイン）／Landwein（ラントヴァイン）／PDO (Protected Designation of Origin)（原産地呼称保護）", "n": "13の指定産地で造られるPDOワイン。補糖が認められるが、Prädikatsweinには認められない。"}, {"no": 719, "f": "産地・分類", "h": "Spätlese", "i": "/ˈʃpɛːtleːzə/", "p": "名詞", "g": "シュペートレーゼ（遅摘み、完熟果から造る）", "s": 0, "r": "Kabinett（カビネット）／Auslese（アウスレーゼ）／Late Harvest（遅摘み）", "n": "「遅摘み」の意。Kabinettより高い果汁糖度で収穫した完熟果から造るPrädikatswein。豊かな果実味とコクを持ち、甘口だけでなく辛口にも造られる。"}, {"no": 720, "f": "産地・分類", "h": "Trockenbeerenauslese (TBA)", "i": "/ˈtʁɔkənˌbeːʁənˌaʊsleːzə/", "p": "名詞句", "g": "トロッケンベーレンアウスレーゼ（TBA、干し粒選別）", "s": 0, "r": "Beerenauslese (BA)（ベーレンアウスレーゼ）／Eiswein（アイスヴァイン）／noble rot（貴腐）", "n": "略称TBA。貴腐などで干し葡萄状になった粒から造る、極めて甘く凝縮感の高いワイン。生産量が少なく高価になりやすい。"}, {"no": 721, "f": "産地・分類", "h": "Verband Deutscher Prädikatsweingüter (VDP)", "i": "/ˌfaʊ deː ˈpeː/", "p": "名詞", "g": "VDP（ドイツ高品質ワイン生産者協会）", "s": 0, "r": "Grosse Lage（グローセ・ラーゲ）／Erste Lage（エアステ・ラーゲ）／Grosses Gewächs (GG)（グローセス・ゲヴェクス）", "n": "ドイツ高品質生産者の自主団体。独自の4段階の畑格付けと、法規より厳しい基準を設ける。鷲の紋章が目印。"}, {"no": 722, "f": "産地・分類", "h": "Ausbruch", "i": "/ˈaʊsbʁʊx/", "p": "名詞", "g": "アウスブルッフ（ルスト産の貴腐甘口）", "s": 0, "r": "Aszú（アスー）／Beerenauslese (BA)（ベーレンアウスレーゼ）／noble rot（貴腐）", "n": "ルスト産の伝統的な甘口ワイン。貴腐果などを用い、2020年にRuster Ausbruch DACが創設された。"}, {"no": 723, "f": "産地・分類", "h": "DAC (Districtus Austriae Controllatus)", "i": "/ˌdiː eɪ ˈsiː/", "p": "名詞句", "g": "DAC（オーストリアの原産地呼称）", "s": 0, "r": "AOC（原産地統制呼称）／PDO (Protected Designation of Origin)（原産地呼称保護）", "n": "地域の典型性を重視するオーストリアの原産地制度。各DACで認められる品種・スタイルなどが定められている。"}, {"no": 724, "f": "産地・分類", "h": "Federspiel", "i": "/ˈfeːdɐʃpiːl/", "p": "名詞", "g": "フェーダーシュピール（ヴァッハウの中位辛口）", "s": 0, "r": "Steinfeder（シュタインフェーダー）／Smaragd（スマラクト）", "n": "ヴィネア・ヴァッハウの辛口3区分の中位。SteinfederとSmaragdの中間に位置し、適度なボディを持つ。"}, {"no": 725, "f": "産地・分類", "h": "Smaragd", "i": "/smaˈʁakt/", "p": "名詞", "g": "スマラクト（ヴァッハウの最上位辛口）", "s": 0, "r": "Federspiel（フェーダーシュピール）／Steinfeder（シュタインフェーダー）", "n": "ヴィネア・ヴァッハウ3区分の最上位。最も凝縮感があり、長期熟成に向く辛口ワイン。"}, {"no": 726, "f": "産地・分類", "h": "Steinfeder", "i": "/ˈʃtaɪnˌfeːdɐ/", "p": "名詞", "g": "シュタインフェーダー（ヴァッハウの最軽量辛口）", "s": 0, "r": "Federspiel（フェーダーシュピール）／Smaragd（スマラクト）", "n": "ヴィネア・ヴァッハウ3区分の最も軽い辛口。軽快で果実味があり、早飲みに適するスタイル。"}, {"no": 727, "f": "産地・分類", "h": "Retsina", "i": "/retˈsiːnə/", "p": "名詞", "g": "レツィーナ（松脂で香味付けした伝統ワイン）", "s": 0, "r": "pine resin（松脂）／Greece（ギリシャ）／PDO（原産地呼称保護）", "n": "ギリシャの伝統的なワイン。発酵中のワインに松脂を加えて独特の樹脂香を付ける。PDOワインとして特別に保護される。"}, {"no": 728, "f": "産地・分類", "h": "Aszú", "i": "/ˈɒsuː/", "p": "名詞", "g": "アスー（貴腐で干した粒／それで造る甘口）", "s": 0, "r": "puttonyos（プットニョシュ）／Eszencia（エッセンシア）／noble rot（貴腐）", "n": "貴腐によって水分が失われ糖分が凝縮したブドウ、またはそれを用いて造るトカイの甘口ワイン。高い糖度と酸度が特徴。"}, {"no": 729, "f": "産地・分類", "h": "Eszencia", "i": "/ˈɛsɛntsiɒ/", "p": "名詞", "g": "エッセンシア（アスー粒の自然流出果汁から造る極甘口）", "s": 0, "r": "Aszú（アスー）／puttonyos（プットニョシュ）", "n": "アスー粒の自重で自然に流れ出る果汁から造る極甘口ワイン。非常に高い残糖と低いアルコール度数が特徴。"}, {"no": 730, "f": "産地・分類", "h": "puttonyos", "i": "/ˈpʊttoɲoʃ/", "p": "名詞", "g": "プットニョシュ（トカイ・アスーの甘さを示す伝統的な尺度）", "s": 0, "r": "Aszú（アスー）／residual sugar（残糖）", "n": "アスー粒の使用量を基にした、トカイ・アスーの伝統的な甘さの尺度。現在のTokaji Aszúは残糖量を基準に規定される。"}, {"no": 731, "f": "産地・分類", "h": "AVA (American Viticultural Area)", "i": "/ˌeɪ viː ˈeɪ/", "p": "名詞", "g": "AVA（米国政府認定のブドウ栽培地域）", "s": 0, "r": "appellation（原産地呼称）／geographical indication（地理的表示）", "n": "地理的特徴に基づき画定されたブドウ栽培地域。産地表示の基準が定められている。"}, {"no": 732, "f": "産地・分類", "h": "Icewine", "i": "/ˈaɪswaɪn/", "p": "名詞", "g": "アイスワイン（樹上凍結果実の甘口）", "s": 0, "r": "Eiswein（アイスヴァイン）／VQA (Vintners Quality Alliance)（カナダの原産地呼称制度）", "n": "樹上で自然凍結した果実を凍ったまま搾る甘口。カナダでは果実温度−8℃以下での収穫が必要。"}, {"no": 733, "f": "産地・分類", "h": "VQA (Vintners Quality Alliance)", "i": "/ˌviːkjuːˈeɪ/", "p": "名詞句", "g": "VQA（カナダのワイン品質認証制度）", "s": 0, "r": "Icewine（アイスワイン）／AVA (American Viticultural Area)（アメリカ政府認定ブドウ栽培地域）", "n": "オンタリオ州とBC州を中心とするワインの品質認証制度。原産地や品質に関する基準を定めている。"}, {"no": 734, "f": "産地・分類", "h": "WO (Wine of Origin)", "i": "/ˌdʌbəljuːˈoʊ/", "p": "名詞句", "g": "WO（南アフリカの原産地呼称制度）", "s": 0, "r": "GI (Geographical Indication)（地理的表示）／AVA (American Viticultural Area)（アメリカ政府認定ブドウ栽培地域）", "n": "南アフリカの原産地呼称制度。産地・品種・収穫年などの表示に基準を設け、Estateの認定も含む。"}, {"no": 735, "f": "ビジネス", "h": "appellation", "i": "/ˌæpəˈleɪʃən/", "p": "名詞", "g": "原産地呼称（アペラシオン）", "s": 0, "r": "provenance（来歴）／terroir（テロワール）", "n": "地理的範囲や品種・製法などを定めた産地名の制度。産地の真正性を示し、表示を規制する枠組み。"}, {"no": 736, "f": "ビジネス", "h": "bonded warehouse", "i": "/ˈbɒndɪd ˈweəhaʊs/", "p": "名詞句", "g": "保税倉庫（酒税未納で保管できる倉庫）", "s": 0, "r": "bonded winery（保税ワイナリー）／duty（関税・酒税）", "n": "酒税を納めずにワインを保管でき、出庫時に課税される倉庫。輸入業者の資金負担を軽減する。"}, {"no": 737, "f": "ビジネス", "h": "brand", "i": "/brænd/", "p": "名詞", "g": "ブランド", "s": 0, "r": "brand image（ブランドイメージ）／brand equity（ブランド資産価値）／luxury brand（高級ブランド）", "n": "生産者や企業が市場でワインを識別・差別化するための名称やイメージ。"}, {"no": 738, "f": "ビジネス", "h": "broker", "i": "/ˈbrəʊkə/", "p": "名詞", "g": "ブローカー（仲買人）", "s": 0, "r": "courtier（クルティエ）／commission（手数料）", "n": "売買当事者の間に立って取引を仲介する者。在庫を持たず、手数料を受け取る。ボルドーではcourtierと呼ばれる。"}, {"no": 739, "f": "ビジネス", "h": "bulk transport", "i": "/ˌbʌlk ˈtrænspɔːt/", "p": "名詞句", "g": "バルク輸送（ばら積み輸送）", "s": 0, "r": "bulk wine（バルクワイン）／bottling（瓶詰め）", "n": "フレキシタンクやISOタンクでワインを大量輸送する方式。瓶輸送より軽量・低コストで、環境負荷も低い。"}, {"no": 740, "f": "ビジネス", "h": "bulk wine", "i": "/ˈbʌlk waɪn/", "p": "名詞句", "g": "バルクワイン（瓶詰め前の大容量輸送用ワイン）", "s": 0, "r": "bulk transport（バルク輸送）／bottled wine（瓶詰めワイン）", "n": "フレキシタンク等で大量輸送する未瓶詰めワイン。瓶輸送より軽量・低コストで、環境負荷も低い。"}, {"no": 741, "f": "ビジネス", "h": "by the glass", "i": "/ˌbaɪ ðə ˈɡlɑːs/", "p": "名詞句", "g": "グラス売り（BTG）", "s": 0, "r": "wine list（ワインリスト）／on-trade（オントレード・飲食店向け販売）", "n": "ボトルではなくグラス単位で提供・販売する形態。より多様なワインを少量から楽しめる。"}, {"no": 742, "f": "ビジネス", "h": "cellar", "i": "/ˈsɛlər/", "p": "名詞・動詞", "g": "セラー（貯蔵庫）／熟成のため貯蔵する", "s": 0, "r": "cellar door（セラードア）／maturation（熟成）", "n": "ワインの貯蔵・熟成庫。動詞では、ワインを熟成のために貯蔵すること。cellaring は熟成のための保管を指す。"}, {"no": 743, "f": "ビジネス", "h": "cellar door", "i": "/ˈselə dɔː/", "p": "名詞句", "g": "セラードア（ワイナリー併設の直売所）", "s": 0, "r": "wine tourism（ワインツーリズム）／wine club（ワインクラブ）", "n": "生産地でワインを直売する施設。試飲や交流を通じて、ブランド認知と顧客ロイヤルティを高める。"}, {"no": 744, "f": "ビジネス", "h": "co-operative", "i": "/kəʊˈɒpərətɪv/", "p": "名詞", "g": "協同組合（生産者が共同所有する組織）", "s": 0, "r": "grower（栽培農家）／co-operative winery（協同組合ワイナリー）", "n": "栽培者が出資し、共同で醸造・販売する組織。資金を集めて設備を共有できる。"}, {"no": 745, "f": "ビジネス", "h": "contract bottling", "i": "/ˈkɒntrækt ˈbɒtlɪŋ/", "p": "名詞句", "g": "委託瓶詰め", "s": 0, "r": "private label（プライベートブランド）／custom crush facility（受託醸造施設）／bulk wine（バルクワイン）", "n": "他社のために瓶詰め工程を請け負うこと。"}, {"no": 746, "f": "ビジネス", "h": "contract grower", "i": "/ˈkɒntrækt ˈɡroʊə/", "p": "名詞句", "g": "契約栽培者（独立したブドウ供給者）", "s": 0, "r": "grower（栽培農家）／winery（ワイナリー）", "n": "ワイナリーと契約してブドウを供給する独立栽培者。買いブドウを主体とするワイナリーを支える。"}, {"no": 747, "f": "ビジネス", "h": "corkage", "i": "/ˈkɔːkɪdʒ/", "p": "名詞", "g": "コーケージ（ワイン持込料）", "s": 0, "r": "BYO（Bring Your Own・持ち込み）／on-trade（オントレード）", "n": "客が持ち込んだワインを店で開けてもらう際の手数料。BYO（ワイン持ち込み）の際に課される。"}, {"no": 748, "f": "ビジネス", "h": "corkscrew", "i": "/ˈkɔːrkskruː/", "p": "名詞", "g": "コルクスクリュー（栓抜き）", "s": 0, "r": "wine key（ソムリエナイフ）／cork（コルク）", "n": "コルクを抜くための道具の総称。ソムリエナイフ型やウイング型など多様な形式がある。"}, {"no": 749, "f": "ビジネス", "h": "courtier", "i": "/kuʁˈtje/", "p": "名詞", "g": "クルティエ（生産者とネゴシアンを仲介するブローカー）", "s": 0, "r": "broker（ブローカー）／négociant（ネゴシアン）", "n": "生産者とネゴシアンの間を仲介する仲買人。取引条件や品質情報を橋渡しし、手数料を受け取る。"}, {"no": 750, "f": "ビジネス", "h": "cult wine", "i": "/ˈkʌlt ˌwaɪn/", "p": "名詞句", "g": "カルトワイン", "s": 0, "r": "scarcity（希少性）／collector（収集家）", "n": "ごく少量生産で収集家の需要が高く、高額で取引されるワイン。カリフォルニアのScreaming Eagleなどが代表例。"}, {"no": 751, "f": "ビジネス", "h": "custom crush facility", "i": "/ˈkʌstəm krʌʃ fəˈsɪləti/", "p": "名詞句", "g": "受託醸造施設（有料で醸造を請け負う施設）", "s": 0, "r": "grower（栽培農家）／contract winemaking（受託醸造）", "n": "北米に多い、栽培者などが料金を払い醸造を委託する施設。設備投資を抑え、栽培や販売に専念できる。"}, {"no": 752, "f": "ビジネス", "h": "cuvée", "i": "/kuːˈveɪ/", "p": "名詞", "g": "キュヴェ", "s": 0, "r": "prestige cuvée（プレステージ・キュヴェ）／blending（ブレンド）", "n": "特定の配合や区画から造られたワイン、またはその仕込み単位・製品名。ブレンドや商品の識別に用いる。"}, {"no": 753, "f": "ビジネス", "h": "direct sales", "i": "/dəˈrekt seɪlz/", "p": "名詞句", "g": "直接販売", "s": 0, "r": "direct-to-consumer（消費者直販・DTC）／cellar door（セラードア販売）／wine club（ワインクラブ）", "n": "生産者などが中間流通を介さず顧客へ直接販売すること。"}, {"no": 754, "f": "ビジネス", "h": "direct-to-consumer", "i": "/dəˈrekt tə kənˈsuːmər/", "p": "形容詞句", "g": "消費者直販（DTC）", "s": 0, "r": "cellar door（セラードア販売）／wine club（ワインクラブ）／direct sales（直接販売）", "n": "卸売業者などを介さず、生産者が消費者へ直接販売するビジネスモデル。"}, const FIELDS=["栽培","環境","病害虫","成分・化学","醸造","スパークリングワイン","酒精強化ワイン","テイスティング","産地・分類","ビジネス"];
let mode="card", filt="all", idx=0, flipped=false, order=null, shuffleOn=false;
let mem={};
try{mem=JSON.parse(localStorage.getItem("wine800")||"{}")}catch(e){mem={}}
function save(){try{localStorage.setItem("wine800",JSON.stringify(mem))}catch(e){}}
function pool(){
 let p=W.map((w,i)=>i);
 if(filt==="star")p=p.filter(i=>W[i].s);
 else if(filt!=="all")p=p.filter(i=>W[i].f===filt);
 if(order&&shuffleOn){p=order.filter(i=>p.includes(i))}
 return p;
}
function mkShuffle(){order=W.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
function chips(){
 const el=document.getElementById("filters");
 let h=`<button class="chip ${filt==="all"?"on":""}" data-f="all">すべて (${W.length})</button>`;
 if(W.filter(w=>w.s).length) h+=`<button class="chip star ${filt==="star"?"on":""}" data-f="star">★連載の語 (${W.filter(w=>w.s).length})</button>`;
 for(const f of FIELDS){const n=W.filter(w=>w.f===f).length;if(n)h+=`<button class="chip ${filt===f?"on":""}" data-f="${f}">${f} (${n})</button>`}
 el.innerHTML=h;
 el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filt=c.dataset.f;idx=0;flipped=false;render()});
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderCard(){
 const p=pool(); const m=document.getElementById("main");
 if(!p.length){m.innerHTML='<div class="done"><p>この条件の単語はありません。</p></div>';return}
 if(idx>=p.length){
  const learned=p.filter(i=>mem[i]).length;
  m.innerHTML=`<div class="done"><div class="big">🍷</div><p><b>1周おつかれさまでした</b><br>${p.length}語中 ${learned}語を「覚えた」にしました。</p><div class="btns"><button class="btn ok" id="again">もう1周</button><button class="btn ng" id="miss">未習得だけ復習</button></div></div>`;
  document.getElementById("again").onclick=()=>{idx=0;flipped=false;render()};
  document.getElementById("miss").onclick=()=>{
   const ms=p.filter(i=>!mem[i]);
   if(!ms.length){alert("未習得の語はありません。すばらしい！");return}
   order=ms; shuffleOn=true; idx=0; flipped=false; render();
  };
  return;
 }
 const w=W[p[idx]]; const learned=p.filter(i=>mem[i]).length;
 let inner;
 if(!flipped){
  inner=`<div class="hw">${esc(w.h)}</div><div class="ipa">${esc(w.i)}</div><span class="pos">${esc(w.p)}</span><div class="hint">タップで意味を表示</div>`;
 }else{
  inner=`<div class="gloss">${esc(w.g)}</div><div class="note">▸ ${esc(w.n)}</div>`+(w.r?`<div class="rel"><b>関連</b>${esc(w.r)}</div>`:"");
 }
 m.innerHTML=`
 <div class="progress"><span>${idx+1} / ${p.length}</span><div class="pbar"><i style="width:${(idx)/p.length*100}%"></i></div><span>覚えた ${learned}</span></div>
 <div class="card" id="card"><span class="fld">${esc(w.f)}</span>${w.s?'<span class="star">★</span>':""}${inner}</div>
 <div class="btns"><button class="btn ng" id="later">まだ</button><button class="btn ok" id="know">覚えた</button></div>
 <div class="cardfoot"><button class="btn sm" id="shuf">${shuffleOn?"✓ シャッフル中":"シャッフル"}</button><button class="btn sm" id="reset">記録をリセット</button></div>`;
 document.getElementById("card").onclick=()=>{flipped=!flipped;renderCard()};
 document.getElementById("know").onclick=()=>{mem[p[idx]]=1;save();idx++;flipped=false;renderCard()};
 document.getElementById("later").onclick=()=>{delete mem[p[idx]];save();idx++;flipped=false;renderCard()};
 document.getElementById("shuf").onclick=()=>{shuffleOn=!shuffleOn;if(shuffleOn)mkShuffle();else order=null;idx=0;flipped=false;renderCard()};
 document.getElementById("reset").onclick=()=>{if(confirm("「覚えた」の記録をすべて消しますか？")){mem={};save();renderCard()}};
}
let sheet=true;
function renderList(){
 const p=pool(); const m=document.getElementById("main");
 let h=`<div class="sheetbar"><button class="switch ${sheet?"on":""}" id="sw"><i></i></button>赤シートモード（語義を隠す・タップで表示）</div>`;
 for(const i of p){
  const w=W[i];
  h+=`<div class="lrow"><div class="lr1"><span class="no">${String(i+1).padStart(3,"0")}</span><span class="h">${esc(w.h)}</span>${w.s?'<span class="st">★</span>':""}<span class="ip">${esc(w.i)}</span><span class="po">${esc(w.p)}</span></div>
  <div class="lg ${sheet?"hide":""}" data-g>${esc(w.g)}</div>
  <div class="ln">▸ ${esc(w.n)}</div>`+(w.r?`<div class="lrl">関連： ${esc(w.r)}</div>`:"")+`</div>`;
 }
 m.innerHTML=h;
 document.getElementById("sw").onclick=()=>{sheet=!sheet;renderList()};
 m.querySelectorAll("[data-g]").forEach(g=>g.onclick=()=>g.classList.remove("hide"));
}
function render(){
 document.getElementById("tabCard").classList.toggle("on",mode==="card");
 document.getElementById("tabList").classList.toggle("on",mode==="list");
 chips();
 if(mode==="card")renderCard();else renderList();
}
document.getElementById("tabCard").onclick=()=>{mode="card";render()};
document.getElementById("tabList").onclick=()=>{mode="list";render()};
render();
</script></body></html>
