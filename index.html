<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワイン英語の基本800語 Web単語帳</title>
<style>
:root{--wine:#6B2737;--rose:#A8536A;--pink:#D8B4BF;--cream:#faf6ef;--red:#d61c2c;--ink:#2a2224}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
header{background:var(--wine);color:#fff;padding:12px 16px calc(10px + env(safe-area-inset-top,0)) 16px;position:sticky;top:0;z-index:10}
h1{font-size:16px;font-weight:800;letter-spacing:.04em}
h1 small{font-weight:400;font-size:11px;color:var(--pink);margin-left:8px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:rgba(255,255,255,.12);color:#f3dfe4;font-size:12.5px;font-weight:600;cursor:pointer;border:none}
.tab.on{background:#fff;color:var(--wine)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:999px;border:1px solid var(--pink);background:#fff;color:var(--wine);font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip.star{color:#b8860b;border-color:#e3c76f}.chip.star.on{background:#b8860b;border-color:#b8860b;color:#fff}
main{padding:0 16px 40px;max-width:560px;margin:0 auto}
/* card mode */
.progress{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8a6b73;margin:4px 2px 10px}
.pbar{flex:1;height:5px;background:#eddfe3;border-radius:3px;margin:0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rose);border-radius:3px;transition:width .25s}
.card{background:#fff;border:1px solid var(--pink);border-radius:16px;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 20px;cursor:pointer;box-shadow:0 3px 14px rgba(107,39,55,.08);position:relative}
.card .fld{position:absolute;top:12px;left:14px;font-size:10.5px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 9px}
.card .star{position:absolute;top:10px;right:14px;color:#c9a227;font-size:16px}
.hw{font-family:Georgia,serif;font-weight:700;font-size:30px;color:#171114;line-height:1.2;overflow-wrap:anywhere}
.ipa{font-size:14px;color:var(--wine);margin-top:8px}
.pos{display:inline-block;margin-top:10px;font-size:11px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 10px}
.hint{position:absolute;bottom:12px;font-size:11px;color:#c9aeb6}
.gloss{font-size:21px;font-weight:800;color:var(--red);line-height:1.4}
.note{font-size:13px;color:#5c5254;line-height:1.75;margin-top:14px;text-align:left}
.rel{font-size:12px;color:var(--rose);line-height:1.7;margin-top:12px;text-align:left;border-top:1px dotted var(--pink);padding-top:10px}
.rel b{font-size:10px;border:1px solid var(--rose);border-radius:4px;padding:0 4px;margin-right:6px;font-weight:600}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px 0;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer}
.btn.ok{background:var(--wine);color:#fff}
.btn.ng{background:#fff;color:var(--wine);border:1.5px solid var(--pink)}
.btn.sm{flex:none;padding:10px 14px;font-size:12px;background:#fff;border:1px solid var(--pink);color:var(--wine)}
.cardfoot{display:flex;gap:8px;margin-top:10px;justify-content:center}
.done{background:#fff;border:1px solid var(--pink);border-radius:16px;padding:36px 20px;text-align:center}
.done .big{font-size:34px}
.done p{margin-top:10px;font-size:14px;color:#5c5254;line-height:1.8}
/* list mode */
.lrow{background:#fff;border:1px solid #ecd9de;border-radius:12px;padding:12px 14px;margin-bottom:9px}
.lr1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lr1 .no{font-size:10px;color:#b5959e}
.lr1 .h{font-family:Georgia,serif;font-weight:700;font-size:17px}
.lr1 .st{color:#c9a227;font-size:12px}
.lr1 .ip{font-size:11px;color:var(--wine)}
.lr1 .po{font-size:9.5px;color:#fff;background:var(--rose);border-radius:999px;padding:1px 7px}
.lg{font-size:14px;font-weight:700;color:var(--red);margin-top:5px}
.lg.hide{color:transparent;background:#f6c8ce;border-radius:5px;cursor:pointer;user-select:none}
.ln{font-size:11.5px;color:#6d6265;line-height:1.65;margin-top:5px}
.lrl{font-size:11px;color:var(--rose);margin-top:4px}
.sheetbar{display:flex;align-items:center;gap:10px;margin:2px 2px 12px;font-size:12.5px;color:#6d5257}
.switch{width:42px;height:24px;border-radius:12px;background:#e5d2d7;position:relative;cursor:pointer;transition:.2s;border:none}
.switch.on{background:var(--red)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:21px}
footer{max-width:560px;margin:0 auto;padding:0 16px 30px;font-size:10.5px;color:#b5959e;text-align:center;line-height:1.7}
</style></head><body>
<header>
<h1>ワイン英語の基本800語 <small>Web単語帳</small></h1>
<div class="tabs">
<button class="tab on" id="tabCard">カード学習</button>
<button class="tab" id="tabList">一覧（赤シート）</button>
</div>
</header>
<div class="filters" id="filters"></div>
<main id="main"></main>
<footer>ワイン英語 資格試験からテイスティング・実務まで｜Vinolaw<br>チェック状況はこの端末のブラウザに保存されます</footer>
<script>
const W=[{"no": 1, "f": "栽培", "h": "aspect", "i": "/ˈæspɛkt/", "p": "名詞", "g": "斜面の向き・傾斜", "s": 0, "r": "mid-slope（斜面中腹）／sunlight interception（受光）", "n": "畑が向く方位と傾きの度合い。日照量や排水、気温に影響し成熟に有利な立地条件を左右する。"}, {"no": 2, "f": "栽培", "h": "berry", "i": "/ˈbɛri/", "p": "名詞", "g": "果粒（ブドウの一粒）", "s": 0, "r": "bunch（果房）／skin（果皮）", "n": "果皮・果肉・種子からなるブドウの一粒。果粒の大きさは風味の凝縮度に影響する。"}, {"no": 3, "f": "栽培", "h": "biodynamic viticulture", "i": "/ˌbaɪoʊdaɪˈnæmɪk ˈvɪtɪkʌltʃər/", "p": "名詞句", "g": "ビオディナミ（生物力学農法）", "s": 0, "r": "organic viticulture（有機栽培）／Demeter（デメター認証）", "n": "有機栽培に天体の暦や独自の調合剤を加える栽培哲学。畑を一つの有機体と捉える総合的な農法。"}, {"no": 4, "f": "栽培", "h": "budburst", "i": "/ˈbʌdbɜːrst/", "p": "名詞", "g": "萌芽（発芽）", "s": 0, "r": "flowering（開花）／spring frost（春霜）／dormancy（休眠）／budbreak（同義・米で多用）", "n": "冬芽が開いて新梢が伸び始める春先の段階。遅霜の被害を受けやすく生育開始の合図となる。"}, {"no": 5, "f": "栽培", "h": "canopy", "i": "/ˈkænəpi/", "p": "名詞", "g": "キャノピー（樹冠）", "s": 0, "r": "canopy management（キャノピー・マネジメント）／leaf removal（除葉）／fruit zone（結果域）", "n": "枝葉・果実などブドウ樹の地上部全体を指す。日照や風通しを左右し、果実の成熟度に大きく影響する。"}, {"no": 6, "f": "栽培", "h": "canopy management", "i": "/ˈkænəpi ˈmænɪdʒmənt/", "p": "名詞句", "g": "キャノピー・マネジメント", "s": 0, "r": "canopy（樹冠）／leaf removal（除葉）／shoot positioning（新梢の整枝）", "n": "枝葉の配置や量を調整し、受光と風通しを最適化する栽培技術。品質と収量の両立を目指す作業全般。"}, {"no": 7, "f": "栽培", "h": "clonal selection", "i": "/ˌkləʊnəl sɪˈlɛkʃən/", "p": "名詞句", "g": "クローン選抜", "s": 0, "r": "Mass Selection（マサル・セレクション）／clone（クローン）", "n": "優良な単一樹から増殖して特性の揃った苗を得る選抜法。収量や耐病性、香味などの形質を固定できる。"}, {"no": 8, "f": "栽培", "h": "clone", "i": "/kloʊn/", "p": "名詞", "g": "クローン（分枝系）", "s": 0, "r": "Mass Selection（マサル・セレクション）／clonal selection（クローン選抜）", "n": "同一品種内で、突然変異などによって生じた独特の特徴を持つブドウ樹を、栄養繁殖によって増殖した遺伝的にほぼ同一の系統。"}, {"no": 9, "f": "栽培", "h": "coulure", "i": "/kuːˈlʊər/", "p": "名詞", "g": "クリュール（花振るい）", "s": 0, "r": "millerandage（ミルランダージュ）／fruit set（結実）", "n": "開花期の不順で受精がうまくいかず果粒が落ちる現象。着果率が下がり収量減の原因となる。"}, {"no": 10, "f": "栽培", "h": "cover crop", "i": "/ˈkʌvər krɒp/", "p": "名詞句", "g": "下草", "s": 0, "r": "soil fertility（土壌肥沃度）／biodiversity（生物多様性）", "n": "畝間に植える草。土壌浸食を防ぎ有機物や生物多様性を増やし、樹勢調整にも役立つ栽培手法。"}, {"no": 11, "f": "栽培", "h": "crop thinning", "i": "/krɒp ˈθɪnɪŋ/", "p": "名詞句", "g": "摘房（房の間引き）", "s": 0, "r": "green harvest（グリーンハーベスト）／yield（収量）", "n": "果房数を減らして一房あたりの質を高める作業。収量と品質のバランス調整に用いられる。"}, {"no": 12, "f": "栽培", "h": "crossing", "i": "/ˈkrɒsɪŋ/", "p": "名詞", "g": "交配種（同一種内の交配品種）", "s": 0, "r": "hybrid（交雑種・異種間交配）／clone（クローン）／clonal selection（クローン選抜）", "n": "同じ種（主にヴィニフェラ）どうしの交配で生まれた品種。異種間のhybrid（交雑種）と区別される育種用語。"}, {"no": 13, "f": "栽培", "h": "de-budding", "i": "/ˌdiːˈbʌdɪŋ/", "p": "名詞", "g": "芽かき（開花前に芽を除き収量を抑える作業）", "s": 0, "r": "green harvest（グリーンハーベスト）／crop thinning（摘房）", "n": "開花前に余分な芽を摘み収量と樹勢の均衡をとる作業。時期が早いため後の霜・雹・病害で収量が大きく減る危険も伴う。"}, {"no": 14, "f": "栽培", "h": "deficit", "i": "/ˈwɔːtər ˈdefɪsɪt/", "p": "名詞句", "g": "不足・欠乏", "s": 0, "r": "water stress（水分ストレス）／drought stress（干ばつストレス）／drip irrigation（点滴灌漑）", "n": "必要量に対して何かが不足している状態。"}, {"no": 15, "f": "栽培", "h": "dormancy", "i": "/ˈdɔːrmənsi/", "p": "名詞", "g": "休眠", "s": 0, "r": "budburst（萌芽）／pruning（剪定）", "n": "落葉後の冬にブドウ樹が活動を止める期間。低温にさらされ翌春の萌芽に備える生育休止の段階。"}, {"no": 16, "f": "栽培", "h": "drip irrigation", "i": "/drɪp ˌɪrɪˈɡeɪʃən/", "p": "名詞句", "g": "点滴灌漑", "s": 0, "r": "irrigation（灌漑）／flood irrigation（湛水灌漑）／water stress（水分ストレス）", "n": "根域へ少量の水を継続的に供給する灌漑方式。水を効率的に利用しやすい。"}, {"no": 17, "f": "栽培", "h": "drought stress", "i": "/ˈdraʊt ˌstres/", "p": "名詞句", "g": "乾燥ストレス（水分ストレス）", "s": 0, "r": "water stress（水ストレス）／irrigation（灌漑）", "n": "水不足で樹が受ける乾燥ストレス。光合成や成熟が停滞する。水はけの良い浅い土壌や酷暑年に生じ、灌漑で緩和する。"}, {"no": 18, "f": "栽培", "h": "dry-farming", "i": "/ˈdraɪ ˌfɑːmɪŋ/", "p": "名詞", "g": "乾地栽培（灌漑に頼らない栽培）", "s": 0, "r": "irrigation（灌漑）／water stress（水ストレス）", "n": "灌漑せず自然降雨のみで育てる栽培。収量は下がるが根が深く張り凝縮した果実を生む。品質志向の造り手に好まれる。"}, {"no": 19, "f": "栽培", "h": "field blend", "i": "/ˈfiːld ˌblend/", "p": "名詞句", "g": "フィールドブレンド（混植混醸）", "s": 0, "r": "co-fermentation（混醸）／single varietal（単一品種）", "n": "複数品種を同一畑に混植し一緒に収穫・醸造する伝統。"}, {"no": 20, "f": "栽培", "h": "flowering", "i": "/ˈflaʊərɪŋ/", "p": "名詞", "g": "開花", "s": 0, "r": "fruit set（結実）／coulure（花振るい）", "n": "花が咲き受粉・受精が起こる初夏の段階。天候が悪いと結実不良を招き最終収量を左右する。"}, {"no": 21, "f": "栽培", "h": "frost pocket", "i": "/frɒst ˈpɒkɪt/", "p": "名詞句", "g": "霜のたまりやすい場所", "s": 0, "r": "spring frost（春霜）／inversion layer（逆転層）／wind machine（防霜ファン）", "n": "冷気が低地にたまりやすく、霜害を受けやすい地形上の場所。"}, {"no": 22, "f": "栽培", "h": "fruit set", "i": "/fruːt sɛt/", "p": "名詞句", "g": "結実", "s": 0, "r": "flowering（開花）／millerandage（ミルランダージュ）", "n": "受精した花が小さな果実へと変わる過程。この時期の天候不順は着果不良や粒不揃いを招く。"}, {"no": 23, "f": "栽培", "h": "fruit zone", "i": "/ˈfruːt ˌzəʊn/", "p": "名詞句", "g": "結果域（果実がなる部位）", "s": 0, "r": "canopy（樹冠）／leaf removal（除葉）", "n": "果実がなる樹の部位。アルザスでは霜や湿気を避けるため高めに設定し、日照確保のため列間も広く取る。"}, {"no": 24, "f": "栽培", "h": "gobelet", "i": "/ɡɔˈblɛ/", "p": "名詞", "g": "ゴブレ（株仕立て）", "s": 0, "r": "bush vine（株仕立て・ブッシュヴァイン）／head training（株仕立て）／Guyot（ギュイヨ）", "n": "支柱や針金を使わず株状に仕立てる伝統的な樹形。南仏や地中海沿岸の乾燥地の古木に多く見られる。"}, {"no": 25, "f": "栽培", "h": "graft union", "i": "/ˈɡrɑːft ˈjuːnjən/", "p": "名詞句", "g": "接ぎ木部（穂木と台木の接合部）", "s": 0, "r": "grafting（接ぎ木）／rootstock（台木）", "n": "穂木と台木の接合部。植付けの際は土に埋めないようにする。"}, {"no": 26, "f": "栽培", "h": "grafting", "i": "/ˈɡrɑːftɪŋ/", "p": "名詞", "g": "接ぎ木", "s": 0, "r": "rootstock（台木）／head-grafting（高接ぎ）／own-rooted (ungrafted)（自根）", "n": "穂木を台木に接合して一本の樹にする繁殖法。病害抵抗性を持たせつつ望む品種を育てる技術。"}, {"no": 27, "f": "栽培", "h": "green harvest", "i": "/ɡriːn ˈhɑːrvɪst/", "p": "名詞句", "g": "グリーンハーベスト", "s": 0, "r": "vendange verte（仏：グリーンハーベスト）／crop thinning（摘房）／yield（収量）", "n": "未熟な果房を夏に間引いて収量を抑える作業。残した果実へ養分を集中させ凝縮度を高める。"}, {"no": 28, "f": "栽培", "h": "green manure", "i": "/ˌɡriːn məˈnjʊə/", "p": "名詞句", "g": "緑肥", "s": 0, "r": "cover crop（カバークロップ・被覆作物）／organic viticulture（有機栽培）", "n": "畝間で育てた植物を土にすき込み養分と有機物を補う手法。土壌構造と微生物の活性の改善に役立つ。"}, {"no": 29, "f": "栽培", "h": "growing degree days", "i": "/ˈɡroʊɪŋ dɪˈɡriː deɪz/", "p": "名詞句", "g": "生育度日", "s": 0, "r": "heat summation（積算温度）／macroclimate（マクロクライメート）／cool-climate viticulture（冷涼気候栽培）", "n": "基準温度を超えた日平均気温を積算し、ブドウの生育や成熟に必要な熱量を評価する指標。"}, {"no": 30, "f": "栽培", "h": "hand harvesting", "i": "/hænd ˈhɑːrvɪstɪŋ/", "p": "名詞句", "g": "手摘み", "s": 0, "r": "mechanical harvesting（機械収穫）／selective harvesting（選択収穫）／tries（トリ・選択的複数回収穫）", "n": "作業者が房を手で収穫する方法。選果や傷みのある果実の除去に適する。"}, {"no": 31, "f": "栽培", "h": "hang time", "i": "/ˈhæŋ ˌtaɪm/", "p": "名詞句", "g": "ハングタイム（果実を樹に残す期間）", "s": 0, "r": "ripeness（成熟度）／Late Harvest（レイトハーベスト）", "n": "完熟以降も果実を樹に残す期間。長いほど糖と風味が凝縮し、高アルコールで濃厚なスタイルになる。"}, {"no": 32, "f": "栽培", "h": "head-grafting", "i": "/ˈhɛd ˌɡrɑːftɪŋ/", "p": "名詞", "g": "高接ぎ（既存樹への接ぎ木）", "s": 0, "r": "grafting（接ぎ木）／top grafting（高接ぎの別称）", "n": "成木の主幹上部に別品種を接ぎ品種を早く転換する手法。市場の需要変化に素早く対応できる。"}, {"no": 33, "f": "栽培", "h": "hedging", "i": "/ˈhɛdʒɪŋ/", "p": "名詞", "g": "刈り込み（トリミング）", "s": 0, "r": "canopy management（キャノピー・マネジメント）／shoot positioning（新梢の整枝）", "n": "伸びすぎた新梢の先端を切り揃える作業。樹勢を抑え作業性と受光を保つために夏に行われる。"}, {"no": 34, "f": "栽培", "h": "hybrid", "i": "/ˈhaɪbrɪd/", "p": "名詞", "g": "ハイブリッド（交雑品種）", "s": 0, "r": "crossing（交配種）／Vitis vinifera（ヨーロッパブドウ）", "n": "異なるVitis種どうし（ヴィニフェラ×米国系種など）の交配で生まれた品種。耐病性・耐寒性などを目的に育種される。"}, {"no": 35, "f": "栽培", "h": "indigenous variety", "i": "/ɔːˈtɒkθənəs vəˈraɪəti/", "p": "名詞句", "g": "土着品種（在来品種）", "s": 0, "r": "international variety（国際品種）／native variety（在来品種の別称）", "n": "その土地に古くから存在する固有の在来品種。外来品種に対して、その地域の気候・土壌に適応してきた品種を指す。"}, {"no": 36, "f": "栽培", "h": "internode", "i": "/ˈɪntərnoʊd/", "p": "名詞", "g": "節間（節と節の間）", "s": 0, "r": "node（節）／vigour（樹勢）", "n": "節と節の間の部分。樹勢が強いと節間は長くなる。"}, {"no": 37, "f": "栽培", "h": "irrigation", "i": "/ˌɪrɪˈɡeɪʃən/", "p": "名詞", "g": "灌漑", "s": 0, "r": "drip irrigation（点滴灌漑）／flood irrigation（湛水灌漑）／sprinklers（スプリンクラー灌漑）", "n": "畑に人為的に水を与える技術。乾燥地で樹の生育を保つが、与えすぎは樹勢過多や希釈を招く。"}, {"no": 38, "f": "栽培", "h": "Late Harvest", "i": "/ˌleɪt ˈhɑːvɪst/", "p": "名詞句", "g": "レイトハーベスト（遅摘み甘口、浸漬を経ない）", "s": 0, "r": "vendange tardive（仏：遅摘み）／noble rot（貴腐）／hang time（ハングタイム）", "n": "通常より遅く収穫した糖度の高いブドウから造るワイン。凝縮した果実味を持ち、甘口ワインに用いられることが多い。"}, {"no": 39, "f": "栽培", "h": "leaf removal", "i": "/liːf rɪˈmuːvəl/", "p": "名詞句", "g": "除葉（摘葉）", "s": 0, "r": "canopy management（キャノピー・マネジメント）／sunlight interception（受光）", "n": "果実周りの葉を取り日当たりと風通しを高める作業。成熟促進や病害予防のために行われる。"}, {"no": 40, "f": "栽培", "h": "machine harvest", "i": "/məˈʃiːn ˈhɑːrvɪst/", "p": "名詞句", "g": "機械収穫", "s": 0, "r": "mechanical harvesting（機械収穫）／hand harvest（手摘み）", "n": "収穫機による摘み取り。垣根仕立てが前提で人件費を抑え安価なワインを可能にする。急斜面や棚仕立てでは不可。"}, {"no": 41, "f": "栽培", "h": "Mass Selection", "i": "/ˈmæsəl sɪˈlɛkʃən/", "p": "名詞句", "g": "マサル・セレクション", "s": 0, "r": "Sélection Massale（別名）／clonal selection（クローン選抜）", "n": "優良な畑の複数の樹から穂木を集めて増やす伝統的な繁殖方法。遺伝的多様性を残せる。"}, {"no": 42, "f": "栽培", "h": "millerandage", "i": "/ˌmɪləˈrɑːndɑːʒ/", "p": "名詞", "g": "ミルランダージュ（結実不良）", "s": 0, "r": "coulure（花振るい）／fruit set（結実）", "n": "結実不良により種なしの小粒果が多くなる現象。収量低下につながり、未熟なまま残る果粒は品質にも悪影響を及ぼす。"}, {"no": 43, "f": "栽培", "h": "multiple passes", "i": "/ˈmʌltɪpəl pɑːsɪz/", "p": "名詞句", "g": "複数回収穫", "s": 0, "r": "selective harvesting（選択収穫）／tries（トリ・選択的複数回収穫）／Late Harvest（遅摘み）", "n": "同じ畑を複数回訪れ、成熟した果実だけを段階的に収穫する方法。"}, {"no": 44, "f": "栽培", "h": "night harvesting", "i": "/ˈnaɪt ˌhɑːvɪstɪŋ/", "p": "名詞句", "g": "夜間収穫", "s": 0, "r": "machine harvest（機械収穫）／temperature control（温度管理）", "n": "涼しい夜に摘む手法。果実温度を低く保ち酸化や早期発酵を防ぐ。白で品質保持に用いられ機械化が前提。"}, {"no": 45, "f": "栽培", "h": "node", "i": "/noʊd/", "p": "名詞", "g": "節（葉や芽が付く位置）", "s": 0, "r": "internode（節間）／shoot（新梢）", "n": "新梢上で葉・芽・巻きひげ・花房が付く位置。剪定では残す芽数を節で数える。"}, {"no": 46, "f": "栽培", "h": "old vine", "i": "/ˌoʊld ˈvaɪn/", "p": "名詞句", "g": "老木（樹齢の高い古木）", "s": 0, "r": "young vine（若木）／vieilles vignes（仏：老木）", "n": "低収量で凝縮した果実を生む高樹齢の樹。仏vieilles vignesに対応。フィロキセラを免れた古木も多く価値が高い。"}, {"no": 47, "f": "栽培", "h": "organic viticulture", "i": "/ɔːrˈɡænɪk ˈvɪtɪkʌltʃər/", "p": "名詞句", "g": "有機栽培", "s": 0, "r": "biodynamic viticulture（ビオディナミ）／sustainable viticulture（サステナブル栽培）", "n": "化学合成農薬や肥料を避け天然由来資材で育てる栽培法。認証を伴い環境配慮を訴求する手法。"}, {"no": 48, "f": "栽培", "h": "organic wine", "i": "/ɔːrˈɡænɪk waɪn/", "p": "名詞句", "g": "オーガニックワイン（有機ワイン）", "s": 0, "r": "organic viticulture（有機栽培）／biodynamic viticulture（ビオディナミ農法）／natural wine（自然派ワイン）", "n": "有機栽培ブドウから認証基準に従って造られるワイン。EUでは醸造工程にも規則が及ぶ。"}, {"no": 49, "f": "栽培", "h": "own-rooted (ungrafted)", "i": "/ˌoʊn ˈruːtɪd/", "p": "形容詞", "g": "自根（台木を使わない樹）", "s": 0, "r": "ungrafted vine（自根樹）", "n": "台木に接がず自らの根で育つ樹。フィロキセラ未侵入の地域や砂質土壌で可能。長命な古木となりやすく、接ぎ木と対比される。"}, {"no": 50, "f": "栽培", "h": "passerillage", "i": "/pasʁiˈjaʒ/", "p": "名詞", "g": "パスリヤージュ（樹上乾燥）", "s": 0, "r": "raisining（干しブドウ化）／sun-drying（天日干し）", "n": "収穫を遅らせて果実を樹上に残し、貴腐菌を伴わずに脱水させ、糖分や風味を凝縮させる手法。"}, {"no": 51, "f": "栽培", "h": "phenolic ripeness", "i": "/fəˈnɒlɪk ˈraɪpnəs/", "p": "名詞句", "g": "フェノール類の成熟", "s": 0, "r": "physiological ripeness（生理的成熟）／ripeness（成熟）／hang time（ハングタイム・樹上での成熟期間）", "n": "果皮や種子のタンニンなどフェノール成分が望ましい成熟度に達した状態。"}, {"no": 52, "f": "栽培", "h": "photosynthesis", "i": "/ˌfoʊtoʊˈsɪnθəsɪs/", "p": "名詞", "g": "光合成", "s": 0, "r": "stomata（気孔）／sunlight interception（受光）／canopy management（キャノピーマネジメント）", "n": "葉が光エネルギーを使って糖を合成する反応。ブドウの成長や果実への糖の蓄積を支える。"}, {"no": 53, "f": "栽培", "h": "physiological ripeness", "i": "/ˌfɪziəˈlɒdʒɪkəl ˈraɪpnəs/", "p": "名詞句", "g": "生理的成熟", "s": 0, "r": "phenolic ripeness（フェノール類の成熟）／sugar ripeness（糖の成熟）／ripeness（成熟）", "n": "種子や果皮などの生理的組織が成熟した状態を指す概念。糖度だけでは判断できない。"}, {"no": 54, "f": "栽培", "h": "planting density", "i": "/ˈplɑːntɪŋ ˌdensɪti/", "p": "名詞句", "g": "植栽密度", "s": 0, "r": "yield（収量）／vigour（樹勢）", "n": "単位面積あたりの植栽本数。1樹あたりの収量とともに面積あたりの収量を左右し、高密植では収量を確保しやすい。"}, {"no": 55, "f": "栽培", "h": "precision viticulture", "i": "/prɪˈsɪʒən ˈvɪtɪkʌltʃər/", "p": "名詞句", "g": "精密栽培", "s": 0, "r": "remote sensing（リモートセンシング）／drone（ドローン）", "n": "センサーやGPS等の技術で畑内のばらつきを把握し区画ごとに管理する栽培法。効率と品質を高める。"}, {"no": 56, "f": "栽培", "h": "propagation", "i": "/ˌprɒpəˈɡeɪʃən/", "p": "名詞", "g": "繁殖（増殖）", "s": 0, "r": "cutting（挿し木）／grafting（接ぎ木）／clone（クローン）", "n": "苗を増やす作業全般。ブドウでは挿し木や接ぎ木など栄養繁殖が主で、品種を忠実に受け継がせる。"}, {"no": 57, "f": "栽培", "h": "pruning", "i": "/ˈpruːnɪŋ/", "p": "名詞", "g": "剪定", "s": 0, "r": "spur pruning（短梢剪定）／cane pruning（長梢剪定）／hedging（刈り込み）", "n": "不要な枝を切り芽の数を決める冬～春の作業。翌年の収量と樹形を管理する栽培の根幹をなす。"}, {"no": 58, "f": "栽培", "h": "ripeness", "i": "/ˈraɪpnəs/", "p": "名詞", "g": "成熟度", "s": 0, "r": "veraison（ヴェレゾン）／hang time（ハングタイム）", "n": "糖・酸・タンニン・香りが飲み頃へ達した度合い。収穫時期の判断を左右する栽培上の重要指標。"}, {"no": 59, "f": "栽培", "h": "rootstock", "i": "/ˈruːtstɒk/", "p": "名詞", "g": "台木", "s": 0, "r": "grafting（接ぎ木）／phylloxera（フィロキセラ）／own-rooted (ungrafted)（自根）", "n": "接ぎ木の土台となる根の部分。フィロキセラ抵抗性や土壌適応、樹勢調整のために品種が選ばれる。"}, {"no": 60, "f": "栽培", "h": "salinity", "i": "/səˈlɪnəti/", "p": "名詞", "g": "塩害・塩分濃度", "s": 0, "r": "irrigation（灌漑）／drought stress（乾燥ストレス）", "n": "土壌や水の塩分。灌漑水の塩が蓄積すると吸水を妨げ生育を阻害。台木選択で耐性を高められる。"}, {"no": 61, "f": "栽培", "h": "selective harvesting", "i": "/sɪˈlektɪv ˈhɑːrvɪstɪŋ/", "p": "名詞句", "g": "選択収穫", "s": 0, "r": "multiple passes（複数回収穫）／tries（トリ・選択的複数回収穫）／hand harvesting（手摘み）", "n": "成熟度や健全性に応じて果実を選んで収穫する方法。甘口ワインなどで重要。"}, {"no": 62, "f": "栽培", "h": "smudge pot", "i": "/ˈsmʌdʒ pɒt/", "p": "名詞句", "g": "スマッジポット（燃焼式霜害防止器）", "s": 0, "r": "frost（霜害）／frost fan（防霜ファン）", "n": "燃料を燃焼させて熱を発生させ、ブドウ畑の気温低下を抑える霜害対策。煙や大気汚染、設置・点火に人手を要するのが欠点。"}, {"no": 63, "f": "栽培", "h": "soil moisture", "i": "/sɔɪl ˈmɔɪstʃər/", "p": "名詞句", "g": "土壌水分", "s": 0, "r": "water-holding capacity（保水力）／water stress（水分ストレス）／irrigation（灌漑）", "n": "土壌中に保持されている水分。ブドウ樹の生育や水分ストレスを左右する。"}, {"no": 64, "f": "栽培", "h": "stomata", "i": "/ˈstoʊmətə/", "p": "名詞", "g": "気孔（きこう）", "s": 0, "r": "transpiration（蒸散）／water stress（水ストレス）", "n": "葉の表皮にある小孔で、二酸化炭素の取り込みと水分の放出を調節する。乾燥や高温で閉じると光合成が低下し、果実の成熟に影響する。"}, {"no": 65, "f": "栽培", "h": "sunlight interception", "i": "/ˈsʌnlaɪt ˌɪntəˈsepʃən/", "p": "名詞句", "g": "受光（日照の受容）", "s": 0, "r": "canopy management（キャノピー・マネジメント）／leaf removal（除葉）", "n": "葉や果実が受ける日照の量。南向き斜面や適切な仕立てで最大化し、成熟と凝縮を促す。受光の良否が品質を左右する。"}, {"no": 66, "f": "栽培", "h": "sustainable viticulture", "i": "/səˈsteɪnəbəl ˈvɪtɪkʌltʃər/", "p": "名詞句", "g": "サステナブル栽培", "s": 0, "r": "organic viticulture（有機栽培）／biodynamic viticulture（ビオディナミ）", "n": "環境負荷と経済性の均衡を図り資源を守る栽培法。農薬を必要最小限に抑え長期的な畑の健全を目指す。"}, {"no": 67, "f": "栽培", "h": "tendril", "i": "/ˈtɛndrɪl/", "p": "名詞", "g": "巻きひげ", "s": 0, "r": "shoot（新梢）／canopy（樹冠）", "n": "新梢から出て支柱などに絡み付く器官。ブドウがつる性植物であることを示す。"}, {"no": 68, "f": "栽培", "h": "terraced vineyard", "i": "/ˈterəst ˌvɪnjəd/", "p": "名詞句", "g": "段々畑（テラス畑）", "s": 0, "r": "soil erosion（土壌浸食）／amphitheatre（円形劇場状地形）", "n": "急斜面を段状に整えた畑。土壌流失を防ぐが機械化が難しく手作業が増え費用が嵩む。"}, {"no": 69, "f": "栽培", "h": "terroir", "i": "/tɛˈrwɑːr/", "p": "名詞", "g": "テロワール", "s": 0, "r": "aspect（斜面の向き）／mesoclimate（メソクリマ）／soil（土壌）", "n": "土壌・気候・地形など畑固有の自然環境の総体。ワインの個性を生む土地の条件を指す概念。"}, {"no": 70, "f": "栽培", "h": "tries", "i": "/tʁi/", "p": "名詞", "g": "選択収穫", "s": 0, "r": "tri（仏：選別・選果）／noble rot（貴腐）", "n": "貴腐菌や過熟した果実だけを選んで摘むため、畑を何度も収穫する方法。手摘みのため高コストだが、甘口ワインの品質を高める。"}, {"no": 71, "f": "栽培", "h": "trunk", "i": "/trʌŋk/", "p": "名詞", "g": "主幹（ブドウ樹の幹）", "s": 0, "r": "cordon（コルドン）／vine（ブドウ樹）", "n": "地上部を支える恒久的な幹。樹形の基本となり、寒冷地では凍害への備えとして複数残すこともある。"}, {"no": 72, "f": "栽培", "h": "variety", "i": "/vəˈraɪəti/", "p": "名詞", "g": "品種", "s": 0, "r": "indigenous variety（土着品種）／varietal wine（品種名ワイン）／clone（クローン）", "n": "ブドウの遺伝的に区別される品種。日常的にはcultivarとほぼ同義で使われることもある。"}, {"no": 73, "f": "栽培", "h": "veraison", "i": "/vɛʁɛˈzɔ̃/", "p": "名詞", "g": "ヴェレゾン（色づき）", "s": 0, "r": "flowering（開花）／ripeness（成熟度）", "n": "果実が色付き糖を蓄え始める成熟の転換点。黒ブドウ品種は赤色から紫色、白ブドウ品種は半透明の金色になる。"}, {"no": 74, "f": "栽培", "h": "vieilles vignes", "i": "/vjɛj ˈviɲ/", "p": "名詞句", "g": "ヴィエイユ・ヴィーニュ、古樹（仏）", "s": 0, "r": "old vine（古樹）／vieille vigne（単数形）", "n": "フランス語で「古い樹」の意。樹齢の法的定義はないが、低収量で凝縮した果実を示唆する表示。"}, {"no": 75, "f": "栽培", "h": "vigour", "i": "/ˈvɪɡər/", "p": "名詞", "g": "樹勢", "s": 0, "r": "vigorous（形容詞）", "n": "ブドウ樹が枝葉を伸ばそうとする勢い。強すぎると日陰や過繁茂を招き、果実品質を下げる要因になる。"}, {"no": 76, "f": "栽培", "h": "vine", "i": "/vaɪn/", "p": "名詞", "g": "ブドウの樹（ブドウ樹）", "s": 0, "r": "Vitis vinifera（ヨーロッパブドウ）／old vine（老木）", "n": "ブドウの植物体そのものを指す、ワイン造りの基本語。樹勢や樹齢などが生育や果実の成熟、ひいてはワインの品質に影響する。"}, {"no": 77, "f": "栽培", "h": "viticulture", "i": "/ˈvɪtɪkʌltʃər/", "p": "名詞", "g": "ブドウ栽培（学）", "s": 0, "r": "organic viticulture（有機栽培）／sustainable viticulture（サステナブル栽培）／vinification（醸造）", "n": "ワイン用ブドウを栽培する技術および学問。気候・土壌などの栽培環境、仕立て、剪定、防除、収量管理など、ブドウ生産全般を扱う分野。"}, {"no": 78, "f": "栽培", "h": "Vitis vinifera", "i": "/ˌviːtɪs vɪˈnɪfərə/", "p": "名詞句", "g": "ヴィティス・ヴィニフェラ。欧州系ブドウ種", "s": 0, "r": "hybrid（交雑種）／rootstock（台木）／indigenous variety（土着品種）", "n": "高級ワイン用品種のほぼ全てが属する欧州系ブドウの学名。米国系種や交雑種と対比される基本語。"}, {"no": 79, "f": "栽培", "h": "water stress", "i": "/ˈwɔːtər strɛs/", "p": "名詞句", "g": "水ストレス", "s": 0, "r": "drought stress（乾燥ストレス）／irrigation（灌漑）", "n": "適度な水不足で樹の生育を抑える状態。軽度なら果実の凝縮を促すが過度だと成熟が停止する。"}, {"no": 80, "f": "栽培", "h": "wind machine", "i": "/ˈfrɒst fæn/", "p": "名詞句", "g": "防霜ファン（送風による霜害対策）", "s": 0, "r": "spring frost（春霜）／smudge pot（スマッジポット）", "n": "上空の暖気を地表へ送り春の霜害を防ぐ大型送風機。スプリンクラー散水と並ぶ冷涼産地の霜対策手段。"}, {"no": 81, "f": "栽培", "h": "windbreak", "i": "/ˈwɪndˌbreɪk/", "p": "名詞", "g": "防風林・防風垣", "s": 0, "r": "Mistral（ミストラル）／Tramontane（トラモンターヌ）", "n": "強風からブドウ畑を守る樹木や垣など。風害を軽減する一方、水分や養分をブドウ樹と競合する場合がある。"}, {"no": 82, "f": "栽培", "h": "yield", "i": "/jiːld/", "p": "名詞", "g": "収量", "s": 0, "r": "green harvest（グリーンハーベスト）／crop thinning（摘房）／planting density（植栽密度）", "n": "ブドウの収穫量。適正な収量は栽培条件などによって異なり、過剰・過少のいずれも品質に影響する。"}, {"no": 83, "f": "栽培", "h": "bush vine", "i": "/ˈbʊʃ vaɪn/", "p": "名詞句", "g": "株仕立て（ゴブレ）", "s": 0, "r": "gobelet（仏：ゴブレ）／head training（株仕立て）", "n": "支柱やワイヤーを基本的に用いない低木状の仕立て。風に強く、果房を日射から守る一方、機械化が難しく手作業のコストが高い。"}, {"no": 84, "f": "栽培", "h": "cane", "i": "/keɪn/", "p": "名詞", "g": "長梢（ケーン）", "s": 0, "r": "spur（短梢）／Guyot（ギヨ）", "n": "芽を8～20個程度残すように長く剪定した1年生の枝。翌年、この芽から新梢が伸びる。ギヨ仕立てで用いられる剪定単位の一つ。"}, {"no": 85, "f": "栽培", "h": "cane pruning", "i": "/keɪn ˈpruːnɪŋ/", "p": "名詞句", "g": "長梢剪定", "s": 0, "r": "spur pruning（短梢剪定）／cane（長梢）／Guyot（ギュイヨ式）", "n": "前年枝の一部を長く残して結果母枝として使う剪定方法。"}, {"no": 86, "f": "栽培", "h": "cordon", "i": "/ˈkɔːrdɒn/", "p": "名詞", "g": "コルドン（主枝）", "s": 0, "r": "Cordon de Royat（コルドン・ド・ロワイヤ）／cane（長梢）／spur（短梢）", "n": "ワイヤーに沿って水平に伸ばした恒久的な主枝。短梢に剪定でき機械化しやすい仕立ての基礎となる。"}, {"no": 87, "f": "栽培", "h": "Guyot", "i": "/ˈɡiːjoʊ/", "p": "名詞", "g": "ギヨ（仕立て）", "s": 0, "r": "replacement-cane pruning（更新長梢剪定）／cane（長梢）", "n": "毎年、長梢を残して更新する仕立て。畝状に整えやすく、多くの産地で広く用いられる。"}, {"no": 88, "f": "栽培", "h": "head training", "i": "/ˈhed ˌtreɪnɪŋ/", "p": "名詞句", "g": "株仕立て", "s": 0, "r": "bush vine（株仕立て）／cordon（コルドン）", "n": "幹の頂部から枝を出す株仕立て。垣根に頼らない伝統的な形で、南仏の乾燥地に適し、gobeletとも呼ばれる。"}, {"no": 89, "f": "栽培", "h": "pergola", "i": "/ˈpɛrɡola/", "p": "名詞", "g": "ペルゴラ（棚仕立て）", "s": 0, "r": "trellising（棚仕立て）／tendone（伊：棚仕立て）", "n": "高い棚に葉を広げる伝統的仕立て。多収で果実に日陰を与え、暑い南部やブドウの日焼け防止・通気に有利。"}, {"no": 90, "f": "栽培", "h": "replacement-cane pruning", "i": "/rɪˈpleɪsmənt keɪn ˈpruːnɪŋ/", "p": "名詞句", "g": "長梢更新剪定", "s": 0, "r": "Guyot（ギヨ）／spur pruning（短梢剪定）", "n": "毎年、新しい長梢を結果母枝として残し、前年のものを更新する剪定法。労力はかかるが、適切な芽を選べる。短梢剪定と対照的。"}, {"no": 91, "f": "栽培", "h": "shoot", "i": "/ʃuːt/", "p": "名詞", "g": "新梢（シュート）", "s": 0, "r": "cane（長梢）／spur（短梢）／shoot positioning（新梢の整枝）", "n": "その年に芽から伸びる緑色の枝。葉・花・果実を付け、光合成と果実生産の中心的な器官となる。"}, {"no": 92, "f": "栽培", "h": "shoot positioning", "i": "/ʃuːt pəˈzɪʃənɪŋ/", "p": "名詞句", "g": "新梢の整枝", "s": 0, "r": "VSP (vertical shoot positioning)（垣根仕立て）／canopy management（キャノピー・マネジメント）", "n": "伸びた新梢をワイヤー間に垂直へ導き固定する作業。受光と風通しを整え病害も抑える手入れ。"}, {"no": 93, "f": "栽培", "h": "spur", "i": "/spɜːr/", "p": "名詞", "g": "短梢", "s": 0, "r": "cane（長梢）／Cordon de Royat（コルドン・ド・ロワイヤ）", "n": "芽が2～3個だけ残るように短く切り詰めた熟梢（1年生の枝）。"}, {"no": 94, "f": "栽培", "h": "spur pruning", "i": "/spɜːr ˈpruːnɪŋ/", "p": "名詞句", "g": "短梢剪定", "s": 0, "r": "cane pruning（長梢剪定）／spur（短梢）／cordon（コルドン）", "n": "前年枝を短く残した短梢を基部に配置して剪定する方法。"}, {"no": 95, "f": "栽培", "h": "training system", "i": "/ˈtreɪnɪŋ ˈsɪstəm/", "p": "名詞句", "g": "仕立て方式", "s": 0, "r": "trellising（垣根仕立て・棚仕立て）／VSP (vertical shoot positioning)（垣根仕立て）／pergola（棚仕立て）", "n": "ブドウ樹の骨格を作る枝の配置方法。ギヨやコルドンなど、気候や作業に合わせて選択される。"}, {"no": 96, "f": "栽培", "h": "trellising", "i": "/ˈtrɛlɪsɪŋ/", "p": "名詞", "g": "垣根仕立て・棚仕立て", "s": 0, "r": "VSP (vertical shoot positioning)（垣根仕立て）／pergola（棚仕立て）", "n": "支柱やワイヤーで枝を支え誘引する仕組み。受光を高め機械作業を可能にする仕立ての骨格となる。"}, {"no": 97, "f": "栽培", "h": "VSP (vertical shoot positioning)", "i": "/ˌvɜːtɪkl ˈʃuːt pəˌzɪʃənɪŋ/", "p": "名詞句", "g": "垣根仕立て（新梢直立誘引）", "s": 0, "r": "trellising（垣根仕立て）／shoot positioning（新梢の整枝）", "n": "新梢を上方へ直立させて誘引する垣根仕立て。機械化に適し、多くのワイン産地で広く用いられる。"}, {"no": 98, "f": "環境", "h": "altitude", "i": "/ˈæltɪˌtjuːd/", "p": "名詞", "g": "標高", "s": 0, "r": "elevation（標高・海抜）／latitude（緯度）", "n": "標高が高いほど気温が下がり日較差と紫外線が増す。低緯度の暑い産地では冷却源となり酸を保つ。"}, {"no": 99, "f": "環境", "h": "amphitheatre", "i": "/ˈæmfɪˌθɪətə/", "p": "名詞", "g": "円形劇場状地形（すり鉢状の斜面）", "s": 0, "r": "terraced vineyard（段々畑）／aspect（斜面の向き）", "n": "円形劇場状に湾曲した斜面地形。日照を集め風から守られる好条件を生み、プイィ・フュイッセ等で銘醸畑となる。"}, {"no": 100, "f": "環境", "h": "biodiversity", "i": "/ˌbaɪəʊdaɪˈvɜːsəti/", "p": "名詞", "g": "生物多様性", "s": 0, "r": "cover crop（下草）／sustainable viticulture（サステナブル栽培）", "n": "ブドウ畑とその周辺に生息する植物・動物・微生物などの多様性。持続可能な栽培の重要な要素として、その保全が重視される。"}, {"no": 101, "f": "環境", "h": "caldera", "i": "/kælˈdɛərə/", "p": "名詞", "g": "カルデラ（火山性の陥没地形）", "s": 0, "r": "volcanic soil（火山性土壌）", "n": "大規模な火山活動によって形成された、広く大きな凹地。火山性土壌や独特の地形を生み、ブドウ栽培に影響を与えることがある。"}, {"no": 102, "f": "環境", "h": "carbon footprint", "i": "/ˈkɑːbən ˌfʊtprɪnt/", "p": "名詞句", "g": "カーボンフットプリント", "s": 0, "r": "sustainable viticulture（サステナブル栽培）／bulk transport（バルク輸送）", "n": "製品や事業活動のライフサイクル全体で排出される温室効果ガス量。薬剤・資材の削減、瓶の軽量化、バルク輸送などで低減が図られる。"}, {"no": 103, "f": "環境", "h": "climate change", "i": "/ˈklaɪmət tʃeɪndʒ/", "p": "名詞句", "g": "気候変動", "s": 0, "r": "global warming（地球温暖化）／vintage variation（ヴィンテージ差）", "n": "気温上昇や気候の極端化が栽培環境に及ぼす長期的な変化。成熟時期や産地適性、品種選択に影響を与える。"}, {"no": 104, "f": "環境", "h": "continental climate", "i": "/ˌkɒntɪˈnɛntəl ˈklaɪmət/", "p": "名詞句", "g": "大陸性気候", "s": 0, "r": "maritime climate（海洋性気候）／Mediterranean climate（地中海性気候）", "n": "季節間の気温差が大きく、海洋の影響が小さい内陸型気候。生育期が短く、春・秋の霜害リスクを伴う産地に多い。"}, {"no": 105, "f": "環境", "h": "cool climate", "i": "/ˈkuːl ˈklaɪmət ˌvɪtɪˈkʌltʃə/", "p": "名詞句", "g": "冷涼気候", "s": 0, "r": "marginal climate（限界的気候）／diurnal range（日較差）", "n": "生育期の気温が低い産地での栽培。酸が高く繊細で香り高いスタイルを生む。標高・緯度・海洋影響で実現し、新世界でも探求が進む。"}, {"no": 106, "f": "環境", "h": "diurnal range", "i": "/daɪˈɜːrnəl reɪndʒ/", "p": "名詞句", "g": "日較差（昼夜の温度差）", "s": 0, "r": "annual temperature range（年較差）", "n": "一日の最高気温と最低気温の差。大きいと夜間の低温により酸が保たれ、色や香りの発達に有利に働くことがある。"}, {"no": 107, "f": "環境", "h": "elevation", "i": "/ˌelɪˈveɪʃən/", "p": "名詞", "g": "標高・海抜", "s": 0, "r": "altitude（標高）", "n": "標高を指す語。標高が高いほど一般に気温が低くなり、生育期間や果実の成熟、ワインのスタイルに影響を与える。"}, {"no": 108, "f": "環境", "h": "evapotranspiration", "i": "/ɪˌvæpoʊˌtrænspəˈreɪʃən/", "p": "名詞", "g": "蒸発散", "s": 0, "r": "transpiration（蒸散）／water stress（水ストレス）", "n": "土壌からの蒸発と植物の蒸散を合わせた水分損失。気温や日射、風などで増加し、水ストレスや灌漑の必要性に影響する。"}, {"no": 109, "f": "環境", "h": "frost", "i": "/frɒst/", "p": "名詞", "g": "霜", "s": 0, "r": "spring frost（春霜）／frost fan（防霜ファン）", "n": "気温の低下によって植物表面に氷の結晶が生じる現象。春の霜は新芽や花を凍結させ、収量に影響することがある。"}, {"no": 110, "f": "環境", "h": "greenhouse gas emissions", "i": "/ˈɡriːnhaʊs ɡæs ɪˈmɪʃənz/", "p": "名詞句", "g": "温室効果ガス排出", "s": 0, "r": "carbon footprint（カーボンフットプリント）／climate change（気候変動）／sustainability（持続可能性）", "n": "二酸化炭素など、温暖化に寄与するガスの排出。"}, {"no": 111, "f": "環境", "h": "hail", "i": "/heɪl/", "p": "名詞", "g": "雹（ひょう）", "s": 0, "r": "anti-hail netting（防雹ネット）／overhead netting（防鳥・防雹ネット）", "n": "氷の粒が降る気象現象。生育期に発生すると果実や新梢を傷つけ、収量や品質に大きな被害を与えることがある。"}, {"no": 112, "f": "環境", "h": "heat retention", "i": "/ˈhiːt rɪˌtenʃən/", "p": "名詞句", "g": "蓄熱（熱の保持）", "s": 0, "r": "gravel（砂利質土壌）／diurnal range（日較差）", "n": "土壌や石が日中の熱を蓄え、夜間に放出する性質。砂利や石の多い畑で顕著で、夜間の気温低下を和らげ、果実の成熟を促す。"}, {"no": 113, "f": "環境", "h": "heat stress", "i": "/ˈhiːt ˌstrɛs/", "p": "名詞句", "g": "高温ストレス（暑熱によるブドウ樹の生育障害）", "s": 0, "r": "water stress（水ストレス）／sunburn（日焼け）", "n": "過度の高温でブドウ樹が受ける障害。光合成停止で果皮や種の成熟が滞り、温暖化下で問題化。標高等で緩和する。"}, {"no": 114, "f": "環境", "h": "latitude", "i": "/ˈlætɪˌtjuːd/", "p": "名詞", "g": "緯度", "s": 0, "r": "altitude（標高）／marginal climate（限界的気候）", "n": "赤道からの距離。高緯度ほど冷涼で日照が限られるが、標高や海洋の影響が緯度以上に効く場合も多い。"}, {"no": 115, "f": "環境", "h": "macroclimate", "i": "/ˈmækroʊklaɪmət/", "p": "名詞", "g": "マクロクリマ（大気候）", "s": 0, "r": "mesoclimate（メソクリマ）／microclimate（ミクロクリマ、小気候）", "n": "地域全体に及ぶ広域の気候。品種選択の大枠を決め、産地の性格を規定する最も大きな気候区分。"}, {"no": 116, "f": "環境", "h": "marginal climate", "i": "/ˈmɑːdʒɪnl ˈklaɪmət/", "p": "名詞句", "g": "限界的気候（栽培可能ぎりぎりの気候）", "s": 0, "r": "cool-climate viticulture（冷涼気候栽培）", "n": "ブドウが辛うじて成熟する冷涼・不安定な気候。年ごとの作柄差が大きいが、温暖化で将来有利になり得るとも評価される。"}, {"no": 117, "f": "環境", "h": "marine layer", "i": "/məˈriːn ˈleɪə/", "p": "名詞句", "g": "海洋層（沿岸に流れ込む冷たい霧）", "s": 0, "r": "morning mist（朝霧）／fog（霧）", "n": "海から流れ込む冷たい空気の層で、沿岸部に霧を生じさせる。日中の気温を抑え、ブドウの成熟を緩やかにする。"}, {"no": 118, "f": "環境", "h": "maritime climate", "i": "/ˈmærɪtaɪm ˈklaɪmət/", "p": "名詞句", "g": "海洋性気候", "s": 0, "r": "continental climate（大陸性気候）／Mediterranean climate（地中海性気候）", "n": "海の影響で年較差が小さく降水が多い温和な気候。生育期が長く穏やかに成熟が進む産地に多い。"}, {"no": 119, "f": "環境", "h": "Mediterranean climate", "i": "/ˌmedɪtəˈreɪniən ˌklaɪmət/", "p": "名詞句", "g": "地中海性気候", "s": 0, "r": "maritime climate（海洋性気候）／continental climate（大陸性気候）", "n": "夏は暑く乾燥し、冬は温暖な気候。日照が豊富で夏の降雨が少なく、ブドウ栽培に適する。"}, {"no": 120, "f": "環境", "h": "mesoclimate", "i": "/ˈmɛzoʊklaɪmət/", "p": "名詞", "g": "メソクリマ（中気候）", "s": 0, "r": "macroclimate（マクロクリマ）／microclimate（ミクロクリマ、小気候）", "n": "地域全体と個々の畑・樹の中間規模の気候。斜面の向きや標高など立地条件によって異なり、畑の選定や栽培条件に影響する。"}, {"no": 121, "f": "環境", "h": "microclimate", "i": "/ˈmaɪkrəʊˌklaɪmət/", "p": "名詞", "g": "ミクロクリマ（微気候）", "s": 0, "r": "mesoclimate（メソクリマ・中気候）／macroclimate（マクロクリマ・大気候）", "n": "樹冠内や畝単位のごく狭い範囲の気候。キャノピーマネジメントで制御できる最小尺度の気候概念。"}, {"no": 122, "f": "環境", "h": "mid-slope", "i": "/ˈmɪd ˌsləʊp/", "p": "名詞", "g": "斜面中腹", "s": 0, "r": "aspect（斜面の向き）／hillside（丘陵斜面）", "n": "斜面の中腹部。水はけや日照条件が比較的安定し、ブドウ栽培に適することが多い。ブルゴーニュではグラン・クリュやプルミエ・クリュが多く分布する。"}, {"no": 123, "f": "環境", "h": "moderating influence", "i": "/ˈmɒdəreɪtɪŋ ˌɪnfluəns/", "p": "名詞句", "g": "緩和作用（気候を和らげる影響）", "s": 0, "r": "maritime climate（海洋性気候）／diurnal range（日較差）", "n": "海・河川・湖などが気温の極端な変化を和らげる作用。暑さや霜のリスクを抑え、ブドウの成熟を安定させる。"}, {"no": 124, "f": "環境", "h": "morning mist", "i": "/ˈmɔːnɪŋ ˌmɪst/", "p": "名詞句", "g": "朝霧", "s": 0, "r": "marine layer（海洋層）／noble rot（貴腐）", "n": "朝に発生する霧。湿度を高めて貴腐菌の繁殖を促す一方、日中に晴れて乾燥することで、貴腐の形成に適した環境をつくる。"}, {"no": 125, "f": "環境", "h": "rain shadow", "i": "/ˈreɪn ˌʃædoʊ/", "p": "名詞句", "g": "雨陰（山脈の風下の乾燥域）", "s": 0, "r": "leeward（風下）／rainfall（降水量）", "n": "山脈が湿った気流を遮り、風下側が乾燥する現象。降水量を減らし、乾燥したブドウ栽培環境を生み出す。"}, {"no": 126, "f": "環境", "h": "raisining", "i": "/ˈreɪzənɪŋ/", "p": "名詞", "g": "干しブドウ化（レーズン化）", "s": 0, "r": "passerillage（パスリヤージュ）／sun-drying（天日干し）", "n": "高温や乾燥により果実の水分が失われ、レーズン状に萎縮する現象。糖分が濃縮する一方、果実の風味や酸のバランスが損なわれることがある。"}, {"no": 127, "f": "環境", "h": "regenerative viticulture", "i": "/rɪˈdʒenərətɪv ˈvɪtɪkʌltʃər/", "p": "名詞句", "g": "リジェネラティブ・ヴィティカルチャー（環境再生型ブドウ栽培）", "s": 0, "r": "organic viticulture（有機栽培）／biodynamic viticulture（ビオディナミ農法）／soil health（土壌健全性）", "n": "土壌の健全性や生態系の回復を重視し、土壌炭素や生物多様性の向上を目指すブドウ栽培。"}, {"no": 128, "f": "環境", "h": "soil health", "i": "/sɔɪl helθ/", "p": "名詞句", "g": "土壌健全性", "s": 0, "r": "cover crop（カバークロップ・被覆作物）／soil fertility（土壌肥沃度）／regenerative viticulture（環境再生型ブドウ栽培）", "n": "土壌の物理・化学・生物的機能が健全に保たれている状態。"}, {"no": 129, "f": "環境", "h": "spring frost", "i": "/ˈsprɪŋ ˌfrɒst/", "p": "名詞句", "g": "春霜（晩霜）", "s": 0, "r": "budburst（萌芽）／frost fan（防霜ファン）", "n": "春先の霜。萌芽したばかりの新芽を凍結させ、収量を大きく減らすことがある。遅い剪定や防霜ファン、散水などで対策する。"}, {"no": 130, "f": "環境", "h": "sunburn", "i": "/ˈsʌnbɜːn/", "p": "名詞", "g": "日焼け（果実の日焼け）", "s": 0, "r": "heat stress（高温ストレス）／leaf removal（除葉）", "n": "強い日射や高温により果実が損傷する現象。過度の除葉で発生リスクが高まり、葉陰を残すなどの対策がとられる。"}, {"no": 131, "f": "環境", "h": "ultraviolet radiation", "i": "/ˌʌltrəˈvaɪələt ˌreɪdiˈeɪʃən/", "p": "名詞句", "g": "紫外線", "s": 0, "r": "altitude（標高）／sunburn（日焼け）", "n": "標高が高いほど強くなる紫外線。ブドウの果皮の発達やフェノール類の生成に影響し、果実の色や風味に関与する。"}, {"no": 132, "f": "環境", "h": "vintage variation", "i": "/ˈvɪntɪdʒ ˌveəriˈeɪʃən/", "p": "名詞句", "g": "ヴィンテージ差（作柄変動）", "s": 0, "r": "vintage（ヴィンテージ）／climate change（気候変動）", "n": "年ごとの気候や天候の違いによる収量や品質の変動。開花期や収穫期の気温、降雨、霜、雹などが影響する。"}, {"no": 133, "f": "環境", "h": "water footprint", "i": "/ˈwɔːtər ˈfʊtprɪnt/", "p": "名詞句", "g": "ウォーターフットプリント", "s": 0, "r": "carbon footprint（カーボンフットプリント）／water stress（水分ストレス）／irrigation（灌漑）", "n": "ブドウ栽培やワイン生産で消費・汚染される水資源の総量を評価する概念。"}, {"no": 134, "f": "環境", "h": "water-holding capacity", "i": "/ˈwɔːtə ˌhəʊldɪŋ kəˈpæsɪti/", "p": "名詞句", "g": "保水力", "s": 0, "r": "free-draining soil（水はけの良い土壌）／clay（粘土）", "n": "土壌が水分を保持する能力。粘土質土壌などで高く、乾燥期にもブドウ樹へ水分を供給する。"}, {"no": 135, "f": "環境", "h": "Cape Doctor", "i": "/ˌkeɪp ˈdɒktər/", "p": "名詞句", "g": "ケープドクター（南東の強風）", "s": 0, "r": "zonda（ゾンダ）／Mistral（ミストラル）", "n": "南アフリカ西ケープに春から夏に吹く強い南東風。畑を冷やし乾燥させて病害を抑える一方、強風時には樹や新梢を傷めることがある。"}, {"no": 136, "f": "環境", "h": "Föhn wind", "i": "/ˈfɜːn ˌwɪnd/", "p": "名詞句", "g": "フェーン風（山越えの高温乾燥風）", "s": 0, "r": "zonda（ゾンダ）", "n": "山を越えて吹き下ろす高温乾燥風。気温を上げ、果実を乾燥させるため、ジュランソンなどでは成熟やpasserillageを促す。"}, {"no": 137, "f": "環境", "h": "Mistral", "i": "/ˈmɪstrəl/", "p": "名詞", "g": "ミストラル（ローヌを吹き下ろす冷たい北風）", "s": 0, "r": "Tramontane（トラモンターヌ）／windbreak（防風林）", "n": "ローヌ河谷やプロヴァンスを吹く強く乾いた北風。畑を冷やし、雨後の樹や果実を乾燥させて病害を抑える一方、強風による樹への被害もある。"}, {"no": 138, "f": "環境", "h": "Tramontane", "i": "/ˌtræmɒnˈtɑːn/", "p": "名詞", "g": "トラモンターヌ（ラングドックの乾いた北西風）", "s": 0, "r": "Mistral（ミストラル）", "n": "ラングドックなどを吹く冷涼で乾いた北〜北西風。湿度を下げ、ブドウ畑を乾燥させて病害を抑える一方、強風による枝や樹への被害もある。"}, {"no": 139, "f": "環境", "h": "zonda", "i": "/ˈzɒndə/", "p": "名詞", "g": "ゾンダ（アンデスの熱風）", "s": 0, "r": "Föhn wind（フェーン風）", "n": "アルゼンチンでアンデスから吹き下ろす高温乾燥の強風。開花や結実を妨げ、収量を減らすことがある。"}, {"no": 140, "f": "環境", "h": "alluvial", "i": "/əˈluːviəl/", "p": "形容詞", "g": "沖積の（河川が運んだ堆積物の）", "s": 0, "r": "alluvial soil（沖積土）／alluvial fan（沖積扇状地）", "n": "河川が運んだ砂・礫・泥などの堆積物から成る土壌。肥沃で、平野や河川沿いのブドウ栽培に見られる。"}, {"no": 141, "f": "環境", "h": "alluvial fan", "i": "/əˈluːviəl fæn/", "p": "名詞句", "g": "沖積扇状地", "s": 0, "r": "alluvial soil（沖積土）／alluvial（沖積の）", "n": "山裾に川が運んだ土砂が扇状に堆積した地形。礫が多く、水はけが良い。"}, {"no": 142, "f": "環境", "h": "alluvial soil", "i": "/əˈluːviəl ˌsɔɪl/", "p": "名詞句", "g": "沖積土", "s": 0, "r": "alluvial fan（沖積扇状地）／gravel（砂利質土壌）", "n": "河川の堆積物から生じる土壌。肥沃で、平野や河川沿いのブドウ栽培に多く見られる。"}, {"no": 143, "f": "環境", "h": "basalt", "i": "/bəˈsɔːlt/", "p": "名詞", "g": "玄武岩（火山性の暗色岩）", "s": 0, "r": "volcanic soil（火山性土壌）／tuff（凝灰岩）", "n": "火山活動によって生じる暗色の火成岩。風化すると、鉄やマグネシウムなどを含む土壌を形成する。"}, {"no": 144, "f": "環境", "h": "calcareous", "i": "/kælˈkeəriəs/", "p": "形容詞", "g": "石灰質の", "s": 0, "r": "limestone（石灰岩）／chalk（白亜）", "n": "石灰分を多く含むことを意味する形容詞。石灰質土壌は保水性があり、ブドウ栽培では酸の保持と関連づけられることが多い。"}, {"no": 145, "f": "環境", "h": "chalk", "i": "/tʃɔːk/", "p": "名詞", "g": "白亜（軟らかく多孔質の石灰岩）", "s": 0, "r": "limestone（石灰岩）／albariza（アルバリサ）", "n": "軟らかく多孔質な石灰岩。保水性と排水性を併せ持ち、乾燥した環境でのブドウ栽培に適する。"}, {"no": 146, "f": "環境", "h": "decomposed granite", "i": "/ˌdiːkəmˈpəʊzd ˈɡrænɪt/", "p": "名詞句", "g": "風化花崗岩（分解した花崗岩由来の砂質土）", "s": 0, "r": "granite（花崗岩）", "n": "花崗岩が風化・分解してできた砂質の土壌。水はけがよく、ブドウの樹勢を抑えやすい。"}, {"no": 147, "f": "環境", "h": "free-draining soil", "i": "/ˌfriː ˈdreɪnɪŋ ˌsɔɪl/", "p": "名詞句", "g": "水はけの良い土壌", "s": 0, "r": "gravel（砂利質土壌）／water-holding capacity（保水力）", "n": "水はけの良い土壌。過湿を防ぎ、根の健全な生育を促す一方、乾燥時には水分不足になりやすい。"}, {"no": 148, "f": "環境", "h": "galestro", "i": "/ɡaˈlɛstro/", "p": "名詞", "g": "ガレストロ（片岩質の崩れやすい土壌）", "s": 0, "r": "alberese（アルベレーゼ）／schist（片岩）", "n": "イタリア・トスカーナで見られる、薄く砕けやすい片岩質の土壌。水はけがよく、ブドウの成熟を支える。"}, {"no": 149, "f": "環境", "h": "gneiss", "i": "/naɪs/", "p": "名詞", "g": "片麻岩（へんまがん）", "s": 0, "r": "granite（花崗岩）／schist（片岩）", "n": "花崗岩などが高温・高圧で変成してできた岩石。硬く、水はけのよい土壌を形成することがある。"}, {"no": 150, "f": "環境", "h": "granite", "i": "/ˈɡrænɪt/", "p": "名詞", "g": "花崗岩（土壌）", "s": 0, "r": "decomposed granite（風化花崗岩）／gneiss（片麻岩）", "n": "花崗岩からなる土壌。風化すると砂質になりやすく、水はけがよい。"}, {"no": 151, "f": "環境", "h": "gravel", "i": "/ˈɡrævəl/", "p": "名詞", "g": "砂利質土壌（グラーヴ）", "s": 0, "r": "free-draining soil（水はけの良い土壌）／heat retention（蓄熱）", "n": "砂利を多く含む土壌。水はけがよく、日中に蓄えた熱がブドウの成熟を助ける。"}, {"no": 152, "f": "環境", "h": "Kimmeridgian", "i": "/ˌkɪməˈrɪdʒiən/", "p": "形容詞", "g": "キンメリジャン（化石を含む石灰質・粘土土壌）", "s": 0, "r": "limestone（石灰岩）／marl（泥灰土）", "n": "貝化石を多く含む石灰質・粘土質の地層。シャブリなどの土壌として知られる。"}, {"no": 153, "f": "環境", "h": "limestone", "i": "/ˈlaɪmstəʊn/", "p": "名詞", "g": "石灰岩", "s": 0, "r": "calcareous（石灰質の）／chalk（白亜）", "n": "主に炭酸カルシウムからなる堆積岩。保水性と排水性を併せ持ち、ブドウ栽培では酸の保持と関連づけられることが多い。"}, {"no": 154, "f": "環境", "h": "loam", "i": "/ləʊm/", "p": "名詞", "g": "ローム（砂・シルト・粘土がほどよく混じった壌土）", "s": 0, "r": "sand（砂）／silt（シルト）／clay（粘土）", "n": "砂・シルト・粘土がバランスよく混ざった土壌。保水性と排水性のバランスがよく、肥沃な土壌になりやすい。"}, {"no": 155, "f": "環境", "h": "loess", "i": "/ˈloʊɛs/", "p": "名詞", "g": "レス（風成の細粒黄土質土壌）", "s": 0, "r": "loam（ローム）／silt（シルト）", "n": "風で運ばれた細かな土砂が堆積してできた土壌。保水性があり、肥沃な土壌になりやすい。"}, {"no": 156, "f": "環境", "h": "marl", "i": "/mɑːl/", "p": "名詞", "g": "泥灰土（マール）", "s": 0, "r": "limestone（石灰岩）／clay（粘土）", "n": "石灰分と粘土が混じった土壌。保水性と排水性のバランスがよく、ブドウ栽培に適した土壌とされる。"}, {"no": 157, "f": "環境", "h": "sandstone", "i": "/ˈsæn(d)stəʊn/", "p": "名詞", "g": "砂岩", "s": 0, "r": "greywacke（硬砂岩）／shale（頁岩）", "n": "砂が固まってできた堆積岩。風化すると砂質の土壌となり、水はけのよい土壌を形成することがある。"}, {"no": 158, "f": "環境", "h": "schist", "i": "/ˈʃɪst/", "p": "名詞", "g": "片岩（シスト土壌）", "s": 0, "r": "slate（スレート）", "n": "薄く層状に割れやすい変成岩。風化すると水はけのよい土壌となり、根が岩の割れ目に伸びやすい。"}, {"no": 159, "f": "環境", "h": "shale", "i": "/ʃeɪl/", "p": "名詞", "g": "頁岩（けつがん／薄く剥がれる堆積岩）", "s": 0, "r": "slate（スレート）／sandstone（砂岩）", "n": "薄く層状に割れやすい堆積岩。風化すると粘土質の土壌となることがあり、水はけや保水性は土壌の状態によって異なる。"}, {"no": 160, "f": "環境", "h": "slate", "i": "/sleɪt/", "p": "名詞", "g": "スレート（粘板岩）", "s": 0, "r": "schist（片岩）", "n": "薄く層状に割れやすい変成岩。風化すると水はけのよい土壌となり、熱を蓄える性質もある。"}, {"no": 161, "f": "環境", "h": "soil erosion", "i": "/ˈsɔɪl ɪˌrəʊʒən/", "p": "名詞句", "g": "土壌浸食", "s": 0, "r": "terraced vineyard（段々畑）／cover crop（下草）", "n": "雨や風などによって表土が流失する現象。急斜面では特に起こりやすく、テラス化やカバークロップなどで防ぐ。"}, {"no": 162, "f": "環境", "h": "soil fertility", "i": "/ˈsɔɪl fəˌtɪlɪti/", "p": "名詞句", "g": "土壌肥沃度", "s": 0, "r": "vigour（樹勢）／cover crop（下草）", "n": "土壌が植物の生育に必要な養分をどれだけ供給できるかを示す度合い。高すぎると樹勢が強くなりやすい。"}, {"no": 163, "f": "環境", "h": "terra rossa", "i": "/ˌterə ˈrɒsə/", "p": "名詞", "g": "テラロッサ（石灰岩上の赤色土）", "s": 0, "r": "limestone（石灰岩）／calcareous（石灰質の）", "n": "石灰岩の風化によって生じた鉄分豊富な赤色土。豪クナワラで特に有名で、水はけと保水性のバランスに優れる。"}, {"no": 164, "f": "環境", "h": "volcanic soil", "i": "/vɒlˌkænɪk ˈsɔɪl/", "p": "名詞句", "g": "火山性土壌", "s": 0, "r": "basalt（玄武岩）／tuff（凝灰岩）", "n": "溶岩や火山灰などの火山物質から形成された土壌。鉱物組成や排水性などは、母材や風化の程度によって異なる。"}, {"no": 165, "f": "病害虫", "h": "biosecurity", "i": "/ˌbaɪoʊsɪˈkjʊərəti/", "p": "名詞", "g": "バイオセキュリティ（生物学的防疫）", "s": 0, "r": "quarantine（検疫）／phylloxera（フィロキセラ）", "n": "病害虫や病原体の侵入・拡散を防ぐための防疫対策。ブドウ栽培では、検疫や衛生管理などを含む。"}, {"no": 166, "f": "病害虫", "h": "black rot", "i": "/ˈblæk ˌrɒt/", "p": "名詞句", "g": "黒腐病", "s": 0, "r": "downy mildew（ベト病）／powdery mildew（ウドンコ病）", "n": "果実や葉を侵す糸状菌による病害。温暖で湿った環境で発生しやすく、ブドウ栽培では防除が必要となる。"}, {"no": 167, "f": "病害虫", "h": "Bordeaux mixture", "i": "/bɔːrˌdoʊ ˈmɪkstʃər/", "p": "名詞句", "g": "ボルドー液（硫酸銅と石灰の混合殺菌剤）", "s": 0, "r": "downy mildew（ベト病）／powdery mildew（ウドンコ病）", "n": "硫酸銅と生石灰の水溶液からなる伝統的殺菌剤。べと病対策の定番で、有機栽培でも使用が認められる。"}, {"no": 168, "f": "病害虫", "h": "botrytis", "i": "/bəˈtraɪtɪs/", "p": "名詞", "g": "ボトリティス菌（灰色かび病）", "s": 0, "r": "noble rot（貴腐）／grey rot（灰色かび病）／botrytis bunch rot（灰色かび病）", "n": "ブドウに感染する菌類。灰色かび病を引き起こす一方、特定の条件では貴腐を形成し、甘口ワインの生産に利用される。"}, {"no": 169, "f": "病害虫", "h": "chlorosis", "i": "/klɔːˈrəʊsɪs/", "p": "名詞", "g": "クロロシス（葉の黄化）", "s": 0, "r": "calcareous（石灰質の）／iron deficiency（鉄欠乏）", "n": "葉緑素が減少して葉が黄化する生理障害。石灰質土壌では鉄欠乏によって起こることがある。"}, {"no": 170, "f": "病害虫", "h": "downy mildew", "i": "/ˈdaʊni ˈmɪldjuː/", "p": "名詞句", "g": "ベト病", "s": 0, "r": "powdery mildew（ウドンコ病）／Bordeaux mixture（ボルドー液）", "n": "湿潤な気候で葉や果実を侵す卵菌による病害。光合成を妨げ、収量や品質を低下させる。"}, {"no": 171, "f": "病害虫", "h": "Esca", "i": "/ˈeskə/", "p": "名詞", "g": "エスカ（ブドウ樹の幹の病害）", "s": 0, "r": "trunk disease（幹の病気）／eutypa dieback（ユーティパ立枯病）", "n": "木部に感染する複数の菌類による幹の病害。葉の黄化や萎凋、枝の枯死などを引き起こし、樹の寿命を縮めることがある。"}, {"no": 172, "f": "病害虫", "h": "European grapevine moth", "i": "/ˌjʊərəˈpiːən ˈɡreɪpvaɪn ˌmɒθ/", "p": "名詞句", "g": "ヨーロッパブドウ蛾（果房食害虫）", "s": 0, "r": "pheromone trap（フェロモントラップ）／pheromone capsule（フェロモンカプセル）", "n": "幼虫が花や果実を食害する主要害虫。フェロモントラップによる発生監視や、フェロモン剤による交信撹乱で防除される。"}, {"no": 173, "f": "病害虫", "h": "eutypa dieback", "i": "/juːˈtaɪpə ˌdaɪbæk/", "p": "名詞句", "g": "ユーティパ立枯病（枝枯れ）", "s": 0, "r": "trunk disease（幹の病気）／Esca（エスカ）", "n": "剪定痕などから感染し、枝や幹を枯死させる真菌性の病害。ブドウ樹の生育や収量に影響を及ぼすことがある。"}, {"no": 174, "f": "病害虫", "h": "fanleaf and leafroll virus", "i": "/ˈfænliːf ənd ˈliːfrəʊl ˌvaɪrəs/", "p": "名詞句", "g": "ファンリーフ・リーフロール（代表的なブドウのウイルス病）", "s": 0, "r": "nematode（線虫）／virus disease（ウイルス病）", "n": "ファンリーフやリーフロールを引き起こすブドウの主要なウイルス病。生育や果実の成熟に悪影響を及ぼし、収量や品質を低下させることがある。"}, {"no": 175, "f": "病害虫", "h": "grape moth", "i": "/ɡreɪp mɒθ/", "p": "名詞句", "g": "ブドウ蛾", "s": 0, "r": "European grapevine moth（ヨーロッパブドウ蛾）／pheromone trap（フェロモントラップ）／integrated pest management（総合的病害虫管理）", "n": "ブドウの果房や果粒を食害する蛾の総称。地域により重要種が異なる。"}, {"no": 176, "f": "病害虫", "h": "grapevine yellows", "i": "/ˈɡreɪpvaɪn ˈjeləʊz/", "p": "名詞句", "g": "グレープバイン・イエロー（ファイトプラズマによる黄化病）", "s": 0, "r": "leafhopper（ヨコバイ）／flavescence dorée（仏：フラヴサンス・ドレ、黄化病の一種）", "n": "ファイトプラズマによるブドウの黄化病の総称。ヨコバイなどの媒介虫や感染苗木で拡散し、葉の黄化や枝の成熟不良、樹勢低下などを引き起こす。"}, {"no": 177, "f": "病害虫", "h": "grey rot", "i": "/ˈɡreɪ ˌrɒt/", "p": "名詞句", "g": "灰色かび病（有害なボトリティス）", "s": 0, "r": "noble rot（貴腐）／botrytis（ボトリティス菌）", "n": "湿潤な条件でボトリティス菌が果実を腐敗させる病害。果実の品質を損なうため、通風を確保し防除する。"}, {"no": 178, "f": "病害虫", "h": "integrated pest management", "i": "/ˈɪntɪˌɡreɪtɪd ˈpɛst ˌmænɪdʒmənt/", "p": "名詞句", "g": "総合的病害虫管理（IPM）", "s": 0, "r": "pheromone trap（フェロモントラップ）／sustainable viticulture（サステナブル栽培）", "n": "病害虫の発生状況を監視し、天敵や農薬など複数の手法を組み合わせて被害を抑える管理方法。農薬の使用削減にもつながる。"}, {"no": 179, "f": "病害虫", "h": "leafhopper", "i": "/ˈliːfˌhɒpə/", "p": "名詞", "g": "ヨコバイ（葉蝉）", "s": 0, "r": "grapevine yellows（グレープバイン・イエロー）／Pierce's disease（ピアス病）", "n": "ブドウの樹液を吸う昆虫。ファイトプラズマなどの病原体を媒介する種類があり、ブドウ栽培では防除が重要となる。"}, {"no": 180, "f": "病害虫", "h": "mite", "i": "/maɪt/", "p": "名詞", "g": "ダニ類", "s": 0, "r": "pest（有害生物）／predatory mite（捕食性ダニ、天敵）", "n": "葉や芽を加害する微小な害虫。ブドウの生育に影響を与えることがあり、種類に応じた防除が必要となる。"}, {"no": 181, "f": "病害虫", "h": "nematode", "i": "/ˈnɛmətoʊd/", "p": "名詞", "g": "線虫", "s": 0, "r": "fanleaf and leafroll virus（ファンリーフ・リーフロール）／rootstock（台木）", "n": "土中でブドウの根を加害する微小な生物。一部はウイルスを媒介し、抵抗性台木などで対策する。"}, {"no": 182, "f": "病害虫", "h": "noble rot", "i": "/ˈnoʊbəl rɒt/", "p": "名詞句", "g": "貴腐", "s": 0, "r": "pourriture noble（仏：貴腐）／botrytis（ボトリティス菌）／grey rot（灰色かび病）", "n": "ボトリティス菌が健全な完熟果に感染した状態。果実の水分が失われ、糖や風味が凝縮して甘口ワインを生む。"}, {"no": 183, "f": "病害虫", "h": "overhead netting", "i": "/ˌoʊvəˈhed ˈnetɪŋ/", "p": "名詞句", "g": "防鳥・防雹ネット（畑の被覆網）", "s": 0, "r": "anti-hail netting（防雹ネット）／bird damage（鳥害）", "n": "鳥や雹などからブドウを守るため、樹冠の上に設置するネット。物理的な防除手段として用いられる。"}, {"no": 184, "f": "病害虫", "h": "pest", "i": "/pɛst/", "p": "名詞", "g": "有害生物・害虫", "s": 0, "r": "integrated pest management（総合的病害虫管理）／mite（ダニ類）／nematode（線虫）", "n": "ブドウ樹に害を与える生物の総称。昆虫・ダニ・線虫などが含まれ、防除は栽培管理の重要課題。"}, {"no": 185, "f": "病害虫", "h": "pheromone capsule", "i": "/ˈferəməʊn ˈkæpsjuːl/", "p": "名詞句", "g": "フェロモンカプセル（交信撹乱で蛾を防除する装置）", "s": 0, "r": "pheromone trap（フェロモントラップ）／mating disruption（交信撹乱）", "n": "雌の性フェロモンを放出し、雄の交尾行動を妨げて害虫の繁殖を抑える装置。交信撹乱による防除に用いられる。"}, {"no": 186, "f": "病害虫", "h": "phylloxera", "i": "/fɪˈlɒksərə/", "p": "名詞", "g": "フィロキセラ", "s": 0, "r": "rootstock（台木）／grafting（接ぎ木）／own-rooted (ungrafted)（自根）", "n": "ブドウの根に寄生して加害する害虫。19世紀に欧州のブドウ畑に甚大な被害を与え、現在は抵抗性台木への接ぎ木が一般的な対策となっている。"}, {"no": 187, "f": "病害虫", "h": "phylloxera-resistant", "i": "/fɪˈlɒksərə rɪˈzɪstənt/", "p": "形容詞", "g": "フィロキセラ耐性の", "s": 0, "r": "phylloxera（フィロキセラ）／rootstock（台木）／ungrafted vine（自根のブドウ樹）", "n": "フィロキセラによる根の被害に耐える性質を持つこと。"}, {"no": 188, "f": "病害虫", "h": "Pierce's disease", "i": "/ˈpɪərsɪz dɪˌziːz/", "p": "名詞句", "g": "ピアス病", "s": 0, "r": "Xylella fastidiosa（病原細菌）／sharpshooter（シャープシューター、媒介昆虫）", "n": "ブドウの細菌性病害。ヨコバイ類などが媒介し、葉の萎凋や枝の枯死を引き起こす。"}, {"no": 189, "f": "病害虫", "h": "powdery mildew", "i": "/ˈpaʊdəri ˈmɪldjuː/", "p": "名詞句", "g": "ウドンコ病", "s": 0, "r": "downy mildew（ベト病）／sulfur spray（硫黄剤散布）", "n": "白い粉状の菌が葉や果実を覆う病害。乾燥した条件でも発生しやすく、果実の生育や品質に影響を及ぼす。"}, {"no": 190, "f": "病害虫", "h": "sharpshooter", "i": "/ˈʃɑːpʃuːtə/", "p": "名詞", "g": "シャープシューター（ヨコバイ類の一種）", "s": 0, "r": "Pierce's disease（ピアス病）／leafhopper（ヨコバイ）", "n": "ブドウ樹の樹液を吸汁するヨコバイ類の一群。ピアス病などの病原体を媒介するものもある。"}, {"no": 191, "f": "病害虫", "h": "trunk disease", "i": "/ˈtrʌŋk dɪˌziːz/", "p": "名詞句", "g": "幹の病気（エスカ等、木質部を侵す病害の総称）", "s": 0, "r": "Esca（エスカ）／eutypa dieback（ユーティパ立枯病）", "n": "エスカやユーティパなど、木質部に感染して樹を衰弱・枯死させる病害の総称。剪定痕などから病原菌が侵入することがある。"}, {"no": 192, "f": "成分・化学", "h": "ABV", "i": "/ˌeɪ biː ˈviː/", "p": "名詞", "g": "アルコール度数（alcohol by volume）", "s": 0, "r": "potential alcohol（潜在アルコール度数）／alcoholic fermentation（アルコール発酵）", "n": "ワインに含まれるアルコールの割合を、容量に対する百分率（%）で示したもの。"}, {"no": 193, "f": "成分・化学", "h": "acetaldehyde", "i": "/ˌæsɪtˈældɪhaɪd/", "p": "名詞", "g": "アセトアルデヒド（酸化やフロールの作用で生じる化合物）", "s": 0, "r": "oxidation（酸化）／flor（フロール、産膜酵母）", "n": "酵母の作用や酸化によって生じる化合物。リンゴ、リンゴの皮、藁、カモミールなどを思わせる香りに寄与する。"}, {"no": 194, "f": "成分・化学", "h": "acetic acid", "i": "/əˌsiːtɪk ˈæsɪd/", "p": "名詞句", "g": "酢酸（揮発酸の主成分）", "s": 0, "r": "volatile acidity（揮発酸）／ethyl acetate（酢酸エチル）", "n": "揮発酸の主要成分。発酵や酸化などによって生成し、過剰になると酢のような香りや味につながる。"}, {"no": 195, "f": "成分・化学", "h": "acidity", "i": "/əˈsɪdəti/", "p": "名詞", "g": "酸（酸度）", "s": 0, "r": "malic acid（リンゴ酸）／tartaric acid（酒石酸）／pH（水素イオン指数）", "n": "酒石酸やリンゴ酸などによる酸味の度合い。ワインに爽やかさと骨格を与え、味わいのバランスや保存性に影響する。"}, {"no": 196, "f": "成分・化学", "h": "anthocyanin", "i": "/ˌænθəˈsaɪənɪn/", "p": "名詞", "g": "アントシアニン（色素）", "s": 0, "r": "phenolics（フェノール類）／colour intensity（色の濃さ）", "n": "黒ブドウの果皮に含まれる赤紫色の色素。発酵中に抽出され赤ワインの色を生み、熟成によって他のフェノール類と結合する。"}, {"no": 197, "f": "成分・化学", "h": "aroma precursor", "i": "/əˈroʊmə prɪˌkɜːrsər/", "p": "名詞句", "g": "香気前駆体", "s": 0, "r": "precursor（前駆体）／thiol（チオール）／aroma compounds（香気化合物）", "n": "そのままでは香りとして現れにくいが、発酵や化学反応などで香気化合物へ変化する物質。"}, {"no": 198, "f": "成分・化学", "h": "Baumé", "i": "/boʊˈmeɪ/", "p": "名詞", "g": "ボーメ度", "s": 0, "r": "Brix（ブリックス糖度）／Oechsle（エクスレ度）／must weight（果汁糖度）", "n": "果汁の比重をもとに糖度や潜在アルコールを推定する尺度。フランスなどで用いられ、収穫時の成熟度の判断に利用される。"}, {"no": 199, "f": "成分・化学", "h": "brettanomyces", "i": "/ˌbrɛtəˈnɒmɪsiːz/", "p": "名詞", "g": "ブレタノマイセス（ブレット）", "s": 0, "r": "fault（欠陥）／yeast（酵母）", "n": "ワイン中で革や馬小屋、薬品などを思わせる香りを生じさせる酵母。過剰になるとワインの欠陥とされる。"}, {"no": 200, "f": "成分・化学", "h": "diacetyl", "i": "/daɪˈæsɪtl/", "p": "名詞", "g": "ダイアセチル（バター香の成分）", "s": 0, "r": "malolactic conversion（マロラクティック発酵）／lactic acid bacteria（乳酸菌）", "n": "マロラクティック発酵などで生成される化合物。バターやクリームを思わせる香りを与え、ワインのスタイルに応じてその量が調整される。"}, {"no": 201, "f": "成分・化学", "h": "ethyl acetate", "i": "/ˌeθaɪl ˈæsɪteɪt/", "p": "名詞句", "g": "酢酸エチル（揮発酸に関わるエステル）", "s": 0, "r": "acetic acid（酢酸）／volatile acidity（揮発酸）", "n": "酢酸とエタノールから生成するエステル。高濃度になると除光液や接着剤を思わせる揮発性の香りを生じる。"}, {"no": 202, "f": "成分・化学", "h": "extract", "i": "/ˈekstrækt/", "p": "名詞", "g": "エキス分（不揮発性成分）", "s": 0, "r": "body（ボディ）／concentration（凝縮感）", "n": "水やアルコールを除いた、糖・酸・ミネラルなどの不揮発性成分。ワインのエキス分を表す指標。"}, {"no": 203, "f": "成分・化学", "h": "glycerol", "i": "/ˈɡlɪsərɒl/", "p": "名詞", "g": "グリセロール（口当たりに関わる多価アルコール）", "s": 0, "r": "mouthfeel（口当たり）／body（ボディ）", "n": "発酵中に酵母によって生成される多価アルコール。わずかな甘みや滑らかな口当たりに寄与する。"}, {"no": 204, "f": "成分・化学", "h": "laccase", "i": "/ˈlækeɪs/", "p": "名詞", "g": "ラッカーゼ（灰色カビ由来の酸化酵素）", "s": 0, "r": "grey rot（灰色カビ病）／oxidation（酸化）", "n": "灰色かび病菌などが産生する酸化酵素。ワイン醸造ではポリフェノールなどを酸化し、色や香味の劣化を引き起こすことがある。"}, {"no": 205, "f": "成分・化学", "h": "lactic acid bacteria", "i": "/ˈlaktɪk ˈasɪd bakˈtɪəriə/", "p": "名詞句", "g": "乳酸菌", "s": 0, "r": "malolactic conversion（マロラクティック発酵）／diacetyl（ダイアセチル）", "n": "マロラクティック発酵を担う細菌。リンゴ酸を乳酸に変換し、酸味を和らげるとともにダイアセチルなどの香味成分を生成する。"}, {"no": 206, "f": "成分・化学", "h": "Maillard reaction", "i": "/maɪˈjɑːr riˌækʃən/", "p": "名詞句", "g": "メイラード反応", "s": 0, "r": "toast（樽の焼き）／caramelization（カラメル化）", "n": "還元糖とアミノ化合物が反応する化学反応。加熱によって進み、パンや焼き菓子、トーストなどを思わせる香りや風味を生む。"}, {"no": 207, "f": "成分・化学", "h": "malic acid", "i": "/ˈmælɪk ˈæsɪd/", "p": "名詞句", "g": "リンゴ酸", "s": 0, "r": "lactic acid（乳酸）／tartaric acid（酒石酸）／malolactic conversion（マロラクティック発酵）", "n": "青リンゴを思わせる酸味を持つ有機酸。マロラクティック発酵で乳酸に変換され、酸味が穏やかになる。"}, {"no": 208, "f": "成分・化学", "h": "mercaptan", "i": "/mɜːˈkæptæn/", "p": "名詞", "g": "メルカプタン（還元臭の原因物質）", "s": 0, "r": "reduction（還元）／volatile sulfur compounds（揮発性硫黄化合物）", "n": "ワインの還元状態で生じる揮発性硫黄化合物の一種。玉ねぎやゴムなどを思わせる不快な香りの原因となる。"}, {"no": 209, "f": "成分・化学", "h": "methoxypyrazine", "i": "/ˌmeθɒksiˈpaɪrəziːn/", "p": "名詞", "g": "メトキシピラジン", "s": 0, "r": "thiol（チオール）／rotundone（ロタンドン）／aroma compounds（香気化合物）", "n": "青ピーマンや草などの特徴的な香りに関与する化合物群。未熟なブドウで高くなりやすい。"}, {"no": 210, "f": "成分・化学", "h": "mousiness", "i": "/ˈmaʊzɪnəs/", "p": "名詞", "g": "マウス臭", "s": 0, "r": "brettanomyces（ブレタノマイセス）／fault（欠陥）／natural wine（自然派ワイン）", "n": "口に含んだ後や飲み込んだ後に、ネズミの巣や穀物を思わせる不快な香味として感じられるワインの欠陥。"}, {"no": 211, "f": "成分・化学", "h": "oak lactone", "i": "/ˈəʊk ˌlæktəʊn/", "p": "名詞句", "g": "オークラクトン（樽由来のココナッツ香成分）", "s": 0, "r": "vanillin（バニリン）／American oak（アメリカンオーク）／barrel toast（樽の焼き）", "n": "オーク材に由来する香気成分で、ココナッツのような香りをもたらす。アメリカンオークに多く含まれる。"}, {"no": 212, "f": "成分・化学", "h": "oxidized", "i": "/ˈɒksɪdaɪzd/", "p": "形容詞", "g": "酸化した", "s": 0, "r": "reductive（還元的な）／oxidation（酸化）／maderisation（マデイラ化）", "n": "酸素との過度な接触により、色や香味が望ましくない方向へ変化した状態。"}, {"no": 213, "f": "成分・化学", "h": "pH", "i": "/ˌpiːˈeɪtʃ/", "p": "名詞", "g": "pH（水素イオン指数）", "s": 0, "r": "acidity（酸度）", "n": "酸性・アルカリ性の度合いを示す数値で、低いほど酸性が強い。色の安定や微生物の制御、SO₂の効果などに影響する重要な指標。"}, {"no": 214, "f": "成分・化学", "h": "phenolic", "i": "/fɪˈnɒlɪk/", "p": "形容詞", "g": "フェノール類の", "s": 0, "r": "phenolics（フェノール類）／tannin（タンニン）／anthocyanin（アントシアニン）", "n": "フェノール類に関する形容詞。タンニンやアントシアニンなどは、ワインの色や渋み、構造、熟成に関与する。"}, {"no": 215, "f": "成分・化学", "h": "phenolic compounds", "i": "/fɪˈnɒlɪk ˈkɒmpaʊndz/", "p": "名詞句", "g": "フェノール化合物", "s": 0, "r": "anthocyanin（アントシアニン）／tannin（タンニン）／phenolic ripeness（フェノール的成熟）", "n": "タンニンやアントシアニンなどを含む化合物群。色・渋み・抗酸化作用に関与し、特に赤ワインの構造や熟成に重要な役割を果たす。"}, {"no": 216, "f": "成分・化学", "h": "precursor", "i": "/priˈkɜːrsər/", "p": "名詞", "g": "前駆体", "s": 0, "r": "aroma（アロマ）／primary aroma（第一アロマ）", "n": "醸造や熟成の過程で別の化合物に変化し、香り成分などの生成につながる物質。品種香の前駆体となるものもある。"}, {"no": 217, "f": "成分・化学", "h": "reductive", "i": "/rɪˈdʌktɪv/", "p": "形容詞", "g": "還元的な", "s": 0, "r": "oxidized（酸化した）／reduction（還元）／volatile sulfur compounds（揮発性硫黄化合物）", "n": "酸素が少ない環境に関連する状態。軽度なら果実香の保持に寄与するが、過度なら硫黄系の不快臭につながる。"}, {"no": 218, "f": "成分・化学", "h": "residual sugar", "i": "/rɪˈzɪdjuəl ˈʃʊɡər/", "p": "名詞句", "g": "残糖", "s": 0, "r": "dry（辛口）／sweet（甘口）", "n": "発酵後にワインに残る糖分。ワインの甘辛度に影響し、発酵の進み具合などによって量が決まる。"}, {"no": 219, "f": "成分・化学", "h": "rotundone", "i": "/roʊˈtʌndoʊn/", "p": "名詞", "g": "ロツンドン（黒胡椒香の成分）", "s": 0, "r": "", "n": "黒胡椒を思わせる香りをもたらす化合物。非常に低い濃度でも強く感じられ、特定の品種や地域のワインに特徴的に見られる。"}, {"no": 220, "f": "成分・化学", "h": "smoke taint", "i": "/ˈsmoʊk ˌteɪnt/", "p": "名詞句", "g": "スモークテイント（煙害）", "s": 0, "r": "fault（欠陥）", "n": "山火事などの煙にさらされたブドウに生じる欠陥。燻製や焦げ、灰を思わせる香りや風味をワインに与える。"}, {"no": 221, "f": "成分・化学", "h": "sugar", "i": "/ˈʃʊɡər/", "p": "名詞", "g": "糖分", "s": 0, "r": "residual sugar（残糖）／must weight（果汁糖度）", "n": "ブドウに含まれる主にブドウ糖と果糖。発酵によってアルコールに変わり、残った糖分はワインの甘味となる。"}, {"no": 222, "f": "成分・化学", "h": "sulfites", "i": "/ˈsʌlfaɪts/", "p": "名詞", "g": "亜硫酸塩類", "s": 0, "r": "sulfur dioxide（二酸化硫黄）", "n": "二酸化硫黄（SO₂）や亜硫酸塩類の総称。一定量以上を含むワインでは、contains sulfites などの表示が義務付けられている。"}, {"no": 223, "f": "成分・化学", "h": "tannin", "i": "/ˈtænɪn/", "p": "名詞", "g": "タンニン", "s": 0, "r": "astringency（渋み）／phenolics（フェノール類）", "n": "果皮・種・果梗や樽に由来するフェノール化合物。渋みと骨格を与え、赤ワインの熟成に関与する。"}, {"no": 224, "f": "成分・化学", "h": "tartaric acid", "i": "/tɑːrˈtærɪk ˈæsɪd/", "p": "名詞句", "g": "酒石酸", "s": 0, "r": "malic acid（リンゴ酸）／tartrate（酒石酸塩）", "n": "ブドウに多く含まれる主要な酸。ワインの酸度を支え、低温でカリウムなどと結合して酒石の結晶を生じることがある。"}, {"no": 225, "f": "成分・化学", "h": "terpene", "i": "/ˈtɜːpiːn/", "p": "名詞", "g": "テルペン（花や柑橘の香りをもたらす香気成分）", "s": 0, "r": "thiol（チオール）／rotundone（ロタンドン）／aroma compounds（香気成分）", "n": "マスカットやリースリングなどの花・柑橘香に寄与する香気成分。linalool（リナロール）やgeraniol（ゲラニオール）が代表例である。"}, {"no": 226, "f": "成分・化学", "h": "thiol", "i": "/θaɪˈɒl/", "p": "名詞", "g": "チオール", "s": 0, "r": "aroma precursor（香気前駆体）／volatile sulfur compounds（揮発性硫黄化合物）／methoxypyrazine（メトキシピラジン）", "n": "硫黄を含む揮発性化合物の一群。特定のチオールは、パッションフルーツや柑橘類などの香りに関与する。"}, {"no": 227, "f": "成分・化学", "h": "trichloroanisole", "i": "/ˌtraɪklɔːrəʊˈænɪsəʊl/", "p": "名詞", "g": "トリクロロアニソール（TCA・コルク臭の主な原因物質）", "s": 0, "r": "cork taint（コルク汚染）／corked（ブショネの）", "n": "コルク臭（cork taint）の主な原因物質。ごく微量でも湿った段ボールやカビを思わせる臭いを生じ、果実香を覆い隠す。"}, {"no": 228, "f": "成分・化学", "h": "vanillin", "i": "/vəˈnɪlɪn/", "p": "名詞", "g": "バニリン", "s": 0, "r": "oak lactone（オークラクトン）／toast（トースト・樽焼き）", "n": "オーク材をトーストすることで生成・放出される芳香成分。ワインにバニラ様の甘い香りを与える。"}, {"no": 229, "f": "成分・化学", "h": "volatile phenols", "i": "/ˈvɒlətaɪl ˈfiːnoʊlz/", "p": "名詞句", "g": "揮発性フェノール", "s": 0, "r": "brettanomyces（ブレタノマイセス）／smoke taint（煙による汚染）／phenolic compounds（フェノール化合物）", "n": "揮発性を持つフェノール化合物の一群。Brettanomycesによる馬小屋や革などの香りに関与する。"}, {"no": 230, "f": "成分・化学", "h": "volatile sulfur compounds", "i": "/ˈvɒlətaɪl ˈsʌlfər ˌkɒmpaʊndz/", "p": "名詞句", "g": "揮発性硫黄化合物", "s": 0, "r": "reduction（還元臭）／hydrogen sulfide（硫化水素）", "n": "発酵や還元的な条件などで生じる揮発性の硫黄化合物。種類や濃度によって、硫黄、卵、ゴムなどを思わせる香りを生じる。"}, {"no": 231, "f": "醸造", "h": "acidification", "i": "/əˌsɪdɪfɪˈkeɪʃən/", "p": "名詞", "g": "補酸", "s": 0, "r": "de-acidification（除酸）／tartaric acid（酒石酸）", "n": "酸の不足した果汁やワインに酒石酸などを加える操作。温暖地で均衡を保つため行われる調整。"}, {"no": 232, "f": "醸造", "h": "alcoholic fermentation", "i": "/ˌælkəˈhɒlɪk ˌfɜːrmɛnˈteɪʃən/", "p": "名詞句", "g": "アルコール発酵", "s": 0, "r": "yeast（酵母）／malolactic conversion（マロラクティック発酵）", "n": "酵母が糖を消費しエタノールと熱・炭酸ガスを生む反応。ワイン造りの根幹となる第一の発酵。"}, {"no": 233, "f": "醸造", "h": "ambient yeast", "i": "/ˈæmbiənt jiːst/", "p": "名詞句", "g": "自然酵母（野生酵母）", "s": 0, "r": "cultured yeast（培養酵母）／natural wine（ナチュラルワイン）／native yeast（土着酵母・同義）", "n": "畑や醸造所にもともと棲む酵母。複雑さを生む一方で発酵が不安定になりやすく管理を要する。"}, {"no": 234, "f": "醸造", "h": "aroma compounds", "i": "/əˈroʊmə ˈkɒmpaʊndz/", "p": "名詞句", "g": "香気化合物", "s": 0, "r": "ester（エステル）／thiol（チオール）／aroma precursor（香気前駆体）", "n": "ワインの香りに寄与する揮発性化合物の総称。ブドウ、発酵、熟成などさまざまな由来がある。"}, {"no": 235, "f": "醸造", "h": "ascorbic acid", "i": "/əˌskɔːrbɪk ˈæsɪd/", "p": "名詞句", "g": "アスコルビン酸（ビタミンC、酸化防止剤）", "s": 0, "r": "sulfur dioxide（二酸化硫黄）／oxidation（酸化）", "n": "SO₂と併用される酸化防止剤。酸素と反応して酸化を抑えるが、単独使用では酸化を促すことがある。"}, {"no": 236, "f": "醸造", "h": "assemblage", "i": "/asɑ̃ˈblaʒ/", "p": "名詞", "g": "アッサンブラージュ（ワインのブレンド作業）", "s": 0, "r": "blending（ブレンド）／cuvée（キュヴェ）", "n": "異なる品種・区画・ロットなどのワインを組み合わせ、最終的な味わいやスタイルを決める工程。"}, {"no": 237, "f": "醸造", "h": "autolysis", "i": "/ɔːˈtɒlɪsɪs/", "p": "名詞", "g": "自己分解（オートリシス）", "s": 0, "r": "yeast autolysis（酵母の自己分解）", "n": "死んだ酵母が分解され成分を放出する現象。パンや酵母様の風味とコクを与え質感を豊かにする。"}, {"no": 238, "f": "醸造", "h": "basket press", "i": "/ˈbɑːskɪt ˌpres/", "p": "名詞句", "g": "バスケットプレス（垂直式圧搾機）", "s": 0, "r": "pneumatic press（空気圧式プレス）／pressing（圧搾）", "n": "果実をかご状の容器に入れ、上から圧力をかけて搾る垂直式の圧搾機。比較的穏やかに圧搾できる。"}, {"no": 239, "f": "醸造", "h": "bentonite", "i": "/ˈbɛntənaɪt/", "p": "名詞", "g": "ベントナイト（清澄用粘土）", "s": 0, "r": "fining（清澄）／protein stability（タンパク質安定性）／protein haze（タンパク混濁）", "n": "タンパク質を吸着除去する粘土系清澄剤。白ワインのタンパク混濁防止に広く使われ、動物由来ではない。"}, {"no": 240, "f": "醸造", "h": "bleeding", "i": "/ˈbliːdɪŋ/", "p": "名詞", "g": "果汁抜き（セニエ）", "s": 0, "r": "saignée（セニエ）／rosé de saignée（ロゼ・ド・セニエ）／free-run juice（フリーラン果汁）", "n": "発酵前後の果醪から果汁の一部を抜き取る操作。赤ワインの濃縮やロゼ造りに利用される。"}, {"no": 241, "f": "醸造", "h": "blending", "i": "/ˈblɛndɪŋ/", "p": "名詞", "g": "ブレンド（アッサンブラージュ）", "s": 0, "r": "assemblage（アッサンブラージュ）／cuvée（キュヴェ）", "n": "複数の区画・品種・樽などのワインを組み合わせ、最終的な味わいやスタイルを整える作業。"}, {"no": 242, "f": "醸造", "h": "bottle matured", "i": "/ˌbɒtl̩ məˈtjʊəd/", "p": "名詞句", "g": "瓶内熟成", "s": 0, "r": "maturation（熟成）／late release（レイトリリース）", "n": "ワインを瓶詰め後、出荷まで瓶内で熟成させること。瓶内で熟成が進み、澱が生じることもある。"}, {"no": 243, "f": "醸造", "h": "bottling", "i": "/ˈbɒtlɪŋ/", "p": "名詞", "g": "瓶詰め", "s": 0, "r": "estate bottled（エステート瓶詰め）／closure（栓）", "n": "完成したワインを瓶に詰め、密封する最終工程。酸素や微生物の影響を抑え、品質を保つための管理が重要となる。"}, {"no": 244, "f": "醸造", "h": "Brix", "i": "/brɪks/", "p": "名詞", "g": "ブリックス（糖度指標）", "s": 0, "r": "must weight（マストウェイト・果汁糖度）／potential alcohol（潜在アルコール）／Oechsle（エクスレ度）", "n": "果汁中の可溶性固形分を示す尺度。ブドウでは主に糖度の目安として使われる。"}, {"no": 245, "f": "醸造", "h": "bâtonnage", "i": "/batɔˈnaʒ/", "p": "名詞", "g": "バトナージュ（澱かき混ぜ）", "s": 0, "r": "lees stirring（澱かき混ぜ）／sur lie（シュル・リー）", "n": "発酵後の細かな澱をワイン中で撹拌する作業。澱との接触を促し、ワインに厚みや複雑さを与える。"}, {"no": 246, "f": "醸造", "h": "cap", "i": "/kæp/", "p": "名詞", "g": "果帽（キャップ）", "s": 0, "r": "cap management／punch down／pump over", "n": "赤ワインの発酵中、果皮などの固形物が炭酸ガスで液面に押し上げられて形成される層。抽出を促すため管理される。"}, {"no": 247, "f": "醸造", "h": "cap management", "i": "/ˈkæp ˌmænɪdʒmənt/", "p": "名詞句", "g": "果帽管理（キャップマネジメント）", "s": 0, "r": "punch down（ピジャージュ）／pump over（ルモンタージュ）／rack and return", "n": "発酵中の果帽を管理する作業の総称。パンチダウンやポンプオーバーで色・タンニンの抽出や温度調整を行う。"}, {"no": 248, "f": "醸造", "h": "capsule", "i": "/ˈkæpsjuːl/", "p": "名詞", "g": "キャップシール", "s": 0, "r": "cork（コルク）／closure（クロージャー・栓）", "n": "瓶口と栓を覆う金属・樹脂製のカバー。装飾や栓の保護を目的とし、foil とも呼ばれる。"}, {"no": 249, "f": "醸造", "h": "carbonic maceration", "i": "/kɑːrˈbɒnɪk ˌmæsəˈreɪʃən/", "p": "名詞句", "g": "炭酸ガス浸透法", "s": 0, "r": "intracellular fermentation（細胞内発酵）／semi-carbonic maceration（半炭酸ガス浸透法）", "n": "破砕していない果実を炭酸ガス下で果粒内（細胞内）発酵させる手法。色鮮やかで果実味豊かな赤ワインを生む。"}, {"no": 250, "f": "醸造", "h": "casein", "i": "/ˈkeɪsiːn/", "p": "名詞", "g": "カゼイン（乳由来の清澄剤）", "s": 0, "r": "fining（清澄）／gelatin（ゼラチン）／isinglass（アイシングラス）", "n": "牛乳由来のタンパク質系清澄剤。白ワインなどの褐変や酸化に関与するフェノール化合物の除去に用いられる。"}, {"no": 251, "f": "醸造", "h": "chaptalisation", "i": "/ˌʃæptəlaɪˈzeɪʃən/", "p": "名詞", "g": "補糖（シャプタリゼーション）", "s": 0, "r": "enrichment（エンリッチメント）／sugar（糖分）", "n": "発酵前の果汁に糖を加えアルコール度を高める操作。冷涼地で行われ法律で規制されることが多い。"}, {"no": 252, "f": "醸造", "h": "clarification", "i": "/ˌklærɪfɪˈkeɪʃən/", "p": "名詞", "g": "清澄化処理", "s": 0, "r": "fining（清澄）／filtration（ろ過）", "n": "浮遊物を除きワインを澄ませる工程。沈殿法・清澄剤・ろ過などで濁りを取り外観と安定を整える。"}, {"no": 253, "f": "醸造", "h": "closure", "i": "/ˈkloʊʒər/", "p": "名詞", "g": "栓（クロージャー）", "s": 0, "r": "screwcap（スクリューキャップ）／technical cork（テクニカルコルク）", "n": "瓶を密封する栓の総称。天然コルク・スクリューキャップ・合成栓などがあり熟成や品質保持に関わる。"}, {"no": 254, "f": "醸造", "h": "co-fermentation", "i": "/ˌkəʊfɜːmenˈteɪʃən/", "p": "名詞", "g": "混醸（複数品種を一緒に発酵させること）", "s": 0, "r": "field blend（混植畑ブレンド）／blending（ブレンド）", "n": "異なる品種を同じ容器で一緒に発酵させる手法。赤ワインに少量の白ブドウを加える例が多く、コート・ロティのシラーとヴィオニエの共発酵が有名。"}, {"no": 255, "f": "醸造", "h": "cold soak", "i": "/koʊld soʊk/", "p": "名詞句", "g": "低温浸漬（コールドソーク）", "s": 0, "r": "maceration（醸し）／extraction（抽出）", "n": "発酵前に低温で果皮を浸す工程。アルコールなしで色と香りを穏やかに引き出す赤の抽出技法。"}, {"no": 256, "f": "醸造", "h": "cold stabilisation", "i": "/koʊld ˌsteɪbɪlaɪˈzeɪʃən/", "p": "名詞句", "g": "冷却安定化（酒石安定）", "s": 0, "r": "tartaric acid（酒石酸）／stabilisation（安定化）", "n": "低温で酒石結晶を先に析出させて除く処理。瓶内での結晶発生を防ぐために行われる安定化技法。"}, {"no": 257, "f": "醸造", "h": "cork", "i": "/kɔːrk/", "p": "名詞", "g": "コルク（栓）", "s": 0, "r": "cork taint（コルク臭）／screwcap（スクリューキャップ）／closure（クロージャー・栓）", "n": "コルク樫の樹皮から作る伝統的なワイン栓。微量の酸素透過により、瓶内での熟成に影響を与える。"}, {"no": 258, "f": "醸造", "h": "cork taint", "i": "/kɔːrk teɪnt/", "p": "名詞句", "g": "コルク臭（ブショネ）", "s": 0, "r": "fault（欠陥）／screwcap（スクリューキャップ）", "n": "主にTCAによる、濡れた段ボールやカビを思わせる異臭。果実味を覆い隠す代表的なワインの欠陥。"}, {"no": 259, "f": "醸造", "h": "cross-flow filtration", "i": "/ˌkrɒsfləʊ fɪlˈtreɪʃən/", "p": "名詞句", "g": "クロスフロー濾過", "s": 0, "r": "membrane filtration（膜濾過）／sterile filtration（無菌濾過）", "n": "液を膜面に平行に流しながら濾過する方式。目詰まりを抑え、効率よくワインを清澄・濾過できる。"}, {"no": 260, "f": "醸造", "h": "crushing", "i": "/ˈkrʌʃɪŋ/", "p": "名詞", "g": "破砕", "s": 0, "r": "pressing（圧搾）／destemming（除梗）", "n": "ブドウの果皮を軽く割り果汁を出す作業。除梗と合わせて行われ、発酵前の醪を準備する工程。"}, {"no": 261, "f": "醸造", "h": "cryoextraction", "i": "/ˌkraɪoʊɪkˈstrækʃən/", "p": "名詞", "g": "クリオエクストラクション（人工凍結による果汁濃縮）", "s": 0, "r": "ice wine（アイスワイン）／pressing（圧搾）", "n": "収穫したブドウを人工的に凍らせて圧搾し、水分を氷として分離して糖度の高い果汁を得る技術。天然凍結を利用するアイスワインとは異なる。"}, {"no": 262, "f": "醸造", "h": "cultured yeast", "i": "/ˈkʌltʃərd jiːst/", "p": "名詞句", "g": "培養酵母", "s": 0, "r": "ambient yeast（自然酵母）／yeast（酵母）", "n": "選抜され市販される酵母。発酵を確実に進め狙った香りを引き出しやすく、再現性の高さが利点。"}, {"no": 263, "f": "醸造", "h": "de-acidification", "i": "/diːəˌsɪdɪfɪˈkeɪʃən/", "p": "名詞", "g": "除酸（酸を低減する処理）", "s": 0, "r": "acidification（補酸）", "n": "過剰な酸を低減するための処理。主に寒冷地など、酸度が高くなりやすい地域で用いられる。"}, {"no": 264, "f": "醸造", "h": "dealcoholization", "i": "/diːˌælkəhɒlaɪˈzeɪʃən/", "p": "名詞", "g": "アルコール除去（脱アルコール）", "s": 0, "r": "dealcoholized wine（脱アルコールワイン）／low-alcohol wine（低アルコールワイン）", "n": "完成したワインからアルコールを除く技術。低・無アルコールワインの製造に用いられる。"}, {"no": 265, "f": "醸造", "h": "destemming", "i": "/diːˈstɛmɪŋ/", "p": "名詞", "g": "除梗", "s": 0, "r": "crushing（破砕）／whole bunch（全房）／destemmer（除梗機）", "n": "果房から果梗（軸）を取り除く作業。果梗由来の青い風味や過度な渋みを抑えるために行われる。"}, {"no": 266, "f": "醸造", "h": "diatomaceous earth filter", "i": "/ˌdaɪətəˈmeɪʃəs ˈɜːθ ˌfɪltə/", "p": "名詞句", "g": "珪藻土フィルター（珪藻土を濾材に使う濾過装置）", "s": 0, "r": "filtration（ろ過）", "n": "珪藻の化石殻を濾材に用いる濾過装置。ワインの濁りや微粒子を除くために用いられる。"}, {"no": 267, "f": "醸造", "h": "direct pressing", "i": "/dɪˌrekt ˈpresɪŋ/", "p": "名詞句", "g": "ダイレクトプレス（直接圧搾。淡色ロゼの製法）", "s": 0, "r": "saignée（セニエ）／pressing（圧搾）", "n": "黒ブドウを収穫後すぐに圧搾し、果皮との接触を最小限にして淡い色調のロゼを造る手法。"}, {"no": 268, "f": "醸造", "h": "délestage", "i": "/de.le.staʒ/", "p": "名詞", "g": "デレスタージュ", "s": 0, "r": "rack and return（ラック・アンド・リターン）／pumping over（ポンピングオーバー・液循環）／punching down（櫂入れ）", "n": "発酵槽から果汁を抜き、果帽を崩した後に果汁を戻す抽出・酸素供給の技法。"}, {"no": 269, "f": "醸造", "h": "enrichment", "i": "/ɪnˈrɪtʃmənt/", "p": "名詞", "g": "エンリッチメント（アルコール増強）", "s": 0, "r": "chaptalisation（補糖）／Rectified Concentrated Grape Must (RCGM)（精製濃縮果汁）／concentrated grape must（濃縮果汁）", "n": "発酵可能な糖分を加えてアルコール度を高める処理の総称。補糖（chaptalisation）が代表的な方法。"}, {"no": 270, "f": "醸造", "h": "ester", "i": "/ˈestər/", "p": "名詞", "g": "エステル", "s": 0, "r": "aroma compounds（香気化合物）／ethyl acetate（酢酸エチル）／primary aroma（第一アロマ）", "n": "アルコールと酸などから生成する揮発性化合物。発酵由来の果実様香に寄与するものが多い。"}, {"no": 271, "f": "醸造", "h": "extended maceration", "i": "/ɪkˈstendɪd ˌmæsəˈreɪʃən/", "p": "名詞句", "g": "長期浸漬", "s": 0, "r": "post-fermentation maceration（発酵後浸漬）／pre-fermentation maceration（発酵前浸漬）／tannin（タンニン）", "n": "発酵後も果皮・種子との接触を続け、色やタンニンなどの抽出を進める方法。"}, {"no": 272, "f": "醸造", "h": "extraction", "i": "/ɪkˈstrækʃən/", "p": "名詞", "g": "抽出", "s": 0, "r": "maceration（醸し）／cap management（果帽管理）／phenolic extraction（フェノール抽出）", "n": "果皮や種から色素・タンニンなどを引き出すこと。抽出の程度はワインの色・渋み・風味に影響する。"}, {"no": 273, "f": "醸造", "h": "fault", "i": "/fɔːlt/", "p": "名詞", "g": "欠陥（ワインの品質を損なう状態）", "s": 0, "r": "cork taint（コルク臭）／volatile acidity（揮発酸）／reduction（還元臭）", "n": "ワインの品質を損なう好ましくない風味や状態。"}, {"no": 274, "f": "醸造", "h": "fermentation", "i": "/ˌfɜːrmɛnˈteɪʃən/", "p": "名詞", "g": "発酵", "s": 0, "r": "alcoholic fermentation（アルコール発酵）／yeast（酵母）", "n": "微生物の働きによって糖などが変換される過程。ワインでは主にアルコール発酵を指す。"}, {"no": 275, "f": "醸造", "h": "filtration", "i": "/fɪlˈtreɪʃən/", "p": "名詞", "g": "ろ過", "s": 0, "r": "sterile filtration（無菌ろ過）", "n": "フィルターを通して固形物や微生物を取り除く操作。ワインの清澄化や微生物的安定化に用いられる。"}, {"no": 276, "f": "醸造", "h": "fine lees", "i": "/faɪn liːz/", "p": "名詞句", "g": "細かい澱", "s": 0, "r": "gross lees（粗い澱）／lees stirring（澱の撹拌）／sur lie（シュール・リー）", "n": "主に死んだ酵母細胞などからなる細かな澱。熟成中に残すことで質感や複雑さに寄与することがある。"}, {"no": 277, "f": "醸造", "h": "fining", "i": "/ˈfaɪnɪŋ/", "p": "名詞", "g": "清澄（清澄剤による処理）", "s": 0, "r": "filtration（ろ過）／clarification（清澄化処理）／fining agent（清澄剤）", "n": "清澄剤を加えて不要な微粒子やフェノール類などを除去し、ワインを清澄化する処理。"}, {"no": 278, "f": "醸造", "h": "flash détente", "i": "/ˌflæʃ deɪˈtɑ̃t/", "p": "名詞句", "g": "フラッシュ・デタント（加熱・急減圧による抽出技術）", "s": 0, "r": "thermovinification（サーモヴィニフィケーション）／extraction（抽出）", "n": "加熱したブドウを急速に減圧して細胞を破壊し、色素や果実香を抽出する技術。タンニンの抽出を抑えやすい。"}, {"no": 279, "f": "醸造", "h": "flocculation", "i": "/ˌflɒkjʊˈleɪʃən/", "p": "名詞", "g": "凝集（澱が塊状にまとまる現象）", "s": 0, "r": "lees（澱）／clarification（清澄化処理）／sedimentation（沈降）", "n": "酵母などの微粒子が互いに凝集して塊状になる現象。澱の沈降や除去を促す。"}, {"no": 280, "f": "醸造", "h": "flotation", "i": "/fləʊˈteɪʃn̩/", "p": "名詞", "g": "フローテーション（浮上法による清澄）", "s": 0, "r": "clarification（清澄化処理）／sedimentation（沈降）／centrifugation（遠心分離）", "n": "気泡を利用して果汁中の固形分を浮上させ、除去する清澄法。発酵前の果汁清澄に用いられる。"}, {"no": 281, "f": "醸造", "h": "fortification", "i": "/ˌfɔːrtɪfɪˈkeɪʃən/", "p": "名詞", "g": "酒精強化", "s": 0, "r": "fortifying spirit（酒精強化用スピリッツ）／grape spirit（グレープスピリッツ）", "n": "発酵中または発酵後にスピリッツを加えてアルコール度数を高める操作。発酵を止めて甘味を残す目的でも用いられる。"}, {"no": 282, "f": "醸造", "h": "free-run juice", "i": "/ˈfriːrʌn dʒuːs/", "p": "名詞句", "g": "フリーラン果汁", "s": 0, "r": "press wine（プレスワイン）／press fraction（プレス画分）／pressing（圧搾）", "n": "ブドウを圧搾する前に、自重によって自然に流れ出る果汁。圧搾果汁とは区別して扱われる。"}, {"no": 283, "f": "醸造", "h": "gelatin", "i": "/ˈdʒɛlətɪn/", "p": "名詞", "g": "ゼラチン（動物性の清澄剤）", "s": 0, "r": "fining（清澄）／isinglass（アイシングラス）／casein（カゼイン）", "n": "動物由来のタンパク質系清澄剤。タンニンなどのフェノール化合物と結合して沈殿させ、ワインの渋味や濁りを取り除く。"}, {"no": 284, "f": "醸造", "h": "gross lees", "i": "/ɡroʊs liːz/", "p": "名詞句", "g": "粗い澱", "s": 0, "r": "fine lees（細かい澱）／racking（澱引き）／settling（沈降・静置清澄）", "n": "発酵後に沈む果皮片や酵母などを含む比較的大きな粒子の澱。"}, {"no": 285, "f": "醸造", "h": "half bottle", "i": "/ˈhɑːf ˈbɒtl/", "p": "名詞句", "g": "ハーフボトル（375ml）", "s": 0, "r": "magnum（マグナム）", "n": "通常瓶（750mL）の半分の容量。通常瓶より熟成が速く進みやすく、レストランや甘口ワインなどで用いられる。"}, {"no": 286, "f": "醸造", "h": "hyperoxidation", "i": "/ˌhaɪpərˌɒksɪˈdeɪʃən/", "p": "名詞", "g": "過剰酸化（意図的な酸化処理）", "s": 0, "r": "oxidation（酸化）／protective winemaking（保護的醸造）／phenolic compounds（フェノール化合物）", "n": "果汁を発酵前に意図的に酸化させ、酸化しやすいフェノール類を除去して、後の酸化を抑える技術。"}, {"no": 287, "f": "醸造", "h": "inert gas", "i": "/ɪˈnɜːt ˌɡæs/", "p": "名詞句", "g": "不活性ガス（酸化を防ぐ保護ガス）", "s": 0, "r": "protective winemaking（保護的醸造）／oxidation（酸化）", "n": "窒素やアルゴンなどで果汁やワインを酸素から守る保護ガス。酸化を抑え、果実味を保つために用いられる。"}, {"no": 288, "f": "醸造", "h": "intracellular fermentation", "i": "/ˌɪntrəˈseljələr ˌfɜːrmenˈteɪʃən/", "p": "名詞句", "g": "細胞内発酵", "s": 0, "r": "carbonic maceration（炭酸ガス浸透法）／semi-carbonic maceration（半炭酸ガス浸透法）／whole-cluster fermentation（全房発酵）", "n": "炭酸ガス浸漬で果粒内の酵素反応により進む発酵。アルコール発酵とは異なる初期段階の代謝を指す。"}, {"no": 289, "f": "醸造", "h": "isinglass", "i": "/ˈaɪzɪŋɡlæs/", "p": "名詞", "g": "アイシングラス（魚の浮袋由来の清澄剤）", "s": 0, "r": "fining（清澄）／gelatin（ゼラチン）／casein（カゼイン）", "n": "チョウザメなどの魚の浮袋から得られるコラーゲン系清澄剤。主に白ワインの濁りや浮遊物を除去し、透明度を高める。"}, {"no": 290, "f": "醸造", "h": "jeroboam", "i": "/ˌdʒɛrəˈboʊəm/", "p": "名詞", "g": "ジェロボアム（大型瓶）", "s": 0, "r": "magnum（マグナム）／half bottle（ハーフボトル）", "n": "スパークリングで3L（標準4本分）、スティルでは4.5Lに当たる大型瓶。大瓶ほど熟成は緩やかとされる。"}, {"no": 291, "f": "醸造", "h": "lactic acid", "i": "/ˈlæktɪk ˈæsɪd/", "p": "名詞", "g": "乳酸", "s": 0, "r": "malic acid（リンゴ酸）／malolactic conversion（マロラクティック発酵）／lactic acid bacteria（乳酸菌）", "n": "MLFでリンゴ酸から生成される酸。リンゴ酸より穏やかな酸味を持つ。"}, {"no": 292, "f": "醸造", "h": "lees", "i": "/liːz/", "p": "名詞", "g": "澱（オリ）", "s": 0, "r": "sur lie（シュル・リー）／racking（澱引き）／autolysis（自己分解）", "n": "発酵後に沈む死んだ酵母などの沈殿物。接触を保つと旨味やコクが増し、質感に厚みを与える。"}, {"no": 293, "f": "醸造", "h": "lees contact", "i": "/liːz ˈkɒntækt/", "p": "名詞句", "g": "澱との接触", "s": 0, "r": "lees ageing（澱との熟成）／bâtonnage（バトナージュ・澱の撹拌）／autolysis（自己分解）", "n": "発酵後のワインを澱と接触させて熟成すること。質感や複雑さを高める目的で行われる。"}, {"no": 294, "f": "醸造", "h": "lees stirring", "i": "/liːz ˈstɜːrɪŋ/", "p": "名詞句", "g": "バトナージュ（澱かき混ぜ）", "s": 0, "r": "bâtonnage（バトナージュ）／sur lie（シュル・リー）／lees（澱）", "n": "沈んだ澱を定期的に撹拌し果汁と接触させる作業。旨味と質感を高め酸化も適度に促す技法。"}, {"no": 295, "f": "醸造", "h": "maceration", "i": "/ˌmæsəˈreɪʃən/", "p": "名詞", "g": "醸し（マセラシオン）", "s": 0, "r": "skin contact（果皮浸漬）／extraction（抽出）", "n": "果皮や種などを果汁に接触させ、色・タンニン・香りなどを抽出する工程。"}, {"no": 296, "f": "醸造", "h": "magnum", "i": "/ˈmæɡnəm/", "p": "名詞", "g": "マグナム（1.5Lボトル）", "s": 0, "r": "half bottle（ハーフボトル）／punt（パント）", "n": "通常瓶2本分の大型ボトル。液量に対する酸素接触の割合が小さく、通常瓶より熟成がゆっくり進むとされる。"}, {"no": 297, "f": "醸造", "h": "malolactic conversion", "i": "/ˌmæloʊˈlæktɪk kənˈvɜːrʒən/", "p": "名詞句", "g": "マロラクティック発酵（MLF）", "s": 0, "r": "malic acid（リンゴ酸）／lactic acid bacteria（乳酸菌）／diacetyl（ダイアセチル）", "n": "乳酸菌がリンゴ酸を乳酸に変換する工程。酸味を和らげ、口当たりをまろやかにする。"}, {"no": 298, "f": "醸造", "h": "maturation", "i": "/ˌmætʃəˈreɪʃən/", "p": "名詞", "g": "熟成", "s": 0, "r": "barrel ageing（樽熟成）／lees ageing（澱熟成）／bottle maturation（瓶熟成）", "n": "ワインを一定期間寝かせ、風味や香りを発達・変化させる工程。樽、槽、瓶などで行われる。"}, {"no": 299, "f": "醸造", "h": "membrane filtration", "i": "/ˈmembreɪn fɪlˈtreɪʃən/", "p": "名詞句", "g": "膜濾過", "s": 0, "r": "sterile filtration（無菌濾過）／filtration（濾過）／diatomaceous earth filter（珪藻土濾過機）", "n": "膜の孔径を利用して粒子や微生物を除去する濾過方法。"}, {"no": 300, "f": "醸造", "h": "micro-oxygenation", "i": "/ˌmaɪkroʊ ˌɒksɪdʒəˈneɪʃən/", "p": "名詞句", "g": "微量酸素添加", "s": 0, "r": "oxidation（酸化）／oak alternatives（オーク代替材）", "n": "微量の酸素を計画的に供給する技術。タンニンを和らげ、色調を安定させるために用いられる。"}, {"no": 301, "f": "醸造", "h": "microbial stability", "i": "/maɪˈkroʊbiəl stəˈbɪləti/", "p": "名詞句", "g": "微生物安定性", "s": 0, "r": "sterile filtration（無菌濾過）／sulfur dioxide（二酸化硫黄）／sterile bottling（無菌瓶詰め）", "n": "瓶詰め後に酵母や細菌が増殖せず、再発酵や品質劣化を起こしにくい状態。"}, {"no": 302, "f": "醸造", "h": "must", "i": "/mʌst/", "p": "名詞", "g": "果醪（マスト）", "s": 0, "r": "free-run juice（フリーラン果汁）／must weight（果汁糖度）", "n": "破砕・圧搾したブドウから得られる果汁。赤ワインでは果皮や種子を含む発酵中の果醪を指すこともある。"}, {"no": 303, "f": "醸造", "h": "must adjustment", "i": "/mʌst əˈdʒʌstmənt/", "p": "名詞句", "g": "果汁調整", "s": 0, "r": "chaptalisation（補糖）／acidification（補酸）／de-acidification（除酸）", "n": "発酵前の果汁の糖・酸などを調整する処理の総称。"}, {"no": 304, "f": "醸造", "h": "must weight", "i": "/mʌst weɪt/", "p": "名詞句", "g": "果汁糖度（マスト濃度）", "s": 0, "r": "must（果汁・マスト）／sugar（糖分）／ripeness（成熟度）", "n": "ブドウ果汁の比重・密度を示す指標。糖度や潜在アルコール度の推定、収穫時期の判断に用いられる。"}, {"no": 305, "f": "醸造", "h": "natural wine", "i": "/ˈnætʃrəl waɪn/", "p": "名詞句", "g": "ナチュラルワイン（介入を極力抑えて造るワイン）", "s": 0, "r": "ambient yeast（自然酵母）／organic viticulture（有機栽培）／low-intervention winemaking（低介入醸造）", "n": "醸造上の介入や添加をできるだけ抑えて造るワイン。明確な国際的統一定義はない。"}, {"no": 306, "f": "醸造", "h": "neck", "i": "/nɛk/", "p": "名詞", "g": "ネック（瓶の首）", "s": 0, "r": "shoulder（瓶の肩）／capsule（キャップシール）", "n": "瓶の細くなった部分。熟成中の液面（ullage）の位置を確認する目安にもなる。"}, {"no": 307, "f": "醸造", "h": "nutrient", "i": "/ˈnuːtriənt əˈdɪʃən/", "p": "名詞句", "g": "栄養分（栄養剤）", "s": 0, "r": "stuck fermentation（発酵停止）／yeast（酵母）／must adjustment（果汁調整）", "n": "酵母の健全な発酵を支えるために必要な栄養分。窒素源などを指す。"}, {"no": 308, "f": "醸造", "h": "Oechsle", "i": "/ˈœkslə/", "p": "名詞", "g": "エクスレ度（ドイツの果汁比重単位）", "s": 0, "r": "Brix（ブリックス糖度）／Baumé（ボーメ度）／must weight（果汁糖度）", "n": "果汁の比重に基づくドイツの糖度指標。肩書き等級の基準に用いられ、考案者の名に由来する。"}, {"no": 309, "f": "醸造", "h": "optical sorting", "i": "/ˌɒptɪkəl ˈsɔːrtɪŋ/", "p": "名詞句", "g": "光学選果（オプティカルソーティング）", "s": 0, "r": "sorting table（選果台）／sorting（選果）／destemming（除梗）", "n": "センサーでブドウの色や形状などを判別し、基準外の果粒を自動的に除去する選果方法。"}, {"no": 310, "f": "醸造", "h": "orange wine", "i": "/ˈɒrɪndʒ ˌwaɪn/", "p": "名詞句", "g": "オレンジワイン（白ブドウを果皮とともに醸造したワイン）", "s": 0, "r": "skin contact（果皮浸漬）／amber（アンバー）", "n": "白ブドウを果皮とともに発酵・醸造するワイン。果皮由来の色やタンニンが抽出され、アンバー色になることが多い。"}, {"no": 311, "f": "醸造", "h": "oxidation", "i": "/ˌɒksɪˈdeɪʃən/", "p": "名詞", "g": "酸化", "s": 0, "r": "reduction（還元）／oxidative ageing（酸化熟成）／oxidative winemaking（酸化的醸造）", "n": "酸素との反応によってワインの色や香り、風味が変化する現象。熟成に寄与する一方、過度な酸化は品質低下につながる。"}, {"no": 312, "f": "醸造", "h": "oxidative winemaking", "i": "/ˈɒksɪdeɪtɪv ˈwaɪnmeɪkɪŋ/", "p": "名詞句", "g": "酸化的醸造", "s": 0, "r": "reductive winemaking（還元的醸造）／oxidative ageing（酸化熟成）／hyperoxidation（過酸化処理）", "n": "酸素との接触を意図的に利用し、色や香味の変化を促す醸造スタイル。"}, {"no": 313, "f": "醸造", "h": "phenolic extraction", "i": "/fəˈnɒlɪk ɪkˈstrækʃən/", "p": "名詞句", "g": "フェノール抽出", "s": 0, "r": "maceration（浸漬・醸し）／extraction（抽出）／phenolic compounds（フェノール化合物）", "n": "果皮や種子などから色素やタンニンなどのフェノール成分をワインへ移すこと。"}, {"no": 314, "f": "醸造", "h": "pigeage", "i": "/piˈʒaːʒ/", "p": "名詞", "g": "ピジャージュ（パンチダウン）", "s": 0, "r": "punching down（櫂入れ）／pumping over（ルモンタージュ）／cap management（果帽管理）", "n": "発酵中の果帽を棒や足などで液中に押し込む作業。果皮との接触を促し、色素やタンニンを抽出する。"}, {"no": 315, "f": "醸造", "h": "pneumatic press", "i": "/njuːˈmætɪk ˌpres/", "p": "名詞句", "g": "空気圧式プレス（ニューマチックプレス）", "s": 0, "r": "basket press（バスケットプレス）／pressing（圧搾）", "n": "空気袋を膨らませてブドウを圧搾する機械。穏やかで均一な圧力により、過度な渋みや苦味の抽出を抑えやすい。"}, {"no": 316, "f": "醸造", "h": "pomace", "i": "/ˈpʌmɪs/", "p": "名詞", "g": "搾りかす（果皮・種子などの固形残渣）", "s": 0, "r": "ripasso（リパッソ）／grape spirit（グレープスピリッツ）／marc（マール）", "n": "圧搾後に残るブドウの果皮・種子などの固形残渣。蒸留酒の原料や再醸造などに利用される。"}, {"no": 317, "f": "醸造", "h": "post-fermentation maceration", "i": "/ˌpəʊst fɜːmɛnˈteɪʃən ˌmæsəˈreɪʃən/", "p": "名詞句", "g": "発酵後浸漬", "s": 0, "r": "maceration（醸し）／extraction（抽出）", "n": "発酵終了後も果皮などをワインに接触させ続ける工程。タンニンや色素などを追加抽出する。"}, {"no": 318, "f": "醸造", "h": "potential alcohol", "i": "/pəˈtenʃəl ˈælkəhɒl/", "p": "名詞句", "g": "潜在アルコール", "s": 0, "r": "Brix（ブリックス・糖度指標）／must weight（果汁糖度）／chaptalisation（補糖）", "n": "果汁中の発酵可能な糖がすべてアルコールに変換された場合のおおよそのアルコール度数。"}, {"no": 319, "f": "醸造", "h": "pre-fermentation maceration", "i": "/priː ˌfɜːrmenˈteɪʃən ˌmæsəˈreɪʃən/", "p": "名詞句", "g": "発酵前浸漬", "s": 0, "r": "cold soak（低温浸漬）／post-fermentation maceration（発酵後浸漬）／extended maceration（長期浸漬）", "n": "アルコール発酵前に果汁と果皮を接触させ、低温で酸化や腐敗を抑えながら抽出を促す工程。"}, {"no": 320, "f": "醸造", "h": "press fraction", "i": "/ˈprɛs ˌfrækʃən/", "p": "名詞句", "g": "プレス画分（圧搾段階ごとに分けた果汁）", "s": 0, "r": "press wine（プレスワイン）／free-run juice（フリーラン果汁）", "n": "圧搾中に得られる果汁を、圧搾段階ごとに分けたもの。後半の画分ほどフェノールや固形分が多くなる傾向がある。"}, {"no": 321, "f": "醸造", "h": "press wine", "i": "/ˈpres ˌwaɪn/", "p": "名詞句", "g": "プレスワイン（圧搾により得られるワイン）", "s": 0, "r": "free-run juice（フリーラン果汁）／press fraction（プレス画分）", "n": "果皮を圧搾して得られる、色・タンニンの多いワイン。フリーランワインと別に扱い、必要に応じてブレンドする。"}, {"no": 322, "f": "醸造", "h": "pressing", "i": "/ˈprɛsɪŋ/", "p": "名詞", "g": "圧搾", "s": 0, "r": "crushing（破砕）／whole bunch pressing（全房圧搾）", "n": "果実や醪から果汁を搾り出す作業。白では主に発酵前、赤では主に発酵後に行う。"}, {"no": 323, "f": "醸造", "h": "primary fermentation", "i": "/ˈpraɪməri ˌfɜːmenˈteɪʃən/", "p": "名詞句", "g": "一次発酵（ベースワインを造る発酵）", "s": 0, "r": "second fermentation（二次発酵）／base wine（ベースワイン）", "n": "ベースワインを造る最初の発酵。二次発酵と区別して押さえたい語。"}, {"no": 324, "f": "醸造", "h": "protective winemaking", "i": "/prəˈtɛktɪv ˈwaɪnˌmeɪkɪŋ/", "p": "名詞句", "g": "保護的醸造（酸化を抑える造り）", "s": 0, "r": "inert gas（不活性ガス）／sulfur dioxide（二酸化硫黄）", "n": "低温・SO₂・不活性ガスなどで酸素との接触を抑え、果実味を保つ醸造手法。"}, {"no": 325, "f": "醸造", "h": "protein haze", "i": "/ˈproʊtiːn heɪz/", "p": "名詞句", "g": "タンパク濁り", "s": 0, "r": "protein stability（タンパク安定性）／fining（清澄処理）／bentonite（ベントナイト）", "n": "ワイン中の不安定なタンパク質が凝集して生じる濁り。"}, {"no": 326, "f": "醸造", "h": "protein stability", "i": "/ˈproʊtiːn stəˈbɪləti/", "p": "名詞句", "g": "タンパク安定性", "s": 0, "r": "protein haze（タンパク混濁）／bentonite（ベントナイト）／fining（清澄処理）", "n": "瓶詰め後にタンパク質が凝集して濁りを生じない状態。白・ロゼではベントナイト清澄が一般的。"}, {"no": 327, "f": "醸造", "h": "pumping over", "i": "/pʌmp ˈoʊvər/", "p": "名詞句", "g": "ルモンタージュ（液循環）", "s": 0, "r": "punching down（ピジャージュ）／rack and return（ラック・アンド・リターン）／cap management（果帽管理）", "n": "タンク下部の果汁を汲み上げ、果帽に散布する作業。抽出を促し、酸素供給や温度均一化にも役立つ。"}, {"no": 328, "f": "醸造", "h": "punching down", "i": "/pʌntʃ daʊn/", "p": "名詞句", "g": "ピジャージュ（櫂入れ）", "s": 0, "r": "pigeage（ピジャージュ）／pumping over（ルモンタージュ）", "n": "浮いた果帽を突き崩して果汁に沈める作業。果皮との接触を促し、色やタンニンの抽出を助ける。"}, {"no": 329, "f": "醸造", "h": "punt", "i": "/pʌnt/", "p": "名詞", "g": "パント（ボトル底のくぼみ）", "s": 0, "r": "magnum（マグナム）／deposit（澱）", "n": "瓶底中央の凹み。瓶の強度を高めるほか、澱を集めやすくする役割があるとされる。"}, {"no": 330, "f": "醸造", "h": "rack and return", "i": "/ˌræk ənd rɪˈtɜːn/", "p": "名詞句", "g": "ラック・アンド・リターン（果醪を抜き戻す果帽管理）", "s": 0, "r": "pumping over（ルモンタージュ）／cap management（果帽管理）", "n": "発酵中の液を別槽に抜き、果帽を崩して戻す抽出法（デレスタージュ）。果帽管理の一手法。"}, {"no": 331, "f": "醸造", "h": "racking", "i": "/ˈrækɪŋ/", "p": "名詞", "g": "澱引き（ラッキング）", "s": 0, "r": "lees（澱）／clarification（清澄化処理）", "n": "澱を残して上澄みを別容器へ移す作業。清澄化や適度な酸素接触を目的に行う。"}, {"no": 332, "f": "醸造", "h": "Rectified Concentrated Grape Must (RCGM)", "i": "/ˌɑːr siː dʒiː ˈɛm/", "p": "名詞句", "g": "精製濃縮果汁（RCGM、補糖・甘味調整用）", "s": 0, "r": "enrichment（エンリッチメント）／sweetening component（甘味成分）", "n": "精製して色や香味成分を除いた濃縮果汁。主に糖分を添加する目的で使用される。"}, {"no": 333, "f": "醸造", "h": "reduction", "i": "/rɪˈdʌkʃən/", "p": "名詞", "g": "還元臭", "s": 0, "r": "oxidation（酸化）／volatile sulfur compounds（揮発性硫黄化合物）", "n": "酸素の少ない環境で生じやすい、硫黄化合物による不快な臭い。通気や澱引きで軽減できる。"}, {"no": 334, "f": "醸造", "h": "reductive winemaking", "i": "/rɪˈdʌktɪv ˈwaɪnmeɪkɪŋ/", "p": "名詞句", "g": "還元的醸造", "s": 0, "r": "oxidative winemaking（酸化的醸造）／protective winemaking（保護的醸造）／inert gas（不活性ガス）", "n": "酸素との接触を抑え、香りや色の酸化を防ぐことを重視する醸造スタイル。"}, {"no": 335, "f": "醸造", "h": "reverse osmosis", "i": "/rɪˌvɜːs ɒzˈməʊsɪs/", "p": "名詞句", "g": "逆浸透（膜による成分調整技術）", "s": 0, "r": "dealcoholization（アルコール低減）／membrane filtration（膜濾過）", "n": "半透膜を用いて、ワイン中の水やアルコールなどを分離・調整する技術。減アルコールや果汁・ワインの濃縮などに利用される。"}, {"no": 336, "f": "醸造", "h": "rotary fermenter", "i": "/ˌrəʊtəri fəˈmɛntər/", "p": "名詞句", "g": "ロータリー・ファーメンター（回転式発酵槽）", "s": 0, "r": "cap management（果帽管理）", "n": "横型の発酵槽を回転させ、果皮と果汁を撹拌して抽出を促す発酵槽。密閉式のものもある。"}, {"no": 337, "f": "醸造", "h": "saignée", "i": "/sɛˈɲe/", "p": "名詞", "g": "セニエ（血抜き。果汁の一部を抜き取る手法）", "s": 0, "r": "direct pressing（ダイレクトプレス）", "n": "発酵前または発酵初期に果汁の一部を抜き、残った果醪の果皮比率を高める手法。抜いた果汁はロゼなどに利用される。"}, {"no": 338, "f": "醸造", "h": "screwcap", "i": "/ˈskruːkæp/", "p": "名詞", "g": "スクリューキャップ（回転式栓）", "s": 0, "r": "closure（栓）／cork taint（コルク臭）", "n": "金属製の回転式栓。コルク臭のリスクを避け、酸素透過を抑えやすい。豪州・NZを中心に広く普及している。"}, {"no": 339, "f": "醸造", "h": "semi-carbonic maceration", "i": "/ˌsemi kɑːˈbɒnɪk ˌmæsəˈreɪʃn/", "p": "名詞句", "g": "半炭酸ガス浸漬法", "s": 0, "r": "carbonic maceration（炭酸ガス浸漬法）／whole bunch fermentation（全房発酵）", "n": "全房のブドウを容器に入れ、下部の果粒が潰れて発生するCO₂のもとで発酵・浸漬する手法。フルーティーで軽快な赤ワインを生む。"}, {"no": 340, "f": "醸造", "h": "settling", "i": "/ˈsetlɪŋ/", "p": "名詞", "g": "沈降・静置清澄", "s": 0, "r": "clarification（清澄）／racking（澱引き）／flotation（浮上分離）", "n": "果汁中の固形物を静置して沈降させ、上澄みを分離しやすくする工程。"}, {"no": 341, "f": "醸造", "h": "shoulder", "i": "/ˈʃoʊldə/", "p": "名詞", "g": "ショルダー（瓶の肩）", "s": 0, "r": "neck（瓶の首）／punt（瓶底のくぼみ）", "n": "首から胴へ広がる部分。ボルドー型はいかり肩、ブルゴーニュ型はなで肩が特徴。"}, {"no": 342, "f": "醸造", "h": "single varietal", "i": "/ˌsɪŋɡl vəˈraɪətl/", "p": "名詞句", "g": "単一品種（ワイン）", "s": 0, "r": "varietal wine（品種名ワイン）／blending（ブレンド）", "n": "単一のブドウ品種から造るワイン。複数品種をブレンドしたワインと区別する表現。"}, {"no": 343, "f": "醸造", "h": "skin contact", "i": "/ˈskɪn ˌkɒntækt/", "p": "名詞句", "g": "スキンコンタクト（果皮浸漬。白の醸し）", "s": 0, "r": "maceration（醸し）／orange wine（オレンジワイン）", "n": "果汁を果皮と接触させる手法。白では香りやフェノールを引き出す目的で行われる。"}, {"no": 344, "f": "醸造", "h": "sorting table", "i": "/ˈsɔːtɪŋ ˌteɪbl/", "p": "名詞句", "g": "選果台（果実を選別する台）", "s": 0, "r": "optical sorting（光学選果）", "n": "病果・損傷果・未熟果などを取り除くための選別台。収穫後の果実の品質を整える。"}, {"no": 345, "f": "醸造", "h": "spontaneous fermentation", "i": "/spɒnˈteɪniəs ˌfɜːrmenˈteɪʃən/", "p": "名詞句", "g": "自然発酵", "s": 0, "r": "native yeast（土着酵母）／inoculation（酵母の植菌）／cultured yeast（培養酵母）", "n": "培養酵母を意図的に添加せず、環境中の微生物によって始まる発酵。"}, {"no": 346, "f": "醸造", "h": "stabilisation", "i": "/ˌsteɪbɪlaɪˈzeɪʃən/", "p": "名詞", "
