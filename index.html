<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワイン英語800 Web単語帳</title>
<style>
:root{--wine:#6B2737;--rose:#A8536A;--pink:#D8B4BF;--cream:#faf6ef;--red:#d61c2c;--ink:#2a2224}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
header{background:var(--wine);color:#fff;padding:12px 16px calc(10px + env(safe-area-inset-top,0)) 16px;position:sticky;top:0;z-index:10}
h1{font-size:16px;font-weight:800;letter-spacing:.04em}
h1 small{font-weight:400;font-size:11px;color:var(--pink);margin-left:8px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:rgba(255,255,255,.12);color:#f3dfe4;font-size:12.5px;font-weight:600;cursor:pointer;border:none}
.tab.on{background:#fff;color:var(--wine)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:999px;border:1px solid var(--pink);background:#fff;color:var(--wine);font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip.star{color:#b8860b;border-color:#e3c76f}.chip.star.on{background:#b8860b;border-color:#b8860b;color:#fff}
main{padding:0 16px 40px;max-width:560px;margin:0 auto}
/* card mode */
.progress{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8a6b73;margin:4px 2px 10px}
.pbar{flex:1;height:5px;background:#eddfe3;border-radius:3px;margin:0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rose);border-radius:3px;transition:width .25s}
.card{background:#fff;border:1px solid var(--pink);border-radius:16px;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 20px;cursor:pointer;box-shadow:0 3px 14px rgba(107,39,55,.08);position:relative}
.card .fld{position:absolute;top:12px;left:14px;font-size:10.5px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 9px}
.card .star{position:absolute;top:10px;right:14px;color:#c9a227;font-size:16px}
.hw{font-family:Georgia,serif;font-weight:700;font-size:30px;color:#171114;line-height:1.2;overflow-wrap:anywhere}
.ipa{font-size:14px;color:var(--wine);margin-top:8px}
.pos{display:inline-block;margin-top:10px;font-size:11px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 10px}
.hint{position:absolute;bottom:12px;font-size:11px;color:#c9aeb6}
.gloss{font-size:21px;font-weight:800;color:var(--red);line-height:1.4}
.note{font-size:13px;color:#5c5254;line-height:1.75;margin-top:14px;text-align:left}
.rel{font-size:12px;color:var(--rose);line-height:1.7;margin-top:12px;text-align:left;border-top:1px dotted var(--pink);padding-top:10px}
.rel b{font-size:10px;border:1px solid var(--rose);border-radius:4px;padding:0 4px;margin-right:6px;font-weight:600}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px 0;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer}
.btn.ok{background:var(--wine);color:#fff}
.btn.ng{background:#fff;color:var(--wine);border:1.5px solid var(--pink)}
.btn.sm{flex:none;padding:10px 14px;font-size:12px;background:#fff;border:1px solid var(--pink);color:var(--wine)}
.cardfoot{display:flex;gap:8px;margin-top:10px;justify-content:center}
.done{background:#fff;border:1px solid var(--pink);border-radius:16px;padding:36px 20px;text-align:center}
.done .big{font-size:34px}
.done p{margin-top:10px;font-size:14px;color:#5c5254;line-height:1.8}
/* list mode */
.lrow{background:#fff;border:1px solid #ecd9de;border-radius:12px;padding:12px 14px;margin-bottom:9px}
.lr1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lr1 .no{font-size:10px;color:#b5959e}
.lr1 .h{font-family:Georgia,serif;font-weight:700;font-size:17px}
.lr1 .st{color:#c9a227;font-size:12px}
.lr1 .ip{font-size:11px;color:var(--wine)}
.lr1 .po{font-size:9.5px;color:#fff;background:var(--rose);border-radius:999px;padding:1px 7px}
.lg{font-size:14px;font-weight:700;color:var(--red);margin-top:5px}
.lg.hide{color:transparent;background:#f6c8ce;border-radius:5px;cursor:pointer;user-select:none}
.ln{font-size:11.5px;color:#6d6265;line-height:1.65;margin-top:5px}
.lrl{font-size:11px;color:var(--rose);margin-top:4px}
.sheetbar{display:flex;align-items:center;gap:10px;margin:2px 2px 12px;font-size:12.5px;color:#6d5257}
.switch{width:42px;height:24px;border-radius:12px;background:#e5d2d7;position:relative;cursor:pointer;transition:.2s;border:none}
.switch.on{background:var(--red)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:21px}
footer{max-width:560px;margin:0 auto;padding:0 16px 30px;font-size:10.5px;color:#b5959e;text-align:center;line-height:1.7}
.qbar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;font-size:12.5px;color:#6d5257}
.qopt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1.5px solid #e5d2d7;border-radius:12px;background:#fff;font-size:14.5px;line-height:1.5;cursor:pointer;color:#3a262c}
.qopt:disabled{cursor:default;opacity:1}
.qopt.correct{border-color:#2e9e5b;background:#eefaf2;color:#1d6b3d;font-weight:700}
.qopt.wrong{border-color:var(--red);background:#fdeeee;color:var(--red)}
.qq{background:#fff;border:1.5px solid #e5d2d7;border-radius:14px;padding:18px 16px;margin-bottom:4px}
.qq .hw{font-size:22px;font-weight:700;color:#3a262c}
.qq .ipa{color:#9a7f87;font-size:13px;margin-top:2px}
.qq .gj{font-size:17px;font-weight:700;color:#3a262c;line-height:1.5}
.qwrong{margin-top:14px;background:#fff;border:1.5px solid #e5d2d7;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.8;text-align:left}
.qwrong b{color:var(--red)}
</style></head><body>

}, {"no": 796, "f": "ビジネス", "h": "wine futures", "i": "/waɪn ˈfjuːtʃərz/", "p": "名詞", "g": "先物取引", "s": 0, "r": "", "n": ""}, {"no": 797, "f": "ビジネス", "h": "wine key", "i": "/ˈwaɪn kiː/", "p": "名詞句", "g": "ソムリエナイフ", "s": 0, "r": "", "n": ""}, {"no": 798, "f": "ビジネス", "h": "wine lake", "i": "/ˈwaɪn leɪk/", "p": "名詞句", "g": "ワインの湖（大量のワイン余剰）", "s": 0, "r": "", "n": ""}, {"no": 799, "f": "ビジネス", "h": "wine list", "i": "/ˈwaɪn ˌlɪst/", "p": "名詞句", "g": "ワインリスト", "s": 0, "r": "", "n": ""}, {"no": 800, "f": "ビジネス", "h": "wine tourism", "i": "/ˈwaɪn ˌtʊərɪzəm/", "p": "名詞句", "g": "ワインツーリズム（ワイン観光）", "s": 0, "r": "", "n": ""}];
const FIELDS=["栽培","環境","病害虫","成分・化学","醸造","スパークリングワイン","酒精強化ワイン","テイスティング","産地・分類","ビジネス"];
let mode="card", filt="all", idx=0, flipped=false, order=null, shuffleOn=false;
let mem={};
try{mem=JSON.parse(localStorage.getItem("wine800")||"{}")}catch(e){mem={}}
function save(){try{localStorage.setItem("wine800",JSON.stringify(mem))}catch(e){}}
function pool(){
 let p=W.map((w,i)=>i);
 if(filt==="star")p=p.filter(i=>W[i].s);
 else if(filt!=="all")p=p.filter(i=>W[i].f===filt);
 if(order&&shuffleOn){p=order.filter(i=>p.includes(i))}
 return p;
}
function mkShuffle(){order=W.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
function chips(){
 const el=document.getElementById("filters");
 let h=`<button class="chip ${filt==="all"?"on":""}" data-f="all">すべて (${W.length})</button>`;
 if(W.filter(w=>w.s).length) h+=`<button class="chip star ${filt==="star"?"on":""}" data-f="star">★連載の語 (${W.filter(w=>w.s).length})</button>`;
 for(const f of FIELDS){const n=W.filter(w=>w.f===f).length;if(n)h+=`<button class="chip ${filt===f?"on":""}" data-f="${f}">${f} (${n})</button>`}
 el.innerHTML=h;
 el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filt=c.dataset.f;idx=0;flipped=false;quiz=null;render()});
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderCard(){
 const p=pool(); const m=document.getElementById("main");
 if(!p.length){m.innerHTML='<div class="done"><p>この条件の単語はありません。</p></div>';return}
 if(idx>=p.length){
  const learned=p.filter(i=>mem[i]).length;
  m.innerHTML=`<div class="done"><div class="big">🍷</div><p><b>1周おつかれさまでした</b><br>${p.length}語中 ${learned}語を「覚えた」にしました。</p><div class="btns"><button class="btn ok" id="again">もう1周</button><button class="btn ng" id="miss">未習得だけ復習</button></div></div>`;
  document.getElementById("again").onclick=()=>{idx=0;flipped=false;render()};
  document.getElementById("miss").onclick=()=>{
   const ms=p.filter(i=>!mem[i]);
   if(!ms.length){alert("未習得の語はありません。すばらしい！");return}
   order=ms; shuffleOn=true; idx=0; flipped=false; render();
  };
  return;
 }
 const w=W[p[idx]]; const learned=p.filter(i=>mem[i]).length;
 let inner;
 if(!flipped){
  inner=`<div class="hw">${esc(w.h)}</div><div class="ipa">${esc(w.i)}</div><span class="pos">${esc(w.p)}</span><div class="hint">タップで意味を表示</div>`;
 }else{
  inner=`<div class="gloss">${esc(w.g)}</div>`+(w.n?`<div class="note">▸ ${esc(w.n)}</div>`:``)+(w.r?`<div class="rel"><b>関連</b>${esc(w.r)}</div>`:"");
 }
 m.innerHTML=`
 <div class="progress"><span>${idx+1} / ${p.length}</span><div class="pbar"><i style="width:${(idx)/p.length*100}%"></i></div><span>覚えた ${learned}</span></div>
 <div class="card" id="card"><span class="fld">${esc(w.f)}</span>${w.s?'<span class="star">★</span>':""}${inner}</div>
 <div class="btns"><button class="btn ng" id="later">まだ</button><button class="btn ok" id="know">覚えた</button></div>
 <div class="cardfoot"><button class="btn sm" id="shuf">${shuffleOn?"✓ シャッフル中":"シャッフル"}</button><button class="btn sm" id="reset">記録をリセット</button></div>`;
 document.getElementById("card").onclick=()=>{flipped=!flipped;renderCard()};
 document.getElementById("know").onclick=()=>{mem[p[idx]]=1;save();idx++;flipped=false;renderCard()};
 document.getElementById("later").onclick=()=>{delete mem[p[idx]];save();idx++;flipped=false;renderCard()};
 document.getElementById("shuf").onclick=()=>{shuffleOn=!shuffleOn;if(shuffleOn)mkShuffle();else order=null;idx=0;flipped=false;renderCard()};
 document.getElementById("reset").onclick=()=>{if(confirm("「覚えた」の記録をすべて消しますか？")){mem={};save();renderCard()}};
}
let sheet=true;
function renderList(){
 const p=pool(); const m=document.getElementById("main");
 let h=`<div class="sheetbar"><button class="switch ${sheet?"on":""}" id="sw"><i></i></button>赤シートモード（語義を隠す・タップで表示）</div>`;
 for(const i of p){
  const w=W[i];
  h+=`<div class="lrow"><div class="lr1"><span class="no">${String(i+1).padStart(3,"0")}</span><span class="h">${esc(w.h)}</span>${w.s?'<span class="st">★</span>':""}<span class="ip">${esc(w.i)}</span><span class="po">${esc(w.p)}</span></div>
  <div class="lg ${sheet?"hide":""}" data-g>${esc(w.g)}</div>
  `+(w.n?`<div class="ln">▸ ${esc(w.n)}</div>`:``)+(w.r?`<div class="lrl">関連： ${esc(w.r)}</div>`:"")+`</div>`;
 }
 m.innerHTML=h;
 document.getElementById("sw").onclick=()=>{sheet=!sheet;renderList()};
 m.querySelectorAll("[data-g]").forEach(g=>g.onclick=()=>g.classList.remove("hide"));
}
// ---------- クイズ（4択・10問1セット） ----------
let quiz=null, quizDir="ej";
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mkQuiz(){
 const p=pool().slice();
 if(p.length<4){quiz={small:true};return}
 const qIdx=shuffleArr(p.slice()).slice(0,Math.min(10,p.length));
 const qs=qIdx.map(i=>{
  const w=W[i];
  let cand=pool().filter(j=>j!==i&&W[j].f===w.f&&W[j].g!==w.g);
  if(cand.length<3)cand=W.map((_,j)=>j).filter(j=>j!==i&&W[j].g!==w.g);
  const ds=shuffleArr(cand.slice()).slice(0,3);
  const opts=shuffleArr([i,...ds]);
  return {i,opts};
 });
 quiz={qs,qi:0,score:0,wrong:[],answered:false};
}
function renderQuiz(){
 const m=document.getElementById("main");
 if(!quiz)mkQuiz();
 if(quiz.small){m.innerHTML='<div class="done"><p>クイズには4語以上必要です。分野を変えてお試しください。</p></div>';return}
 const bar=`<div class="qbar"><span>正解 ${quiz.score} / ${quiz.qs.length}問</span><button class="btn sm" id="qdir">${quizDir==="ej"?"英語 → 日本語":"日本語 → 英語"}</button></div>`;
 if(quiz.qi>=quiz.qs.length){
  let h=`<div class="done"><div class="big">${quiz.score===quiz.qs.length?"🏆":"🍷"}</div><p><b>クイズ終了</b><br>${quiz.qs.length}問中 ${quiz.score}問正解でした。</p>`;
  if(quiz.wrong.length){
   h+=`<div class="qwrong"><b>間違えた語</b><br>`+quiz.wrong.map(i=>`${esc(W[i].h)} ── ${esc(W[i].g)}`).join("<br>")+`</div>`;
  }
  h+=`<div class="btns"><button class="btn ok" id="qagain">もう1セット</button></div></div>`;
  m.innerHTML=bar+h;
  document.getElementById("qagain").onclick=()=>{quiz=null;renderQuiz()};
  document.getElementById("qdir").onclick=()=>{quizDir=quizDir==="ej"?"je":"ej";quiz=null;renderQuiz()};
  return;
 }
 const q=quiz.qs[quiz.qi], w=W[q.i];
 const qhtml=quizDir==="ej"
  ?`<div class="qq"><span class="fld">${esc(w.f)}</span><div class="hw">${esc(w.h)}</div><div class="ipa">${esc(w.i)}</div></div>`
  :`<div class="qq"><span class="fld">${esc(w.f)}</span><div class="gj">${esc(w.g)}</div></div>`;
 const opts=q.opts.map((oi,k)=>{
  const t=quizDir==="ej"?W[oi].g:W[oi].h;
  return `<button class="qopt" data-oi="${oi}">${String.fromCharCode(65+k)}．${esc(t)}</button>`;
 }).join("");
 m.innerHTML=bar+`<div class="progress"><span>第 ${quiz.qi+1} 問 / ${quiz.qs.length}</span><div class="pbar"><i style="width:${quiz.qi/quiz.qs.length*100}%"></i></div><span></span></div>`+qhtml+opts;
 document.getElementById("qdir").onclick=()=>{quizDir=quizDir==="ej"?"je":"ej";quiz=null;renderQuiz()};
 m.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
  if(quiz.answered)return;
  quiz.answered=true;
  const oi=parseInt(b.dataset.oi);
  m.querySelectorAll(".qopt").forEach(x=>{
   x.disabled=true;
   if(parseInt(x.dataset.oi)===q.i)x.classList.add("correct");
  });
  if(oi===q.i){quiz.score++}else{b.classList.add("wrong");quiz.wrong.push(q.i)}
  setTimeout(()=>{quiz.qi++;quiz.answered=false;renderQuiz()},oi===q.i?650:1400);
 });
}
function render(){
 document.getElementById("tabCard").classList.toggle("on",mode==="card");
 document.getElementById("tabList").classList.toggle("on",mode==="list");
 document.getElementById("tabQuiz").classList.toggle("on",mode==="quiz");
 chips();
 if(mode==="card")renderCard();else if(mode==="quiz")renderQuiz();else renderList();
}
document.getElementById("tabCard").onclick=()=>{mode="card";render()};
document.getElementById("tabList").onclick=()=>{mode="list";render()};
document.getElementById("tabQuiz").onclick=()=>{mode="quiz";quiz=null;render()};
render();
</script></body></html>
